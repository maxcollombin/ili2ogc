# Contract for the `.ili` -> JSON Schema conversion pipeline (backlog item
# 5 - see docs/jsonschema-conversion-strategy.md).
#
# Mirrors mappings/grammar-rules.yml's role for the grammar pipeline: one
# entry per IlisMeta16 concept a converter needs a decision for. Every
# concept relevant to attribute typing/class shape must appear here, either
# `status: mapped` (field bindings live in
# spec/conversion/jsonschema-mapping.yml) or `status: backlog` (deliberately
# out of scope, with a reason - RULE #7, one thematic slice at a time).
# Checked by scripts/validate_conversion_spec.py.

concepts:
  NumType:
    qualified_name: IlisMeta16.ModelData.NumType
    status: mapped

  TextType:
    qualified_name: IlisMeta16.ModelData.TextType
    status: mapped

  EnumType:
    qualified_name: IlisMeta16.ModelData.EnumType
    status: mapped

  Class:
    qualified_name: IlisMeta16.ModelData.Class
    status: mapped
    note: >
      Covers both `CLASS` and `STRUCTURE` declarations (same metamodel
      class, discriminated by `Kind` - see structureDef/classDef in
      spec/grammar/mapping/03_classes_and_structures.yml). Own+inherited
      SCALAR attributes convert into a flat JSON object - see the
      StructureNesting/MultiValue/ReferenceType/Role entries below for
      the non-scalar cases.

  FormattedType:
    qualified_name: IlisMeta16.ModelData.FormattedType
    status: mapped
    note: >
      NumType subclass (own: Format, TEXT, mandatory - names a
      predefined/custom format e.g. `INTERLIS.XMLDate`, or a STRUCT-based
      template) -> conservative `{"type": "string"}`. No `pattern`/
      `format` keyword is derived from the format name (would need a
      lookup table of predefined INTERLIS format names to regexes - not
      attempted here, `Format`'s own value is not surfaced either since
      plain `string` already covers every legal value without risking a
      wrong/overly strict pattern).

  BlackboxType:
    qualified_name: IlisMeta16.ModelData.BlackboxType
    status: mapped
    note: >
      XML/BINARY blackbox content -> `{"type": "string"}` (neither
      variant has a native JSON Schema content-shape equivalent - XML as
      an embedded document, BINARY typically base64 in a JSON transfer).
      `Kind` ("Xml"/"Binary", own attribute, mandatory - confirmed via
      ilismeta16-kind-values.yml) is not dropped: surfaced as an
      informational `x-interlis-blackbox-kind` marker, same RULE #5
      pattern as MultiValue's `x-interlis-ordered`.

  BooleanType:
    qualified_name: IlisMeta16.ModelData.BooleanType
    status: mapped
    note: >
      Pure marker type (own: {}, matches only the BOOLEAN keyword - see
      spec/grammar/mapping/06_types.yml booleanType()) -> plain
      `{"type": "boolean"}`, no further fields to bind.

  CoordType:
    qualified_name: IlisMeta16.ModelData.CoordType
    status: mapped
    note: >
      A `COORD`/`MULTICOORD` attribute maps to a GeoJSON/JSON-FG-style
      position tuple - `{"type": "array", "prefixItems": [<axis 1
      number schema>, <axis 2>, ...], "items": false, "minItems": N,
      "maxItems": N}` (N = 2 or 3, from `xtf.schema.coord_axes`,
      association `AxisSpec` {1..3} `NumType` ORDERED). Each
      `prefixItems` entry reuses `_num_type_schema` directly on the
      axis's own `Min`/`Max` (an `AxisSpec.Axis` is itself a `NumType`
      instance - no duplicated numeric-range logic). Falls back to an
      open-ended `{"type": "array", "items": {"type": "number"}}` when
      `Axis` isn't resolved (e.g. an external domain not loaded via
      `--repo`) - meaningfully typed rather than
      `x-interlis-unsupported`. `Multi` (own BOOLEAN,
      `MULTICOORD`/possibly-disjoint points) wraps the position schema
      in one more array level - no marker needed, the extra nesting
      alone is a complete, lossless representation.
      Chosen deliberately to already match the eventual `.xtf ->
      JSON-FG` position encoding, so this shape is expected to be reused
      as-is rather than redesigned at that stage.

  LineType:
    qualified_name: IlisMeta16.ModelData.LineType
    status: mapped
    note: >
      `Kind in {Polyline, DirectedPolyline}` -> `{"type": "array",
      "items": <CoordType above>}` (an ordered array of positions).
      `Kind in {Surface, Area}` -> one more array level (boundary
      rings): `{"type": "array", "items": {"type": "array", "items":
      <position>}}` - eCH-0031 encodes `SURFACE` and `AREA` identically
      on the wire (`AREA` is a semantic "WITHOUT OVERLAPS" constraint
      over the same shape, not a distinct geometry); the first ring is
      the outer boundary, the rest are holes - no native JSON Schema
      keyword expresses "first item is special", surfaced instead as an
      informational `x-interlis-boundary-order: "outer-first"` marker
      (RULE #5). Vertex coordinate shape comes from
      `xtf.schema.line_coord_type` (association `LineCoord`, walks the
      `EXTENDS` chain) fed into the SAME position-tuple logic as
      `CoordType` above (reused, not duplicated) - a vertex position is
      never itself `Multi` regardless of the referenced `CoordType`
      domain's own `Multi` flag (that flag only applies when the
      `CoordType` is used directly as an attribute's type). `Multi` on
      the `LineType` itself (`MULTIPOLYLINE`/`MULTISURFACE`/
      `MULTIAREA`) wraps the whole result in one more array level, same
      as `CoordType.Multi`.
      ARC segments (a circular arc between two vertices, `WITH (...,
      ARCS)`) have no representation in this position-array shape - a
      straight-line-only simplification GeoJSON itself shares, not
      something this mapping alone introduces; a custom `LINE FORM`
      segment is likewise not structurally interpreted (same scope limit
      already documented for the XTF validator, `xtf/validate.py`).

  EnumTreeValueType:
    qualified_name: IlisMeta16.ModelData.EnumTreeValueType
    status: backlog
    note: "ENUMTREE OF domains - not seen in the real corpus fixtures used so far, deferred."

  StructureNesting:
    qualified_name: IlisMeta16.ModelData.Class
    status: mapped
    note: >
      An attribute typed as a `Class(Kind=Structure)` maps to
      `{"$ref": "#/$defs/<Name>"}` - the referenced class gets its own
      top-level $defs entry (recursion-safe: a class is discovered and
      converted at most once, by identity, so self-referencing/mutually
      recursive structures produce a valid recursive $ref, never infinite
      expansion). Known limitation carried over from xtf.schema itself,
      not fixed here (RULE #7 - a metamodel-binding gap belongs to a
      different pipeline layer): `MANDATORY` on a structure-typed
      attribute is not captured ANYWHERE in the built metamodel (`Class`
      extends `Type`, not `DomainType`, so it has no `Mandatory` own
      attribute for `resolve_attribute` to read - confirmed empirically,
      `attr.MANDATORY` on a bare `Single: MANDATORY Sub;` attribute is
      simply absent from the built AttrOrParam AND its Type instance) -
      such an attribute therefore never appears in `required`, regardless
      of its actual MANDATORY declaration.

  MultiValue:
    qualified_name: IlisMeta16.ModelData.MultiValue
    status: mapped
    note: >
      `BAG {m..n} OF X` / `LIST {m..n} OF X` -> `type: array`, `items` =
      the SAME dispatch used for a plain attribute (scalar mapping, or
      `$ref` if X is itself a Class/Structure) applied to
      `MultiValue.BaseType`, `minItems`/`maxItems` from
      `MultiValue.Multiplicity.Min`/`.Max` (`Max == "*"` -> maxItems
      omitted). `MultiValue.Ordered` (True=LIST, False=BAG) has no native
      JSON Schema equivalent (a JSON array is always ordered syntactically
      - BAG's "order doesn't matter" is a semantic note, and importantly
      NOT the same as `uniqueItems` since a BAG still allows duplicates) -
      surfaced instead as an informational `x-interlis-ordered: bool`
      marker, RULE #5 style, rather than silently lost.

  ReferenceType:
    qualified_name: IlisMeta16.ModelData.ReferenceType
    status: mapped
    note: >
      Plain `REFERENCE TO X` (own: External, BOOLEAN mandatory; target
      class reached via the BaseClass association, same generic mechanism
      as Role - `xtf.schema.reference_target_class`, reused directly, not
      duplicated) -> `{"type": "string"}` (the OID value, matching how
      the XTF wire format transfers a reference: a `REF="<oid>"` XML
      attribute, never the referenced object inline - unlike a
      Class/STRUCTURE attribute, which DOES inline via `$ref`, see
      StructureNesting above). Declared target class name and the
      `(EXTERNAL)` flag have no native JSON Schema equivalent - surfaced
      as informational `x-interlis-reference-target`/
      `x-interlis-reference-external` markers (RULE #5), reusing
      `xtf.schema.reference_external_status` directly.
      A `BAG`/`LIST OF REFERENCE TO X` element (not seen in the 54-file
      real corpus, but grammatically legal) still gets a bare
      `{"type": "string"}` rather than the unsupported marker - only the
      two informational markers require the full `ResolvedAttribute`
      context unavailable at that level.

  Role:
    qualified_name: IlisMeta16.ModelData.Role
    status: mapped
    note: >
      Embedded association roles (transferred as pseudo-attributes via
      `xtf.schema.embedded_roles_of`/`schema_members_of`, eCH-0031
      SS4.3.9) - opt-in via a `symbol_table` parameter on
      `class_to_json_schema`/`model_to_json_schema` (`None`, the default,
      preserves plain-`attributes_of` behavior; `cli.cmd_convert` always
      passes `builder.symbol_table`). Mapped the SAME way as a plain
      `REFERENCE TO` (ReferenceType above) - `{"type": "string"}` +
      `x-interlis-reference-target`/`x-interlis-reference-external` -
      NEVER `$ref`/inlined: `resolve_attribute` resolves a `Role` to
      `type_kind="Class"`, the SAME shape as genuine `Class(Kind=Structure)`
      nesting (StructureNesting above), but `Role`'s target is always
      `Kind="Class"` (a real class instance, transferred via `REF`/OID),
      never `Kind="Structure"` - confirmed by `xtf/validate.py`'s own
      dispatch (`_validate_resolved_attr`: `Kind == "Structure"` recurses
      into inline content, anything else expects a `REF`). `_is_structure`
      (`src/interlis/convert/jsonschema.py`) is the single dispatch point
      checking this for both sources (`attributes_of` AND
      `embedded_roles_of`), so nesting-vs-reference is decided by the
      target's OWN `Kind`, never by which enumeration function produced
      the attribute.
      Cardinality: NO array-wrapping needed - confirmed by
      `embedded_roles_of`'s own embedding algorithm (`xtf/schema.py`):
      the surfaced `embedded_role` is ALWAYS the non-multi side of the
      association (when one role has `Max == "*"`, the OTHER, non-multi
      role is what gets embedded; the multi side is never itself embedded
      as a pseudo-attribute - eCH-0031 SS4.3.9.2, "transferred as a
      separate class instance" instead), so a `Role`'s own `Multiplicity`
      never needs to bypass the `MultiValue`-based array handling above.
      `_role_is_multi`'s own known simplification (only `Max == "*"`
      counts as "multi", a bounded `{0..5}` role would not) is a
      pre-existing `xtf.schema`-layer scope limit, not fixed here
      (RULE #7 - different layer).

  Inheritance:
    qualified_name: IlisMeta16.ModelData.Inheritance
    status: backlog
    note: >
      EXTENDS/CHOICE/RESTRICTION beyond the flat own+inherited attribute
      merge already reused from xtf.schema.attributes_of() - polymorphic
      JSON Schema shape (oneOf/discriminator) not designed yet.
