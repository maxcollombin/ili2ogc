# Contract for the `.ili` -> SQL DDL conversion pipeline (backlog item 14 -
# see docs/sql-conversion-strategy.md and docs/interlis-ogc-architecture.md).
#
# Mirrors mappings/ilismeta16-to-jsonschema-rules.yml's role for the JSON
# Schema pipeline: one entry per IlisMeta16 concept a converter needs a
# decision for. Every concept relevant to table/column/constraint shape must
# appear here, either `status: mapped` (field bindings live in
# spec/conversion/sql-mapping.yml) or `status: backlog` (deliberately out of
# scope for Lot 1, with a reason - RULE #7). Checked by
# scripts/validate_sql_conversion_spec.py.
#
# Lot 1 scope (concept mapping is dialect-neutral; two renderers exist -
# PostgreSQL and GeoPackage/SQLite, see convert/sql.py's
# render_postgresql/render_gpkg): a plain `Class` (`Kind=Class`, never
# `Kind=Structure`, never `View`) becomes one `CREATE TABLE`, with a
# synthetic `id text UNIQUE NOT NULL` (deliberately NOT `PRIMARY KEY`/GDAL's
# own default FID column name `ogc_fid` - verified empirically that GDAL
# excludes whatever it detects as PRIMARY KEY from the INSERT column list
# entirely, expecting the database to auto-generate it, so a Feature's
# `"id"` was NEVER actually written on `-append`; `"id"` matches exactly
# what the JSON-FG reader itself exposes as a plain field - see
# docs/sql-conversion-strategy.md). GDAL still
# does the actual DATA LOADING (`ogr2ogr -append`); this pipeline only
# generates the SCHEMA (table/column declarations + UNIQUE/FOREIGN KEY
# constraints) - see docs/sql-conversion-strategy.md for why this division
# of labor was chosen over "GDAL creates, we patch after" (SQLite/GPKG
# cannot add constraints to an existing table via ALTER TABLE at all - the
# gpkg dialect declares UNIQUE/FOREIGN KEY inline at CREATE TABLE time
# instead, plus bootstraps gpkg_contents/gpkg_geometry_columns/
# gpkg_spatial_ref_sys, since a table this pipeline creates by plain SQL
# is otherwise invisible to GDAL's own `-append`).

concepts:
  NumType:
    qualified_name: IlisMeta16.ModelData.NumType
    status: mapped
    note: "integer if Min/Max both parse as decimal-point-free integers (reuses convert/jsonschema.py's _is_integer_range), else numeric."

  TextType:
    qualified_name: IlisMeta16.ModelData.TextType
    status: mapped
    note: >
      Kind=Name -> varchar(255), Kind=Uri -> varchar(1023) (same exact
      bounds as the JSON Schema pipeline's pattern/format+maxLength -
      eCH-0031 SS3.2.2/SS3.8.1). Kind in {Text, MText}: varchar(MaxLength)
      when MaxLength is set, else plain text.

  EnumType:
    qualified_name: IlisMeta16.ModelData.EnumType
    status: mapped
    note: >
      Plain `text` column - no CHECK(... IN (...)) in Lot 1 (deliberately
      deferred, see Constraint entry below: Lot 1 scope is UNIQUE/FOREIGN
      KEY only, not CHECK of any kind, even though an enum's value set is
      static and CHECK(IN(...)) would be dialect-neutral and easy - kept
      out to respect the agreed Lot 1 boundary, not a technical limit).

  BooleanType:
    qualified_name: IlisMeta16.ModelData.BooleanType
    status: mapped
    note: "boolean column."

  FormattedType:
    qualified_name: IlisMeta16.ModelData.FormattedType
    status: mapped
    note: >
      Same 3 well-known format names as the JSON Schema pipeline
      (XMLDate/XMLTime/XMLDateTime -> date/time/timestamp) - any other
      Format value falls back to plain text, same conservative stance as
      convert/jsonschema.py's _formatted_type_schema.

  BlackboxType:
    qualified_name: IlisMeta16.ModelData.BlackboxType
    status: mapped
    note: "Plain text column (same conservative choice as the JSON Schema pipeline)."

  CoordType:
    qualified_name: IlisMeta16.ModelData.CoordType
    status: mapped
    note: >
      PostGIS `geometry(<SFA type>, <SRID>)` column
      (docs/interlis-geometry-sfa-mapping.md: Point/MultiPoint). SRID from
      the eCH-0117 `!!@CRS=EPSG:<code>` meta-attribute (same resolution as
      convert/jsonfg.py's `_crs_uri`, reused directly) - an attribute whose
      CRS can't be resolved gets no column at all (surfaced as a `-- NOTE`
      comment in the generated DDL, RULE #5) rather than an untyped/wrong
      SRID geometry column.

  LineType:
    qualified_name: IlisMeta16.ModelData.LineType
    status: mapped
    note: >
      Same SFA table as CoordType (docs/interlis-geometry-sfa-mapping.md):
      Kind in {Polyline, DirectedPolyline} -> LineString/MultiLineString,
      Kind in {Surface, Area} -> Polygon/MultiPolygon. ARC segments
      (circular-arcs) have no SFA-native column type (SFA is strictly
      linear) - out of scope for Lot 1's column typing, same as the JSON
      Schema pipeline's own straight-line-only position-array limit.

  Class:
    qualified_name: IlisMeta16.ModelData.Class
    status: mapped
    note: >
      Only `Kind=Class` roots become a `CREATE TABLE` (never `Kind=Structure`
      directly - see StructureNesting below for how a STRUCTURE-typed
      ATTRIBUTE is handled, and never `View` - Lot 1 does not generate
      `CREATE VIEW`, left for a later lot alongside backlog item 13).

  ObjectOID:
    qualified_name: IlisMeta16.ModelData.ObjectOID
    status: mapped
    note: >
      Every table gets a synthetic `id text UNIQUE NOT NULL` regardless of
      the Class's own OID clause/type (`AnyOIDType`/a named TEXT or NUM
      domain/none at all) - same uniform-string treatment the JSON Schema
      pipeline already gives every reference (`ReferenceType`/`Role` ->
      plain `{"type": "string"}`), and matching how `convert/jsonfg.py`
      already treats `XtfObject.tid` as an opaque string regardless of the
      declared OID type (indeed the SAME `"id"` JSON-FG already puts on
      every Feature - `object_to_feature`). `id`, and NEVER `PRIMARY KEY`
      (originally `ogc_fid`, GDAL's own PostgreSQL default FID name -
      revised 2026-08-27): verified empirically (a real `ogr2ogr -append`
      against a live PostgreSQL AND GeoPackage) that GDAL treats WHATEVER
      column it detects as `PRIMARY KEY` as an auto-managed FID slot,
      excluded from the INSERT column list entirely - a Feature's `"id"`
      was NEVER actually written into it, silently staying NULL and
      violating its own NOT NULL constraint. `"id"` matches exactly what
      the JSON-FG reader itself exposes as a plain STRING FIELD (confirmed
      via `ogrinfo`) - `UNIQUE NOT NULL` (never `PRIMARY KEY`) so GDAL
      writes it as a normal field instead of managing it. See
      docs/sql-conversion-strategy.md for the full investigation.

  StructureNesting:
    qualified_name: IlisMeta16.ModelData.Class
    status: mapped
    note: >
      A `Class(Kind=Structure)`-typed attribute is flattened INLINE onto
      the SAME table, ONE level only (`<attr>_<subattr>` columns) - not a
      separate related table (unlike a `BAG`/`LIST OF STRUCTURE`, see
      MultiValue below, which genuinely needs one for cardinality reasons).
      A structure nested a SECOND level deep (a flattened sub-attribute
      that is itself a STRUCTURE) is NOT further flattened in Lot 1 -
      surfaced as a `-- NOTE` comment (RULE #5) rather than silently
      dropped or produced with an ambiguous column name. Same known
      metamodel limitation as the JSON Schema pipeline
      (mappings/ilismeta16-to-jsonschema-rules.yml's StructureNesting
      entry): `MANDATORY` on a structure-typed attribute is never captured
      by `resolve_attribute` (`Class` extends `Type`, not `DomainType`), so
      every flattened sub-column is nullable regardless of the source
      attribute's own MANDATORY declaration - not fixed here, a
      builder-layer gap.

  ReferenceType:
    qualified_name: IlisMeta16.ModelData.ReferenceType
    status: mapped
    note: >
      Plain `REFERENCE TO X` -> a `text` column (typed to match the target
      table's `id`) PLUS a real `FOREIGN KEY ... REFERENCES` (Lot 1's
      marquee feature - see docs/interlis-ogc-architecture.md's Prevalence
      table: REFERENCE TO touches ~30% of the real corpus). An unresolved
      target class (declared target not reachable, e.g. no `--repo` given)
      gets a `-- NOTE` comment instead of a column - never a dangling FK.

  Role:
    qualified_name: IlisMeta16.ModelData.Role
    status: mapped
    note: >
      Embedded association roles - same FOREIGN KEY treatment as
      ReferenceType above (both resolve via `xtf.schema.reference_target_class`,
      reused directly). Opt-in via a `symbol_table` parameter, same
      precondition as `convert/jsonschema.py`'s `class_to_json_schema`.

  MultiValue:
    qualified_name: IlisMeta16.ModelData.MultiValue
    status: backlog
    note: >
      `BAG {m..n} OF X` / `LIST {m..n} OF X` - needs a related CHILD TABLE
      (1:N), not a column on the parent table (real precedent: ili2db
      creates one, linked via a `D_<attributename>`-style FOREIGN KEY back
      to the parent plus an ordering column for LIST - see
      docs/sql-conversion-strategy.md). Deliberately deferred to a later
      lot rather than guessed at - the attribute is surfaced as a `-- NOTE`
      comment (RULE #5), never silently dropped.

  Inheritance:
    qualified_name: IlisMeta16.ModelData.Class
    status: backlog
    note: >
      ABSTRACT structure polymorphism (the JSON Schema pipeline's `anyOf`
      case) has no natural single-table SQL equivalent (table-per-hierarchy
      vs. table-per-subtype are both real, materially different design
      choices) - deferred, not attempted in Lot 1. An attribute whose
      STRUCTURE target is ABSTRACT is surfaced as a `-- NOTE` comment.

  UniqueConstraint:
    qualified_name: IlisMeta16.ModelData.UniqueConstraint
    status: mapped
    note: >
      Only `Kind=GlobalU` (own `UniqueConstraint.Kind` enumeration -
      GlobalU/BasketU/LocalU) AND every `UniqueDef` path a SINGLE `PathEl`
      (a plain own-column reference) maps to a real `UNIQUE (...)`
      constraint - 2+ `PathEl`s means the path crossed a role/reference
      (e.g. `Owner->Code`) to ANOTHER table's attribute. `PathEl.Kind` is
      ALWAYS `"ReferenceAttr"` regardless of hop position (confirmed
      empirically, 2026-08-27: `Owner->Code` produces
      `[('ReferenceAttr','Owner'), ('ReferenceAttr','Code')]`, no distinct
      Kind for the intermediate role step) - path LENGTH, not `Kind`, is
      the real signal (same permissive Kind set as
      `constraint_eval.py`'s own `_resolve_path`). Real corpus breakdown
      (123 declarations,
      see docs/interlis-ogc-architecture.md): ~70% are this simple form.
      `Kind=LocalU` (scoped inside a `BAG`/`LIST OF STRUCTURE`, ~20%) and
      any `->` cross-reference path (~10% - not expressible as a plain SQL
      table constraint at all, a constraint can't reference ANOTHER
      table's column) are both `status: backlog` within this SAME concept
      entry (not separately mapped) - surfaced as a `-- NOTE` comment,
      never silently dropped nor forced into a wrong/partial constraint.

  Constraint:
    qualified_name: IlisMeta16.ModelData.Constraint
    status: mapped
    note: >
      A row-local `MANDATORY CONSTRAINT` (`SimpleConstraint`, `Kind=MandC`,
      no `Percentage`) -> SQL `CHECK (...)`, via `convert/sql.py`'s
      `_expression_to_sql` - walks the SAME `Expression` tree
      `convert/constraint_eval.py`'s `evaluate_expression` already
      evaluates in Python, same supported subset (relational/logical
      operators, `DEFINED(...)`, plain attribute paths up to one STRUCTURE
      hop, `Numeric`/`Text`/`Enumeration` constants). `UniqueConstraint`/
      `SetConstraint`/`ExistenceConstraint` and the percentage-based
      plausibility form (`Kind` `LowPercC`/`HighPercC`) stay `status:
      backlog` within this same concept entry - population/basket-level
      checks a single-row `CHECK` cannot express. Verified that even
      ili2db (the mature reference INTERLIS-to-database tool) does not
      attempt an arbitrary-`Expression`-to-`CHECK` translation either -
      its own `--createNumChecks`/`--createTextChecks`/
      `--createDateTimeChecks`/`--createMandatoryChecks`/
      `--createTypeConstraint` flags only cover narrower PER-DATATYPE
      validation (range/length/NOT NULL). `THIS`/`PARENT`/aggregate paths/
      `FunctionCall`/arithmetic surface as a `-- NOTE`, never a wrong or
      partial `CHECK` (RULE #5) - found a real, separate construction bug
      the hard way: `factor`'s `INTERLIS DOT (Name|URI|UUIDOID) (LPAR ...
      RPAR)?` alternative (predefined functions, e.g. `INTERLIS.len(...)`)
      had no `when_present` branch and silently collapsed to its own
      first argument (`spec/grammar/mapping/07_constraints.yml`'s
      `factor.INTERLIS` entry) - fixed at construction, not papered over
      here, since it also corrupted `constraint_eval.py`'s runtime
      evaluation of the same real corpus constraints.
