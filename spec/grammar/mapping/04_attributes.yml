attrType:
  grammar:
    rule: attrType
  kind: Container
  attribute_bindings:
    _dispatch:
      source:
        field: type_|domainRef|referenceAttr|restrictedStructureRef
        kind: alt_rule
      note: 'Pure 4-way dispatcher, confirmed via grammar-metamodel- mapping.yml: "kind: Container". No
        own construction; result is whichever of type_()/domainRef()/referenceAttr()/ restrictedStructureRef()
        matched, each already bound separately.

        '
  note: Attribute references
attrTypeDef:
  grammar:
    rule: attrTypeDef
  kind: Container
  attribute_bindings:
    Mandatory:
      source:
        field: MANDATORY
        presence: true
      note: 'Leading optional MANDATORY token (first alternative only). AttrOrParam itself has no Mandatory
        attribute (confirmed: ilismeta16-classes.yml, own+inherited lists do not include Mandatory), but
        DomainType does ("Mandatory: BOOLEAN" own attribute, confirmed). So this feeds Mandatory on whichever
        concrete DomainType subclass instance is produced by the dispatched sub-rule below (attrType/enumeration/numericType-
        like NumType), not on AttrOrParam.

        '
    Type:
      source:
        field: attrType|enumeration|numeric|NUMERIC
        kind: alt_rule_or_token
      wrap:
        numeric: IlisMeta16.ModelData.NumType
        enumeration: IlisMeta16.ModelData.EnumType
      note: 'First alternative dispatches to one of: attrType() | enumeration() (anonymous EnumType) |
        numeric() CIRCULAR? (LSBR unitRef RSBR)? (anonymous NumType, reusing the numeric() bindings
        already documented) | bare NUMERIC LSBR unitRef RSBR (anonymous NumType with only a Unit, no
        Min/Max). Feeds the enclosing AttrOrParamType.Type association end (handled by the parent
        attributeDef/roleDef/etc. construct). numeric()/enumeration() return a bag (a dict of fields
        shared with numericType/coordinateType/etc., see path: elsewhere), never wrapped in a concrete
        instance on their own - "wrap:" promotes the bag into a real NumType/EnumType instance (the bag''s
        keys attached as-is, already named like the real attributes/associations - Min/Max/Circular/
        Clockwise/Unit for NumType, Order/Elements for EnumType). Bare NUMERIC and attrType() stay outside
        this mechanism (attrType already produces its own instance; bare NUMERIC, a rarer case, is not yet
        wired).

        Mandatory/Type/_collection must always be computed through `_relay`''s normal bag calculation,
        regardless of which grammar alternative matched - short-circuiting on `ctx.attrType()` before that
        calculation runs silently drops Mandatory (e.g. `MANDATORY TEXT*50;` would build a TextType with
        Mandatory=None instead of True, with no validator error, since the mapping/schema stays otherwise
        valid).

        '
    _collection:
      target: IlisMeta16.ModelData.MultiValue
      Ordered:
        source:
          field: BAG|LIST
          kind: alt_token
        mapping:
          BAG: false
          LIST: true
      Multiplicity:
        source:
          field: cardinality
          optional: true
      BaseType:
        association: BaseType
        role: BaseType
        source:
          field: restrictedStructureRef
      note: 'No class is literally named
        "Bag"/"List"/"Collection" - it exists under a different name: IlisMeta16.ModelData.MultiValue
        (ilismeta16-classes.yml, extends TypeRelatedType), with own attributes Ordered:BOOLEAN (mandatory)
        and Multiplicity:IlisMeta16.ModelData.Multiplicity. Per INTERLIS 2 Metamodel
        edition 2022-06-17, section 2.3.1 (p.10): "The class TypeRelatedType serves as basis for all
        types, which use another type (by means of the relationship BaseType)... Currently there is only
        one extending class for TypeRelatedType: MultiValue. It serves to describe a set of sub elements.
        Attributes further describe whether this set is ordered (LIST) or not (BAG), and what cardinality
        it features." Binding: "(BAG|LIST) cardinality? OF restrictedStructureRef" -> target MultiValue,
        Ordered (BAG->false, LIST->true), Multiplicity (from cardinality(), optional), BaseType (association
        TRT{0..*} TypeRelatedType <-> BaseType{1} Type, ilismeta16-associations.yml - fed
        by the resolved restrictedStructureRef()). `scripts/extract_ilismeta16.py`
        has no filter excluding these concepts (parse_classes/datatypes/associations/enumerations cover
        all relevant UML kinds, packaged_elements() walks the XMI tree recursively via root.iter()) -
        no extraction gap, just a class looked up under the wrong name previously.

        '
attributeDef:
  grammar:
    rule: attributeDef
  kind: Instance
  target: IlisMeta16.ModelData.AttrOrParam
  parent:
    association: ClassAttr
    role: ClassAttribute
  attribute_bindings:
    Name:
      source:
        field: Name
    SubdivisionKind:
      source:
        field: SUBDIVISION
        presence: true
      rule:
        SUBDIVISION only: SubDiv
        CONTINUOUS + SUBDIVISION: ContSubDiv
        neither: NoSubDiv
      note: needs final confirmation of CONTINUOUS+SUBDIVISION -> ContSubDiv mapping against a real .ili
        example
    Transient:
      source:
        field: TRANSIENT
        presence: true
    Derivates:
      source:
        field: factor
        multi: true
      note: each factor (after optional ASSIGN) is an Expression appended to Derivates
  note: Attribute type resolution
attributePathConst:
  grammar:
    rule: attributePathConst
  kind: Instance
  target: IlisMeta16.ModelData.AttributeConst
  attribute_bindings:
    Attribute:
      source:
        field: viewableRef
        DOT: null
        Name: null
        join: .
      note: '"GT GT (viewableRef DOT)? Name" (e.g. ">>MyAttr" or ">>MyClass.MyAttr"). AttributeConst is
        a DataType with a single own attribute Attribute: INTERLIS.NAME (0..1), confirmed in ilismeta16-datatypes.yml,
        so the optional viewableRef qualifier and the mandatory Name are joined with "." into this single
        Attribute string (analogous to classRef.Ref).

        '
  note: 05_associations Association definitions
baseAttrRef:
  grammar:
    rule: baseAttrRef
  kind: Container
  attribute_bindings:
    AttrName:
      source:
        field: Name
      note: '"Name (DIV PosNumber)?" or "Name DIV domainRef". No direct
        IlisMeta16 instance expected; "reference to a base attribute (Name, optionally with a numeric
        precision via DIV PosNumber) or a domainRef; used as a placeholder inside formatDef''s format
        pattern." Feeds the struct attribute name being referenced in the formatDef() template (see formatDef
        binding).

        '
    Precision:
      source:
        field: PosNumber
        optional: true
      note: '`PosNumber` is
        directly accessible only on alternative 1 (''Name (DIV PosNumber)?''), never on
        alternative 2 (''Name DIV domainRef'') - per the real grammar
        (vendor/interlis-antlr4/InterlisParser.g4, baseAttrRef). Optional 1-only decimal-precision hint
        (DIV PosNumber) for the referenced numeric attribute.'
    Unit:
      source:
        field: domainRef
        optional: true
      note: 'Same reasoning/check as Precision above -
        `domainRef` is directly accessible only on alternative 2, never alternative 1.
        Optional 2-only: DIV domainRef supplies a unit/domain for the referenced attribute''s formatted
        representation, instead of a plain precision number.'
  note: No direct IlisMeta16 instance expected. Reference to a base attribute (Name, optionally with a
    numeric precision via DIV PosNumber) or a domainRef; used as a placeholder inside formatDef's format
    pattern.
classOrAssociationRef:
  grammar:
    rule: classOrAssociationRef
  kind: Container
  attribute_bindings:
    _dispatch:
      source:
        field: classRef|associationRef
        kind: alt_rule
      note: 'Pure dispatcher (2 alternatives): classRef() or associationRef(). No own construction; result
        is whichever of the two sub-rules'' resolved reference matched (a class, or an association treated
        as Class[Kind=Association]).

        '
  note: No direct IlisMeta16 instance expected. Dispatcher between classRef and associationRef.
referenceAttr:
  grammar:
    rule: referenceAttr
  kind: Instance
  target: IlisMeta16.ModelData.ReferenceType
  attribute_bindings:
    External:
      source:
        field: EXTERNAL
        presence: true
      note: 'Optional "(EXTERNAL)" clause. Feeds ReferenceType.External (own BOOLEAN attribute, mandatory,
        confirmed in ilismeta16-classes.yml) - true if present, false otherwise.

        '
    BaseClass:
      association: BaseClass
      role: BaseClass
      source:
        field: restrictedClassOrAssRef
        path: BaseRef
        optional: true
      note: 'The binding used to assign the raw bag
        {BaseRef, AnyClass, Restrictions} as a whole (a dict, with ForwardRef not extracted) instead
        of extracting BaseRef via path: - same bug/same fix as roleDef.BaseClass (see
        spec/grammar/mapping/05_associations.yml), copied here identically: ReferenceType extends
        ClassRelatedType (ilismeta16-classes.yml), same BaseClass association. Covers
        only the first occurrence; AnyClass/Restrictions are out of scope (same limit
        as roleDef.BaseClass).

        '
  note: 'target: AttrOrParam
    was a copy-paste error: referenceAttr() describes a TYPE (Type=REFERENCE TO ...), not an
    attribute - the same pattern as textType/coordinateType (target.class points directly to their own
    Type, with no separate semantics.type block, no parent ClassAttr). target: AttrOrParam would have
    built a redundant second AttrOrParam, duplicating the one already created by attributeDef/parameterDef
    (which consumes this ReferenceType via the AttrOrParamType association, like any other Type).'
restrictedClassOrAssRef:
  grammar:
    rule: restrictedClassOrAssRef
  kind: Container
  attribute_bindings:
    BaseRef:
      source:
        field: classOrAssociationRef
        index: 0
        optional: true
      note: '"(classOrAssociationRef | ANYCLASS) (RESTRICTION LPAR classOrAssociationRef (SEMI classOrAssociationRef)*
        RPAR)?". No direct IlisMeta16 instance expected (kind: Container);
        feeds Role.BaseClass (via ClassRef) or the equivalent association-side reference. The first
        classOrAssociationRef (or the ANYCLASS wildcard, meaning "any class") is the unrestricted base
        reference.

        `optional: true` is required - legitimately absent when the ANYCLASS alternative
        (handled separately by the `AnyClass` binding below) is chosen instead of a
        concrete classOrAssociationRef - e.g. `Objects: OBJECTS OF ANYCLASS` (functionDef,
        Gefahrenkartierung_V1_de.ili) previously raised `BuildError [restrictedClassOrAssRef] ''classOrAssociationRef''
        missing (not optional)`. `functionDef` (the only real consumer
        of this ANYCLASS path via `argumentType`) was grammatically UNREACHABLE at the
        TOPIC level (see the functionDef binding) - a latent gap, never a behavior
        change for a concrete `classOrAssociationRef` (already present, never optional in that case).

        '
    AnyClass:
      source:
        field: ANYCLASS
        presence: true
      note: Wildcard alternative to a concrete base classOrAssociationRef - matches any class.
    Restrictions:
      source:
        field: classOrAssociationRef
        multi: true
        optional: true
      note: 'The classOrAssociationRef entries inside the optional "RESTRICTION(...)" clause narrow the
        base reference to one or more specific alternatives (semicolon-separated). These are the same
        multiple OR-joined target classes documented in the roleDef binding (Role.BaseClass, multi).

        '
  note: No direct IlisMeta16 instance expected. One or more classOrAssociationRef, optionally restricted
    via ANYCLASS RESTRICTION(...). Feeds Role.BaseClass (via ClassRef) or the equivalent association-side
    reference.
restrictedClassOrStructureRef:
  grammar:
    rule: restrictedClassOrStructureRef
  kind: Container
  dispatches_to:
  - restrictedClassOrAssRef
  - restrictedStructureRef
  attribute_bindings:
    BaseRef:
      source:
        field: classOrStructureRef
        index: 0
      note: '"(classOrStructureRef | ANYSTRUCTURE) (RESTRICTION LPAR classOrStructureRef ((COMMA|SEMI)
        classOrStructureRef)* RPAR)?". `kind: Container, dispatches_to:
        [restrictedClassOrAssRef, restrictedStructureRef]` is a semantic-role note (this rule plays
        the combined role of either sibling rule depending on the enclosing context), not a literal grammar
        call to those two rules (structurally it calls classOrStructureRef(), not classOrAssociationRef()/structureRef()
        directly).

        '
    AnyStructure:
      source:
        field: ANYSTRUCTURE
        presence: true
      note: Wildcard alternative to a concrete base classOrStructureRef - matches any structure.
    Restrictions:
      source:
        field: classOrStructureRef
        multi: true
        optional: true
      note: 'The classOrStructureRef entries inside the optional "RESTRICTION(...)" clause narrow the
        base reference to one or more alternatives (COMMA- or SEMI-separated).

        '
restrictedStructureRef:
  grammar:
    rule: restrictedStructureRef
  kind: Reference
  target: IlisMeta16.ModelData.Class
  discriminant:
    attribute: Kind
    value: Structure
  attribute_bindings:
    resolved_ref:
      source:
        field: structureRef|type_
        index: 0
      note: '"(structureRef | type_ | ANYSTRUCTURE) (RESTRICTION LPAR structureRef ((COMMA|SEMI) structureRef)*
        RPAR)?". `kind: Reference, discriminator: {attribute:
        Kind, value: Structure}` - the base alternative resolves to an existing IlisMeta16.ModelData.Class[Kind=Structure]
        instance.

        '
    AnyStructure:
      source:
        field: ANYSTRUCTURE
        presence: true
      note: Wildcard alternative to a concrete base structureRef/type_ - matches any structure.
    _inline_type:
      source:
        field: type_
        optional: true
      status: not_applicable
      note: '`not_applicable`: a grammar divergence, not a metamodel gap.
        Reference Manual eCH-0031 V2.1.0 (2024-04-24) §3.6.4 "Strukturattribute", exact official
        EBNF: `RestrictedStructureRef = (StructureRef | ''ANYSTRUCTURE'') [''RESTRICTION'' ''('' StructureRef
        {'';'' StructureRef} '')''].` - NO `type_()` alternative (anonymous inline type) in the
        official rule, only `StructureRef | ANYSTRUCTURE`. This project''s grammar `type_()` alternative
        is therefore a project-specific extension, absent from the official metamodel - same family
        of divergence as POW (`composedUnit`) and `type.text_range_alt`.
        ModelBuilder decision: raise an explicit error if an inline `type_()` is actually encountered
        at this position, rather than guessing an anonymous `Class[Kind=Structure]` construction.

        '
    Restrictions:
      source:
        field: structureRef
        multi: true
        optional: true
      note: 'The structureRef entries inside the optional "RESTRICTION(...)" clause narrow the base reference
        to one or more specific structure alternatives (comma- or semicolon-separated - both COMMA and
        SEMI are accepted as separators here, unlike restrictedClassOrAssRef which only accepts SEMI).

        '
