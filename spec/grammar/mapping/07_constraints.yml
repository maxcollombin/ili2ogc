objectOrAttributePath:
  grammar:
    rule: objectOrAttributePath
  kind: Container
  feeds_into: IlisMeta16.ModelData.PathOrInspFactor
  attribute_bindings:
    PathEls:
      source:
        field: pathEl
        multi: true
      note: 'confirmed attribute PathEls: IlisMeta16.ModelData.PathEl (0..*) on PathOrInspFactor (ilismeta16-datatypes.yml);
        each pathEl() -> one PathEl instance (see pathEl binding below), chained in declaration order
        via the ''->'' separators.'
  note: 'No direct IlisMeta16 instance expected. Chain of pathEl separated by "->"; feeds IlisMeta16.ModelData.PathOrInspFactor.PathEls
    (constructed by factor, not here). || Confirmed via grammar (objectOrAttributePath(), source ~11526-11554):
    pathEl (MINUS GT pathEl)*  -- a ''->''-separated chain of path elements.'
pathEl:
  grammar:
    rule: pathEl
  kind: Instance
  target: IlisMeta16.ModelData.PathEl
  attribute_bindings:
    Kind:
      source:
        field: THIS|THISAREA|THATAREA|PARENT|attributeRef|associationPath|Name+COLON|Name(no bracket)|Name+LSBR+Name+RSBR|Name+EQ+EQ+STRING
        kind: alt_dispatch
      mapping:
        THIS: This
        THISAREA: ThisArea
        THATAREA: ThatArea
        PARENT: Parent
        Name (alt5, no bracket): ReferenceAttr
        associationPath_alt: AssocPath
        Name COLON: Role
        Name LSBR Name RSBR (alt5, with bracket): ViewBase
        attributeRef_alt: Attribute
        Name EQ EQ STRING (alt9): MetaObject
      note: 'All 9 alternatives now confirmed (Lot 13, point 9): alt1-4 (THIS/THISAREA/THATAREA/PARENT)
        literal matches; alt5 without its optional bracket -> ReferenceAttr, alt5 WITH the bracket ->
        ViewBase (corrected split, see construction comment above and RULE #4 citation); alt6 (''Name
        COLON'') -> Role; alt7 (associationPath()) -> AssocPath; alt8 (attributeRef()) -> Attribute (corrected
        from a previous ReferenceAttr label - see construction comment); alt9 (''Name EQ EQ STRING'')
        -> MetaObject.'
    Ref:
      source:
        field: Name
        optional: true
      note: 'CORRIGE (Lot 38) : `alt: 5|6|9` retire (`ctx.getAltNumber()` toujours 0, voir PROGRESS.md
        Lot 37/38) - sans consequence, verifie sur la grammaire reelle (pathEl : THIS | THISAREA | THATAREA
        | PARENT | Name (...)? | Name COLON | associationPath | attributeRef | Name EQ EQ STRING) : `Name`
        n''est un accesseur DIRECT sur pathEl que dans exactement les alternatives 5, 6 et 9 - les
        alternatives 1-4 sont des mots-cles seuls (aucun Name) et 7/8 delegue a une sous-regle
        (associationPath()/attributeRef() ont bien leur PROPRE Name interne, mais non expose directement
        sur le ctx de pathEl). Confirmed attribute Ref: INTERLIS.NAME on PathEl; populated from the plain
        Name token in alts 5, 6 and 9 (the attribute/role name itself, before any bracket/colon/comparison
        suffix).'
    NumIndex:
      note: 'Lot 18 (phase 2, résidus Phase 1) - CONFIRMÉ, le "mismatch" supposé n''en était pas un. Vérification
        directe du XMI source (docs/uml/IlisMeta16-formatted.xmi, l.306-307) : `MultRange` est un `uml:PrimitiveType`
        (comme `Code`/`LengthRange`), PAS une structure Min/Max - c''est une valeur SCALAIRE unique (confirmé
        par recoupement avec `Multiplicity.Min`/`Max`, chacun typé `MultRange` séparément et alimenté
        directement par un seul token littéral, cf. binding `cardinality`). PathEl.NumIndex n''est donc
        PAS un "range" à deux bornes - juste UNE valeur. alt5 (ViewBase, désormais confirmé) ne l''alimente
        PAS (son crochet contient un Name, pas un nombre - simplement hors sujet pour ce champ, pas une
        anomalie). NumIndex est alimenté UNIQUEMENT via `attributeRef`''s bracket `Number` (voir binding
        attributeRef.NumIndex, également corrigé) - directement, sans transformation, `MultRange` acceptant
        nativement une valeur scalaire unique.

        '
  note: 'Kind resolved dynamically from the matched alternative (THIS/THISAREA/THATAREA/PARENT/associationPath/attributeRef/Name)
    || Confirmed via grammar (pathEl(), source ~11661-11750), 9 alternatives, matched 1:1 against the
    10 confirmed values of PathEl.Kind (ilismeta16-kind-values.yml, ordered: This/ThisArea/ThatArea/Parent/
    ReferenceAttr/AssocPath/Role/ViewBase/Attribute/MetaObject). Lot 13 point 9 (RULE #4): the official
    INTERLIS 2 Reference Manual, edition 2006-04-13, section "Factors" (p.61) gives the historical EBNF:
    PathEl = ( THIS | THISAREA | THATAREA | PARENT | ReferenceAttribute-Name | AssociationPath | Role-Name
    [ ''['' Association-Name '']'' ] | Base-Name | AttributeRef ). AttributeRef = Attribute-Name ( ''[''
    (FIRST|LAST|Position) '']'' )? | AGGREGATES. This project''s attributeRef() rule (alt8) matches "AttributeRef"
    above almost verbatim (Name + optional [FIRST|LAST|Number] bracket, or AGGREGATES) - i.e. Kind=Attribute,
    NOT ReferenceAttr as previously labelled (correction, same pattern as Lot 12''s functionDef fix: a
    name-similarity assumption - attributeRef()/ReferenceAttr - turned out wrong on closer reading). "ReferenceAttribute-Name"
    in the refman is a bare Name with none of AttributeRef''s qualifiers - this matches alt5 WITHOUT its
    optional bracket. "Base-Name" (bare) is the refman''s equivalent of ViewBase; this project''s grammar
    appears to have extended it with an optional bracket qualifier (disambiguating WHICH base view/class,
    needed for multi-EXTENDS views - View/BaseViewDef/ BaseViewRef associations, ilismeta16-associations.yml)
    rather than leaving it fully bare - a documented grammar evolution (RULE #4: this grammar was redefined
    since INTERLIS 2.4), hence alt5 WITH its bracket = ViewBase. (Role, matched to alt6 ''Name COLON'',
    and AssocPath, matched to alt7 associationPath(), stay as previously confirmed - the refman''s bracket-based
    ''Role-Name [Association-Name]'' notation was apparently replaced by this project''s colon-suffix
    notation for Role; not part of this investigation''s scope, left as-is.) alt9 ''Name EQ EQ STRING''
    (Name==STRING) = MetaObject: matches Reference Manual section 2.10 "Dealing with meta objects" (p.55-56,
    e.g. SIGN/ REFSYSTEM/AXIS meta objects) - meta objects are identified purely by NAME (a string) within
    a basket, with no dedicated reference syntax of their own; "Name == STRING" reads naturally as testing/selecting
    a meta-object-typed path element by its name literal.'
