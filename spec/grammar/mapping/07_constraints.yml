argument:
  grammar:
    rule: argument
  kind: Instance
  target: IlisMeta16.ModelData.ActualArgument
  discriminant:
    attribute: Kind
    dynamic: true
    rule:
      ALL: AllOf
      default: Expression
  attribute_bindings:
    Expression:
      source:
        field: expression
        optional: true
      note: '`expression` is only reachable on alternative 1 of the grammar (`argument :
        expression | ALL (...)`), never alternative 2. Feeds Expression: IlisMeta16.ModelData.Expression
        on ActualArgument, populated only for the Kind=Expression alternative.'
    ObjectClasses:
      source:
        field: restrictedClassOrAssRef
        optional: true
      note: '`restrictedClassOrAssRef` is only reachable in the ALL (...) branch of the grammar, never
        alternative 1. Feeds ObjectClasses: IlisMeta16.ModelData.ClassRef (0..*) on ActualArgument, for the ''ALL
        (restrictedClassOrAssRef)'' variant. restrictedClassOrAssRef already resolves to classOrAssociationRef
        entries, feeding this list.'
  note: 'Kind resolved dynamically: ALL present -> AllOf, otherwise Expression.
    Grammar (argument()), 2 alternatives: alt1: expression() alt2:
    ALL (LPAR restrictedClassOrAssRef RPAR | viewableRef RPAR)'
associationPath:
  grammar:
    rule: associationPath
  kind: Container
  attribute_bindings:
    Ref:
      source:
        field: Name
      note: feeds PathEl.Ref (INTERLIS.NAME) on the enclosing pathEl (Kind=AssocPath)
    _leading_backslash:
      status: not_applicable
      note: '`PathEl` (ilismeta16-datatypes.yml/XMI) has only 4 own attributes - Kind, Ref, NumIndex,
        SpecIndex - none of which encodes "direction of traversal" for the association. Design decision:
        the optional BACKSLASH is a purely syntactic disambiguation marker, consumed while RESOLVING the
        association name (to pick which association carries that name when ambiguous), with no effect on
        the data stored in the resulting PathEl once the association is resolved - Ref stays the
        association name, identical with or without the backslash.

        '
  note: 'No direct IlisMeta16 instance expected. Disambiguates which association role to follow within
    a pathEl.
    Grammar (associationPath()):
    BACKSLASH? Name  -- an optional leading backslash then an association name, used to select which association
    a path traverses when a role name alone would be ambiguous. No dedicated ''AssociationPath'' class
    exists in the metamodel - this rule feeds directly into the enclosing pathEl''s
    PathEl.Ref/Kind=AssocPath, no separate class instance.'
attributePath:
  grammar:
    rule: attributePath
  kind: Container
  feeds_into: IlisMeta16.ModelData.PathOrInspFactor
  attribute_bindings:
    _dispatch:
      source:
        field: objectOrAttributePath
      note: pass-through construction - same target PathOrInspFactor as objectOrAttributePath itself;
        this rule adds no fields of its own.
  note: 'No direct IlisMeta16 instance expected. Pure pass-through to objectOrAttributePath: a single-child
    wrapper with no own tokens.'
attributeRef:
  grammar:
    rule: attributeRef
  kind: Container
  attribute_bindings:
    Ref:
      source:
        field: Name
        optional: true
      note: '`Name` is only reachable directly on alternative 1 (grammar `attributeRef : Name (...)? |
        AGGREGATES`), never on AGGREGATES (alt2, no Name).
        Feeds PathEl.Ref (INTERLIS.NAME) on the enclosing pathEl (Kind=Attribute - see pathEl
        binding).'
    SpecIndex:
      source:
        field: FIRST|LAST
        kind: alt_token
        optional: true
      note: 'PathEl.SpecIndex enum values are exactly First/Last (ilismeta16-kind-values.yml),
        matching attributeRef''s FIRST/LAST tokens inside the optional LSBR...RSBR bracket.'
    NumIndex:
      source:
        field: Number
        optional: true
      note: '`MultRange` is a scalar `uml:PrimitiveType` (docs/uml/IlisMeta16-formatted.xmi),
        not a two-bound Min/Max structure - the bracket''s single `Number` feeds it
        directly, with no transformation and no "degenerate range" to build.

        '
  note: 'This rule does not construct its own instance - it feeds the fields (Name/FIRST/LAST/Number/AGGREGATES)
    of the PathEl built by the ENCLOSING pathEl rule (alt8).
    Grammar (attributeRef()), 2 alternatives: alt1: Name (LSBR (FIRST|LAST|Number)
    RSBR)? alt2: AGGREGATES. attributeRef() is only ever called from pathEl() (alt8), and its
    own Name/FIRST/LAST/Number tokens line up closely with PathEl''s own Ref/SpecIndex attributes - the
    far better fit than AttrOrParam (a real class, ilismeta16-classes.yml, but nothing ties attributeRef()
    specifically to AttrOrParam construction). The enclosing pathEl alt8''s Kind is Attribute: the INTERLIS 2
    Reference Manual edition 2006-04-13 EBNF (section "Factors", p.61) separates "ReferenceAttribute-Name"
    (a bare Name, no qualifier) from "AttributeRef"
    (Attribute-Name with optional [FIRST|LAST|Position] or AGGREGATES) as two DISTINCT PathEl alternatives.
    This project''s attributeRef() rule matches "AttributeRef" structurally (Name + optional [FIRST|LAST|Number]
    bracket, or AGGREGATES), so the enclosing pathEl''s Kind is Attribute, not ReferenceAttr
    (see pathEl binding below for the full mapping).'
constraintDef:
  grammar:
    rule: constraintDef
  kind: Container
  attribute_bindings:
    _dispatch:
      source:
        field: mandatoryConstraint|plausibilityConstraint|existenceConstraint|uniquenessConstraint|setConstraint|expression
        kind: alt_rule
      note: alt 6 (bare expression, no keyword) is plausibly a SimpleConstraint with Kind left unset (SimpleConstraint.Kind
        is optional per ilismeta16-kind-values.yml) and LogicalExpression=expression, by analogy with
        mandatoryConstraint/plausibilityConstraint. Not asserted as certain - ModelBuilder should route
        it through the same SimpleConstraint construction but without a Kind value.
  note: 'No direct IlisMeta16 instance expected. Pure dispatcher between mandatoryConstraint,
    plausibilityConstraint, existenceConstraint, uniquenessConstraint, setConstraint, or a bare boolean
    expression constraint (6 alternatives). No own target - delegates to each sub-rule''s own construction,
    except alt 6 (bare `expression SEMI`, no keyword).'
constraintsDef:
  grammar:
    rule: constraintsDef
  kind: Container
  parent:
    association: ClassConstraint
    role: Constraint
    note: confirmed association IlisMeta16.ModelData.ClassConstraint (ilismeta16-associations.yml), ends
      ToClass/Constraint. If classOrAssociationRef resolves to an association, the same ClassConstraint
      association still applies since Association IS a Class (Kind=Association) - not DomainConstraint,
      which targets DomainType instead.
  attribute_bindings:
    Constraints:
      source:
        field: constraintDef
        multi: true
      note: each constraintDef -> a Constraint subclass instance (SimpleConstraint/ExistenceConstraint/UniqueConstraint/SetConstraint),
        appended via the ClassConstraint association (Constraint role) to the class resolved from classOrAssociationRef
  note: 'Container for constraint declarations. Grammar (constraintsDef()): CONSTRAINTS OF
    classOrAssociationRef EQ constraintDef* END SEMI. A standalone topic-level block that adds constraints
    to an already-declared class/association (e.g. from an extending topic).'
existenceConstraint:
  grammar:
    rule: existenceConstraint
  kind: Instance
  target: IlisMeta16.ModelData.ExistenceConstraint
  parent:
    association: ExistenceDef
    role: ExistenceConstraint
    note: confirmed association IlisMeta16.ModelData.ExistenceDef (ilismeta16-associations.yml), ends
      ExistenceConstraint/ExistsIn; ExistsIn (target Class) is resolved from viewableRef(0).
  attribute_bindings:
    Name:
      source:
        field: Name
        optional: true
      note: ExistenceConstraint.Name is inherited from Constraint (mandatory) - same caveat as mandatoryConstraint.
    Attr:
      source:
        field: attributePath
        index: 0
      note: 'confirmed attribute Attr: IlisMeta16.ModelData.PathOrInspFactor on ExistenceConstraint (ilismeta16-classes.yml);
        attributePath(0) is the attribute whose existence is required. attributePath()''s internal PathEls/Inspection
        dispatch belongs to Expressions - not resolved here.'
  note: 'The grammar originally only accepted a single viewableRef/attributePath pair: "EXISTENCE CONSTRAINT
    (Name COLON)? attributePath(0) REQUIRED IN viewableRef COLON attributePath(1) SEMI" - but the Reference
    Manual eCH-0031 V2.1.0 (§3.12) specifies a repeatable clause "{''OR'' ViewableRef '':''
    AttributePath}", and the original grammar rejected "... : Attr OR Viewable2 : Attr2;" (syntax error
    on OR). Fixed in vendor/interlis-antlr4/InterlisParser.g4: "EXISTENCE CONSTRAINT (Name COLON)?
    attributePath(0) REQUIRED IN viewableRef(0) COLON attributePath(1) (OR viewableRef(i) COLON attributePath(i))*
    SEMI" - the viewableRef/attributePath accessors are now rule_multi (getTypedRuleContexts), with a new
    OR accessor (token_multi).'
expression:
  grammar:
    rule: expression
  kind: Container
  feeds_into: IlisMeta16.ModelData.Expression
  attribute_bindings:
    _dispatch:
      source:
        field: term
      note: Expression has no own attributes - the concrete shape (UnaryExpr/CompoundExpr/Factor-derived)
        is entirely determined by what term() resolves to, recursively through term0/term1/term2/predicate/factor.
  note: 'No direct IlisMeta16 instance expected. Pure single-child wrapper around term() - no own tokens;
    the actual Expression subtype (UnaryExpr / CompoundExpr / Constant / FunctionCall / etc.) is produced
    further down the precedence chain (term0/term1/term2/factor). IlisMeta16.ModelData.Expression
    (ilismeta16-datatypes.yml) is a DataType with attributes.own: {} - a pure opaque/abstract container,
    matching this rule having nothing of its own to bind either.'
factor:
  grammar:
    rule: factor
  kind: Conditional
  when_present:
    objectOrAttributePath:
      target: IlisMeta16.ModelData.PathOrInspFactor
  attribute_bindings:
    _dispatch:
      source:
        field: objectOrAttributePath|inspection|functionCall|constant|Number
        kind: alt_rule_or_token
      note: '8 alternatives:

        1. objectOrAttributePath() -> PathOrInspFactor-like path (see objectOrAttributePath binding)

        2. (inspection()|INSPECTION viewableRef) (OF objectOrAttributePath)? -> feeds PathOrInspFactor.Inspection;
        inspection() itself is Views scope, not resolved here

        3. functionCall() -> confirmed IlisMeta16.ModelData.FunctionCall

        4. INTERLIS DOT (URI|UUIDOID|...) (LPAR expression (COMMA expression)* RPAR)? -> unresolved, see
        below

        5. PARAMETER (Name DOT)? Name -> matches IlisMeta16.ModelData.RuntimeParamRef (confirmed DataType,
        ilismeta16-datatypes.yml) with RuntimeParam:NAME; the optional ''Name DOT'' prefix (topic qualifier)
        has no dedicated attribute slot on RuntimeParamRef (own: {RuntimeParam only}) - unresolved for
        that qualifier specifically

        6. ALL (OF objectOrAttributePath)? -> unresolved, no confirmed ''AllOf''-style Factor subtype
        found (ActualArgument.Kind has an ''AllOf'' value but that belongs to argument(), a different
        rule - see argument binding)

        7. constant() -> confirmed IlisMeta16.ModelData.Constant (already bound elsewhere)

        8. Number token -> presumably a numeric literal Constant(Type=Numeric) equivalent, but Number
        here is a bare token match with no constant() wrapper - unresolved whether ModelBuilder should
        synthesize a Constant or a distinct numeric Factor.

        '
  note: 'Dispatcher/wrapper for expression leaves, 8 alternatives. When objectOrAttributePath (optionally
    with an inspection() clause) is present, produces IlisMeta16.ModelData.PathOrInspFactor (PathEls from
    objectOrAttributePath, Inspection from inspection()). Otherwise delegates to functionCall, a
    parenthesized expression, or a constant/reference token. IlisMeta16.ModelData.Factor
    (ilismeta16-datatypes.yml) is an empty DataType (attributes.own: {}) - a pure abstract marker, like
    Expression/Constraint. Each alternative dispatches to its own concrete construction rather than
    populating Factor fields.'
functionCall:
  grammar:
    rule: functionCall
  kind: Instance
  target: IlisMeta16.ModelData.FunctionCall
  attribute_bindings:
    Function:
      source:
        field: Name
        index: -1
        join: .
      note: 'confirmed attribute Function: INTERLIS.NAME on FunctionCall (ilismeta16-datatypes.yml). Grammar:
        (Name DOT)? (Name DOT)? Name LPAR ... RPAR - up to 3 Name tokens (qualifier.qualifier.functionName);
        the last Name is the actual function name, joined with any preceding qualifier Names via DOT for
        a fully-qualified reference.'
    Arguments:
      source:
        field: argument
        multi: true
      note: 'confirmed attribute Arguments: IlisMeta16.ModelData.ActualArgument (0..*) on FunctionCall;
        each argument() -> one ActualArgument (see argument binding below)'
globalUniqueness:
  grammar:
    rule: globalUniqueness
  kind: Container
  attribute_bindings:
    Elements:
      source:
        field: uniqueEl
        multi: true
      note: each uniqueEl -> one PathOrInspFactor entry, appended to the enclosing UniqueConstraint.UniqueDef
        list (no intermediate class instance)
  note: 'No direct IlisMeta16 instance expected. Comma-separated list of uniqueEl, feeding the enclosing
    UniqueConstraint''s UniqueDef (PathOrInspFactor list) directly - no own class instance. Grammar
    (globalUniqueness()): uniqueEl (COMMA uniqueEl)*. No "GlobalUniqueness" class exists in the metamodel.
    Corresponds to Kind=GlobalU on the enclosing UniqueConstraint (created by uniquenessConstraint) when
    no localUniqueness clause is present in the same statement; matches the official INTERLIS 2 Reference
    Manual EBNF, where GlobalUniqueness never carries a LOCAL/BASKET marker of its own - a globalUniqueness
    body can still end up as Kind=BasketU via the enclosing uniquenessConstraint though (see its
    discriminant binding). Background on the grammar fix (together with localUniqueness):
    docs/dev-notes/uniqueness-constraint-grammar-fix-investigation.md.'
localUniqueness:
  grammar:
    rule: localUniqueness
  kind: Container
  attribute_bindings:
    Kind:
      source:
        field: LOCAL
        presence: true
      mapping:
        LOCAL: LocalU
      note: 'Feeds the enclosing UniqueConstraint.Kind
        = LocalU (mandatory GlobalU/BasketU/LocalU, ilismeta16-kind-values.yml) - LOCAL is now
        the ONLY possible token here (BASKET is no longer an alternative at this level, see
        uniquenessConstraint.discriminant for the Kind=BasketU mechanism at the enclosing level).

        '
  note: 'No direct IlisMeta16 instance expected - no "LocalUniqueness" class exists in the metamodel.
    Carries its own mandatory qualifier "LPAR LOCAL RPAR" (moved out of the enclosing uniquenessConstraint
    level) and sets Kind=LocalU on the enclosing UniqueConstraint. The role path (Name (MINUS GT Name)*)
    and the final attribute list (COLON Name (COMMA Name)*)? likely feed UniqueDef (PathOrInspFactor) -
    exact construction not yet confirmed. Background on the grammar fix:
    docs/dev-notes/uniqueness-constraint-grammar-fix-investigation.md.'
mandatoryConstraint:
  grammar:
    rule: mandatoryConstraint
  kind: Instance
  target: IlisMeta16.ModelData.SimpleConstraint
  discriminant:
    attribute: Kind
    value: MandC
  parent:
    association: ClassConstraint
    role: Constraint
    note: 'Same association/role already used correctly by `constraintsDef` (the standalone
      `CONSTRAINTS OF X = ... END;` topic-level form) - previously MISSING here entirely, the
      real root cause of a constraint declared INLINE inside a CLASS/STRUCTURE body never
      appearing on `Class.Constraint` (confirmed empirically: `cls.Constraint == []` even
      right after building a class with a real `MANDATORY CONSTRAINT` in its body - the
      instance was built, then silently discarded, never attached anywhere). `self._parent_stack[-1]`
      at build time is the enclosing classDef/structureDef instance (classOrStructureDef''s
      generic `children:` dispatch visits constraintDef -> this rule while that instance is
      still on top of the stack, same mechanism already relied on by attributeDef''s own
      `parent: {association: ClassAttr, role: ClassAttribute}`).'
  attribute_bindings:
    Name:
      source:
        field: Name
        optional: true
      note: optional 'Name COLON' prefix before the expression, confirmed via MandatoryConstraintContext.Name()/COLON().
        SimpleConstraint.Name is inherited from Constraint (mandatory, upper=1) - if grammar omits Name,
        ModelBuilder must supply a default.
    LogicalExpression:
      source:
        field: expression
      note: confirmed attribute on IlisMeta16.ModelData.SimpleConstraint (ilismeta16-classes.yml)
  note: 'Grammar (mandatoryConstraint()): MANDATORY CONSTRAINT (Name COLON)? expression SEMI.'
metaDataBasketDef:
  grammar:
    rule: metaDataBasketDef
  kind: Instance
  target: IlisMeta16.ModelData.MetaBasketDef
  discriminant:
    attribute: Kind
    dynamic: true
    rule:
      SIGN: SignB
      REFSYSTEM: RefSystemB
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: inherited Name (MetaElement)
    Kind:
      source:
        field: SIGN|REFSYSTEM
        kind: alt_token
      rule:
        SIGN: SignB
        REFSYSTEM: RefSystemB
      note: confirmed MetaBasketDef.Kind enum (SignB/RefSystemB, kind-values.yml) - the mandatory leading
        '(SIGN|REFSYSTEM) BASKET' token dispatches the value directly.
    Final:
      source:
        field: FINAL
        presence: true
      note: optional FINAL token before the extends/topic clause; MetaBasketDef inherits Final from ExtendableME
        (confirmed own attr list includes it via inherited).
    extends_metaDataBasketRef:
      source:
        field: metaDataBasketRef
        optional: true
      note: 'Reference Manual eCH-0031 V2.1.0
        (2024-04-24) §3.10.1, exact EBNF: "MetaDataBasketDef = (''SIGN''|''REFSYSTEM'') ''BASKET'' Basket-Name
        Properties<FINAL> [''EXTENDS'' MetaDataBasketRef] ''~'' TopicRef {...} '';''." MetaBasketDef EXTENDS
        ExtendableME, so the generic Inheritance association (Sub {0..*} ExtendableME <-> Super {0..1}
        ExtendableME, already used for classDef/structureDef/viewDef/graphicDef/unitDef/DataUnit)
        applies here too: feeds Inheritance (Sub = this MetaBasketDef, Super = the MetaBasketDef
        resolved by metaDataBasketRef()). Same pattern reused, no new association needed.

        '
    topicRef:
      source:
        field: topicRef
      optional: true
      note: 'The mandatory ''TILDE topicRef()'' clause
        feeds IlisMeta16.ModelData.MetaDataUnit (MetaBasketDef {0..*} <-> MetaDataTopic {1..1} DataUnit,
        ilismeta16-associations.yml): MetaDataTopic is the DataUnit, not the SubModel. topicRef() itself
        resolves to a SubModel, but thanks to the TOPIC''s dual SubModel+DataUnit design
        (Metamodel §2.1.4, point 18, also relevant to topicDef/DataUnit.Dependency): the MetaDataTopic
        sought here is the DataUnit twin (named "BASKET") of the same topic, resolved via the same Name
        that topicRef() found for the SubModel - not a separate MetaBasketDef<->SubModel association.

        Not implemented in the engine: the generic engine (AttachmentResolver.attach) does not know how
        to follow `_twin` before attaching - attaching the resolved SubModel directly raises a BuildError
        ("topicRef not found as an attribute/role on MetaBasketDef", since the expected key is actually the
        MetaDataTopic role of the MetaDataUnit association, on the DataUnit side). `optional: true` tolerates
        the failure rather than aborting the whole build over a metadata mechanism (REFSYSTEM/SIGN BASKET)
        unrelated to the business-class attribute validation the XTF validator targets. MetaBasketDef is
        therefore built without TopicRef (Kind/Name/Final/extends still correct). Worth revisiting if
        resolving REFSYSTEM/SIGN baskets becomes a real need.

        '
    objects_of_clauses:
      source:
        field: Name|Name
        multi: true
      optional: true
      note: 'Not the same mechanism as AllowedInBasket
        (AllowedInBasket {OfDataUnit:DataUnit <-> ClassInBasket:Class} concerns classes allowed in an
        ordinary TRANSFER basket, a separate topic from this OBJECTS OF clause).
        Exact EBNF (§3.10.1): "{''OBJECTS'' ''OF'' Class-Name '':'' MetaObject-Name {'','' MetaObject-Name}}
        '';''." Construction chain via 2 distinct associations (ilismeta16-associations.yml):
        for each MetaObject-Name listed under a given Class-Name, create an IlisMeta16.ModelData.MetaObjectDef
        instance (Name = MetaObject-Name, IsRefSystem = (MetaBasketDef.Kind == RefSystemB)) linked (a) to this
        MetaBasketDef via MetaBasketMembers (MetaBasketDef {0..1} <-> Member {0..*} MetaObjectDef, composite)
        and (b) to the Class resolved via Class-Name via MetaObjectClass (MetaObjectDef {0..*} <-> Class {1..1}
        Class). Outer loop (one Class-Name per OBJECTS OF clause occurrence, several possible MetaObject-Name
        per occurrence) to be iterated by ModelBuilder.

        Not implemented in the engine, same issue as topicRef above: `field: Name|Name, multi: true`
        returns a flat list of all Name tokens (Class-Name AND MetaObject-Name mixed together, no grouping
        by occurrence) - the MetaObjectDef/MetaBasketMembers/MetaObjectClass construction loop described
        above would need a positional split of the rule''s children (same family as
        `domainDef._build_multi_declaration`), not yet written. `optional: true` tolerates attach()
        failure rather than aborting the whole build. MetaBasketDef is therefore built without its
        MetaObjectDef children. Worth revisiting if resolving OBJECTS OF in full becomes a real need.

        '
  note: 'Kind resolved dynamically: SIGN -> SignB, REFSYSTEM -> RefSystemB'
metaDataBasketRef:
  grammar:
    rule: metaDataBasketRef
  kind: Reference
  target: IlisMeta16.ModelData.MetaBasketDef
  attribute_bindings:
    _resolution:
      note: 'Pure reference resolution: qualified name (Name (DOT Name)?)? Name resolves to an existing
        IlisMeta16.ModelData.MetaBasketDef by qualified_name (same pattern as classRef/viewRef/graphicRef/topicRef).'
  note: '"MetaDataBasket" (without the Def suffix) does not exist in any ilismeta16-*.yml file - the
    real class is MetaBasketDef (ilismeta16-classes.yml).'
metaObjectRef:
  grammar:
    rule: metaObjectRef
  kind: Reference
  attribute_bindings:
    _resolution:
      source:
        field: metaDataBasketRef
        Name: null
      note: No own class; '(metaDataBasketRef DOT)? Name' resolves a meta-object by name, optionally qualified
        by a metaDataBasketRef. Used as the target of the LCBR metaObjectRef RCBR alternatives in signParamAssignment/enumAssignment
        (both marked unresolved there) and elsewhere - the resolved object's actual type depends
        entirely on call-site context, not on metaObjectRef itself.
  note: '"MetaObject" (without the Def suffix) does not exist either - same category of naming error as
    metaDataBasketRef above. Unlike metaDataBasketRef, there is no single fixed class to put in its place:
    the actual type resolved by this rule depends entirely on the call site (signParamAssignment,
    enumAssignment, bare METAOBJECT parameterDef...), never on the metaObjectRef rule itself - so there
    is no single target to document here.'
objectOrAttributePath:
  grammar:
    rule: objectOrAttributePath
  kind: Container
  feeds_into: IlisMeta16.ModelData.PathOrInspFactor
  attribute_bindings:
    PathEls:
      source:
        field: pathEl
        multi: true
      note: 'confirmed attribute PathEls: IlisMeta16.ModelData.PathEl (0..*) on PathOrInspFactor (ilismeta16-datatypes.yml);
        each pathEl() -> one PathEl instance (see pathEl binding below), chained in declaration order
        via the ''->'' separators.'
  note: 'No direct IlisMeta16 instance expected. Chain of pathEl separated by "->"; feeds
    IlisMeta16.ModelData.PathOrInspFactor.PathEls (constructed by factor, not here). Grammar
    (objectOrAttributePath()): pathEl (MINUS GT pathEl)*.'
pathEl:
  grammar:
    rule: pathEl
  kind: Instance
  target: IlisMeta16.ModelData.PathEl
  attribute_bindings:
    Ref:
      source:
        field: Name
        optional: true
      note: '`Name` is a DIRECT accessor on pathEl only in exactly alternatives 5, 6 and 9 (grammar:
        pathEl : THIS | THISAREA | THATAREA
        | PARENT | Name (...)? | Name COLON | associationPath | attributeRef | Name EQ EQ STRING) - alternatives
        1-4 are bare keywords (no Name) and 7/8 delegate to a sub-rule
        (associationPath()/attributeRef() do have their own internal Name, but not exposed directly
        on pathEl''s ctx). Feeds attribute Ref: INTERLIS.NAME on PathEl; populated from the plain
        Name token in alts 5, 6 and 9 (the attribute/role name itself, before any bracket/colon/comparison
        suffix).'
    NumIndex:
      note: '`MultRange` is a scalar `uml:PrimitiveType`
        (docs/uml/IlisMeta16-formatted.xmi), like `Code`/`LengthRange`, not a two-bound Min/Max
        structure - it is a single SCALAR value (cross-checked against `Multiplicity.Min`/`Max`, each
        separately typed `MultRange` and fed directly by a single literal token, see the `cardinality`
        binding). PathEl.NumIndex is therefore not a two-bound "range", just one value. alt5 (ViewBase)
        does not feed it (its bracket holds a Name, not a number - simply out of scope for this field, not
        an anomaly). NumIndex is fed ONLY via `attributeRef`''s bracket `Number` (see the
        attributeRef.NumIndex binding) - directly, with no transformation, since `MultRange` natively
        accepts a single scalar value.

        '
  note: 'Kind resolved dynamically from the matched alternative (THIS/THISAREA/THATAREA/PARENT/
    associationPath/attributeRef/Name). Grammar (pathEl()), 9 alternatives, matched 1:1 against the 10
    values of PathEl.Kind (ilismeta16-kind-values.yml, ordered: This/ThisArea/ThatArea/Parent/
    ReferenceAttr/AssocPath/Role/ViewBase/Attribute/MetaObject). The INTERLIS 2 Reference Manual, edition
    2006-04-13, section "Factors" (p.61), gives the historical EBNF: PathEl = ( THIS | THISAREA | THATAREA
    | PARENT | ReferenceAttribute-Name | AssociationPath | Role-Name [ ''['' Association-Name '']'' ] |
    Base-Name | AttributeRef ). AttributeRef = Attribute-Name ( ''['' (FIRST|LAST|Position) '']'' )? |
    AGGREGATES. This project''s attributeRef() rule (alt8) matches "AttributeRef" above almost verbatim
    (Name + optional [FIRST|LAST|Number] bracket, or AGGREGATES), i.e. Kind=Attribute, not ReferenceAttr.
    "ReferenceAttribute-Name" in the refman is a bare Name with none of AttributeRef''s qualifiers - this
    matches alt5 without its optional bracket. "Base-Name" (bare) is the refman''s equivalent of ViewBase;
    this project''s grammar extends it with an optional bracket qualifier (disambiguating which base
    view/class, needed for multi-EXTENDS views - View/BaseViewDef/BaseViewRef associations,
    ilismeta16-associations.yml) rather than leaving it fully bare, hence alt5 with its bracket = ViewBase.
    Role (alt6 ''Name COLON'') and AssocPath (alt7 associationPath()) replace the refman''s bracket-based
    ''Role-Name [Association-Name]'' notation with this project''s colon-suffix notation for Role. alt9
    ''Name EQ EQ STRING'' (Name==STRING) = MetaObject: matches Reference Manual section 2.10 "Dealing with
    meta objects" (p.55-56, e.g. SIGN/REFSYSTEM/AXIS meta objects) - meta objects are identified purely by
    NAME (a string) within a basket, with no dedicated reference syntax of their own, so "Name == STRING"
    reads naturally as testing/selecting a meta-object-typed path element by its name literal.

    Kind has no `attribute_bindings` entry (same convention as viewDef.FormationKind, deliberately
    omitted rather than declared unusable) - resolved by `InterlisModelBuilder._set_path_el_kind`,
    reading `PathElContext`''s real accessors directly instead of a generic binding: 6 of the 9
    alternatives share the SAME leading `Name` token (alt5 bare/bracketed, alt6 ''Name COLON'', alt9
    ''Name EQ EQ STRING''), so no composed field name like "Name+COLON"/"Name(no bracket)"/
    "Name+EQ+EQ+STRING" (as this rule used to spec it) matches any real ANTLR accessor -
    `ca.has_accessor` is always False for those, and no `mapping:` key matched the field-split names
    either (mismatched text, e.g. "Name (alt5, no bracket)" vs the real split "Name(no bracket)").
    Confirmed empirically: `PathEl.Kind` always resolved to `None` for every real pathEl before this
    fix (a swallowed `warnings.warn` "no alternative present", silent under this project''s
    `warnings.catch_warnings()` convention around every `build()` call). alt1-4/7/8 are each
    individually resolvable via one real, unambiguous accessor; only the alt5/6/9 bare-Name group
    needs COLON/EQ-count/LSBR disambiguation on top - see `_set_path_el_kind`.'
plausibilityConstraint:
  grammar:
    rule: plausibilityConstraint
  kind: Instance
  target: IlisMeta16.ModelData.SimpleConstraint
  discriminant:
    attribute: Kind
    dynamic: true
    rule:
      LTEQ: LowPercC
      GTEQ: HighPercC
  parent:
    association: ClassConstraint
    role: Constraint
    note: see mandatoryConstraint's parent note - same previously-missing attachment, same fix.
  attribute_bindings:
    Name:
      source:
        field: Name
        optional: true
    Percentage:
      source:
        field: numericConst
      note: confirmed attribute Percentage on SimpleConstraint (ilismeta16-classes.yml)
    LogicalExpression:
      source:
        field: expression
      note: the expression after MOD; MOD here is the grammar's '%' percentage-separator token, not modulo
        arithmetic
  note: 'Kind resolved dynamically: LTEQ -> LowPercC, GTEQ -> HighPercC. Grammar
    (plausibilityConstraint()): CONSTRAINT (Name COLON)? (LTEQ|GTEQ) numericConst MOD expression SEMI.'
predicate:
  grammar:
    rule: predicate
  kind: Conditional
  when_present:
    NOT:
      target: IlisMeta16.ModelData.UnaryExpr
      discriminant:
        attribute: Operation
        value: Not
    DEFINED:
      target: IlisMeta16.ModelData.UnaryExpr
      discriminant:
        attribute: Operation
        value: Defined
  attribute_bindings:
    SubExpression:
      source:
        field: expression
        optional: true
      note: '`expression` is a direct accessor of `predicate` (factor | (NOT)? LPAR expression
        RPAR | DEFINED LPAR factor RPAR | LPAR BASKET RPAR factor) only on alternative 2.
        This binding is evaluated for EVERY `when_present` branch taken (NOT or DEFINED), not
        only the one it "belongs to" semantically - `optional: true` is REQUIRED (the accessor is
        genuinely absent in the DEFINED branch, where it degrades to a harmless no-op rather than a
        BuildError - see `_set_defined_subexpression` for how DEFINED''s own SubExpression is set
        instead). Alt2''s parenthesized expression, wrapped as SubExpression when NOT is present.'
  note: 'Conditionally produces IlisMeta16.ModelData.UnaryExpr (Operation=Not or Operation=Defined) when
    NOT/DEFINED tokens are present; otherwise pure pass-through to factor or a parenthesized expression.
    Grammar (predicate()), 4 alternatives: alt1 factor() -> pure pass-through; alt2 NOT? LPAR expression
    RPAR -> UnaryExpr(Not) if NOT present, else pass-through to expression; alt3 DEFINED LPAR factor RPAR
    -> UnaryExpr(Defined), SubExpression set by `InterlisModelBuilder._set_defined_subexpression`
    (called explicitly by `_build_conditional` for predicate/DEFINED - alt3''s `factor` accessor has no
    direct role/attribute name of its own to bind against via the generic attribute_bindings mechanism;
    `UnaryExpr.SubExpression` is typed Expression while `factor()` builds a Factor - EXTENDS Expression,
    ilismeta16-datatypes.yml - so a direct assignment is enough, no wrapping needed); alt4 LPAR BASKET
    RPAR factor -> unresolved special case.'
relation:
  grammar:
    rule: relation
  kind: Container
  note: 'No direct IlisMeta16 instance expected. Resolves the relational operator symbol
    (EQ/NOT_EQ/LT/GT/LTEQ/GTEQ) used by term2 to set CompoundExpr.Operation=Relation with the matching
    sub-value (Equal/NotEqual/Less/Greater/LessOrEqual/GreaterOrEqual). Grammar (relation()), 7
    alternatives mapping to the 6 children of CompoundExpr.Operation=Relation
    (ilismeta16-kind-values.yml): Equal/NotEqual/LessOrEqual/GreaterOrEqual/Less/Greater - NOT_EQ and
    "LT GT" both mean not-equal (two spellings, like "<>" vs "#"/"!=" in other languages).

    Resolved by `InterlisModelBuilder._relation_kind`, reading RelationContext''s real accessors
    directly, NOT by a generic attribute_bindings entry: a composed field name like "EQ+EQ"/"LT+GT"
    (needed since alt1/"==" and alt3/"<>" each consume TWO separate single-character tokens) does not
    match any real ANTLR accessor - the generic `alt_token` mechanism''s field-splitting only understands
    "|"-separated alternatives, never "+"-joined multi-token sequences within one alternative. Confirmed
    empirically: the previous `attribute_bindings.RelationKind` entry (composed field
    "EQ+EQ|NOT_EQ|LT+GT|LTEQ|GTEQ|LT|GT") always resolved to `None`, and `CompoundExpr.Operation` stayed
    the literal group name "Relation" instead of Equal/NotEqual/etc. for every real relational
    expression built by this project - only ever discovered once `_build_conditional`''s single-key bag
    unwrap was fixed made the discarded result surface as a crash instead of a silent no-op (see
    `_relay`''s "len(bag) == 1" handling).'
setConstraint:
  grammar:
    rule: setConstraint
  kind: Instance
  target: IlisMeta16.ModelData.SetConstraint
  parent:
    association: ClassConstraint
    role: Constraint
    note: see mandatoryConstraint's parent note - same previously-missing attachment, same fix.
  attribute_bindings:
    Name:
      source:
        field: Name|INTERLIS
        kind: alt_token_or_rule
        optional: true
      note: 'Includes alt B "INTERLIS COLON" - the literal token INTERLIS used as the constraint name.

        '
    Where:
      source:
        field: expression
        index: 0
        optional: true
      note: confirmed attribute SetConstraint.Where (Expression, ilismeta16-classes.yml); populated by
        the expression immediately following WHERE in either alternative.
    Constraint:
      source:
        field: expression
        index: -1
      note: confirmed attribute SetConstraint.Constraint (Expression); the final expression before SEMI
        in either alternative (the actual boolean constraint, after the optional WHERE-expression and
        optional Name/INTERLIS label).
  note: 'Grammar (setConstraint()), 2 structurally distinct alternatives
    inside one method: SET CONSTRAINT (LPAR (LOCAL|BASKET) RPAR)? alt A: Name COLON WHERE expression(0)
    COLON expression(1) alt B: (WHERE expression(0) COLON)? (Name COLON | INTERLIS COLON)? expression(last)
    SEMI'
term:
  grammar:
    rule: term
  kind: Conditional
  when_present:
    EQ:
      target: IlisMeta16.ModelData.CompoundExpr
      discriminant:
        attribute: Operation
        value: Implication
  attribute_bindings:
    SubExpressions:
      source:
        field: term0
        multi: true
      note: confirmed attribute on CompoundExpr (Expression, multiplicity 0..*); populated with [term0(0),
        term0(1)] only when the '=> term0' branch matched, else this rule degenerates to returning term0(0)
        directly without constructing a CompoundExpr.
  note: 'The optional EQ GT term0 produces a CompoundExpr with Operation=Implication (kind-values.yml),
    aligned with the same Conditional schema as term0/term1/term2/predicate.
    Grammar (term()): term0(0) (EQ GT
    term0(1))?  -- i.e. ''term0 (=> term0)?'' EQ+GT together spell the ''=>'' (implication) operator.
    `when_present` keys on "EQ" (not a composed "EQ_GT", which does not exist as a real accessor -
    TermContext exposes EQ()/GT() separately, both single `getToken` accessors, real `None` when
    absent): confirmed unambiguous for THIS rule specifically (term() has no other use of EQ/GT), so
    checking EQ alone correctly detects the ''=>'' branch. Previously spec''d as the nonexistent
    "EQ_GT", making `ca.has_accessor(ctx, "EQ_GT")` always False and this branch permanently dead -
    every `A => B` expression silently fell through to the plain pass-through (term0(0) only, B
    silently discarded) instead of building the intended Implication CompoundExpr.'
term0:
  grammar:
    rule: term0
  kind: Conditional
  when_present:
    OR:
      target: IlisMeta16.ModelData.CompoundExpr
      discriminant:
        attribute: Operation
        value: Or
  attribute_bindings:
    SubExpressions:
      source:
        field: term1
        multi: true
      note: only constructed as CompoundExpr when at least one operator is present; pure pass-through
        to the single term1 otherwise (mirrors term()'s optional-operator pattern)
  note: 'Conditionally produces IlisMeta16.ModelData.CompoundExpr with Operation=Or when OR is present.
    Grammar (term0()): term1 ((OR|PLUS|MINUS) term1)*. PLUS/MINUS are not listed as CompoundExpr operations
    in kind-values.yml - arithmetic may be handled differently, unconfirmed.'
term1:
  grammar:
    rule: term1
  kind: Conditional
  when_present:
    AND:
      target: IlisMeta16.ModelData.CompoundExpr
      discriminant:
        attribute: Operation
        value: And
    MUL:
      target: IlisMeta16.ModelData.CompoundExpr
      discriminant:
        attribute: Operation
        value: Mult
    DIV:
      target: IlisMeta16.ModelData.CompoundExpr
      discriminant:
        attribute: Operation
        value: Div
  attribute_bindings:
    SubExpressions:
      source:
        field: term2
        multi: true
      note: only constructed as CompoundExpr when at least one operator is present; pure pass-through
        to the single term2 otherwise
  note: 'Conditionally produces IlisMeta16.ModelData.CompoundExpr with Operation=And/Mult/Div when
    AND/MUL/DIV present. Grammar (term1()): term2 ((AND|MUL|DIV|POW) term2)*. POW is not in
    kind-values.yml''s Operation list, unconfirmed.'
term2:
  grammar:
    rule: term2
  kind: Conditional
  when_present:
    relation:
      target: IlisMeta16.ModelData.CompoundExpr
      discriminant:
        attribute: Operation
        value: Relation
  attribute_bindings:
    SubExpressions:
      source:
        field: predicate
        multi: true
      note: '[predicate(0), predicate(1)] when relation() branch matched'
    _relation_child:
      source:
        field: relation
        optional: true
      note: feeds the 'Relation' children enum (Equal/NotEqual/etc.) - see relation() binding for the
        exact token->value mapping
  note: 'Conditionally produces IlisMeta16.ModelData.CompoundExpr with Operation=Relation when a relation()
    is present; otherwise pass-through to predicate. Grammar (term2()): predicate(0) (relation predicate(1))?.'
uniqueEl:
  grammar:
    rule: uniqueEl
  kind: Container
  feeds_into: IlisMeta16.ModelData.PathOrInspFactor
  attribute_bindings:
    _dispatch:
      source:
        field: objectOrAttributePath
      note: 'PathOrInspFactor has PathEls (list of PathEl) and Inspection (INTERLIS.NAME); which of the
        two objectOrAttributePath feeds depends on ObjectOrAttributePathContext''s own structure - deferred
        to Expressions, which covers objectOrAttributePath/attributePath/pathEl. Not resolved
        here (out of scope for this rule).'
  note: 'No direct IlisMeta16 instance expected. Pure pass-through to objectOrAttributePath, which resolves
    to PathOrInspFactor: a single wrapper with no own tokens.'
uniquenessConstraint:
  grammar:
    rule: uniquenessConstraint
  kind: Instance
  target: IlisMeta16.ModelData.UniqueConstraint
  parent:
    association: ClassConstraint
    role: Constraint
    note: see mandatoryConstraint's parent note - same previously-missing attachment, same fix.
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
        optional: true
    Where:
      source:
        field: expression
        optional: true
      note: 'Feeds UniqueConstraint.Where (Expression, 0..1, ilismeta16-classes.yml)
        from the "WHERE expression" clause - same pattern as setConstraint.Where.

        '
  note: 'Kind is not carried by a (LOCAL|BASKET) qualifier on uniquenessConstraint itself - that
    qualifier is consumed before the (globalUniqueness|localUniqueness)+ loop, at the enclosing level.
    Kind=GlobalU by default (body containing only globalUniqueness); Kind=LocalU/BasketU if the body
    contains a localUniqueness clause carrying its own (LOCAL) or (BASKET) (see localUniqueness below).
    Grammar: UNIQUE (LPAR BASKET RPAR)? (Name COLON)? (WHERE expression COLON)? (globalUniqueness |
    localUniqueness)+ SEMI. Background on the grammar fix (BASKET/Where placement, 2006 vs 2024 edition
    of the Reference Manual): docs/dev-notes/uniqueness-constraint-grammar-fix-investigation.md.'
