    niveau metamodel.target). || Confirmed via grammar (term(), source ~10790-10815): term0(0) (EQ GT
    term0(1))?  -- i.e. ''term0 (=> term0)?'' EQ+GT together spell the ''=>'' (implication) operator.'
term0:
  grammar:
    rule: term0
  kind: Conditional
  when_present:
    OR:
      target: IlisMeta16.ModelData.CompoundExpr
