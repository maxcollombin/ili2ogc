  note: 'Kind resolved dynamically: LTEQ -> LowPercC, GTEQ -> HighPercC || Confirmed via grammar (plausibilityConstraint(),
    source ~9944-10012): CONSTRAINT (Name COLON)? (LTEQ|GTEQ) numericConst MOD expression SEMI'
predicate:
  grammar:
    rule: predicate
  kind: Conditional
  when_present:
    NOT:
      target: IlisMeta16.ModelData.UnaryExpr
      discriminant:
        attribute: Operation
        value: Not
    DEFINED:
      target: IlisMeta16.ModelData.UnaryExpr
      discriminant:
        attribute: Operation
        value: Defined
  attribute_bindings:
    SubExpression:
      source:
        field: expression
        optional: true
      note: 'CORRIGE (Lot 38) : `alt: 2` retire (`ctx.getAltNumber()` toujours 0, voir PROGRESS.md Lot
        37/38 - ce binding etait TOUJOURS None jusqu''ici, malgre "confirme"). Sans consequence a le
        retirer : `expression` n''est un accesseur direct de `predicate` (factor | (NOT)? LPAR expression
        RPAR | DEFINED LPAR factor RPAR | LPAR BASKET RPAR factor) que sur l''alternative 2. Attention
        (verifie sur `_build_conditional`, model_builder.py) : CE binding ET `_defined_factor` sont TOUS
        LES DEUX evalues pour CHAQUE branche `when_present` prise (NOT ou DEFINED) - PAS uniquement la
        branche a laquelle chacun "appartient" semantiquement - `optional: true` (deja present) est donc
        INDISPENSABLE ici (accesseur reellement absent dans la branche DEFINED), pas une simple securite.
        Alt2''s parenthesized expression, wrapped as SubExpression when NOT is present.'
    _defined_factor:
      source:
        field: factor
        optional: true
      note: 'CORRIGE (Lot 38) : `alt: 3` retire, meme raison/verification que SubExpression ci-dessus -
        `factor` est aussi un accesseur direct des alternatives 1 et 4 (sans consequence, distinct de la
        preoccupation ci-dessous). **`optional: true` AJOUTE** (absent avant ce lot) : contrairement a
        `Format`/`Struct`/etc. (rules `Instance`/`Container`, un seul passage par ctx), `predicate` est
        `kind: Conditional` - `_build_conditional` applique la TOTALITE de `attribute_bindings` (donc
        AUSSI `_defined_factor`) pour CHAQUE branche `when_present` prise, pas seulement celle ou son
        accesseur s''applique reellement. Sans `optional: true`, la branche NOT (ou `factor` est
        legitimement absent) aurait leve un `BuildError` au lieu de retourner None - masque jusqu''ici
        UNIQUEMENT parce que l''ancien `alt: 3` (toujours faux) court-circuitait deja tout vers None avant
        d''atteindre ce test, quel que soit `optional`. Alt3''s DEFINED LPAR factor RPAR - UnaryExpr.SubExpression is typed Expression,
        not Factor directly (ilismeta16-datatypes.yml); ModelBuilder must wrap the factor in an Expression
        envelope to satisfy the type, or this indicates SubExpression''s declared type is looser than
        shown - not fully reconciled here.'
  note: 'Conditionally produces IlisMeta16.ModelData.UnaryExpr (Operation=Not or Operation=Defined) when
    NOT/DEFINED tokens are present; otherwise pure pass-through to factor or a parenthesized expression.
    || Confirmed via grammar (predicate(), source ~11083-11148), 4 distinct alternatives (RULE #3): alt1:
    factor()                                    -> pure pass-through alt2: NOT? LPAR expression RPAR                    ->
    UnaryExpr(Not) if NOT present, else pass-through to expression alt3: DEFINED LPAR factor RPAR                     ->
    UnaryExpr(Defined) alt4: LPAR BASKET RPAR factor                      -> unresolved special case'
relation:
  grammar:
    rule: relation
  kind: Container
  attribute_bindings:
    RelationKind:
      source:
        field: EQ+EQ|NOT_EQ|LT+GT|LTEQ|GTEQ|LT|GT
        kind: alt_token
      mapping:
        EQ EQ: Equal
        NOT_EQ: NotEqual
        LT GT: NotEqual
        LTEQ: LessOrEqual
        GTEQ: GreaterOrEqual
        LT: Less
        GT: Greater
      note: 7 grammar alternatives map onto 6 confirmed enum children with NOT_EQ and 'LT GT' both plausibly
        meaning not-equal (two spellings of the same relation, similar to '<>' vs '#'/'!=' conventions
        in other languages) - this specific double-mapping is inferred from count/semantics, not from
        a cited spec section; documented rather than silently assumed elsewhere. This rule itself constructs
        no class instance - it only supplies the RelationKind value consumed by the enclosing term2's
        CompoundExpr(Operation=Relation).
  note: 'No direct IlisMeta16 instance expected. Resolves the relational operator symbol (EQ/NOT_EQ/LT/GT/LTEQ/GTEQ)
    used by term2 to set CompoundExpr.Operation=Relation with the matching sub-value (Equal/NotEqual/Less/Greater/LessOrEqual/
    GreaterOrEqual). || Confirmed via grammar (relation(), source ~11187-11237), 7 alternatives mapping
    to the 6 confirmed children of CompoundExpr.Operation=Relation (ilismeta16-kind-values.yml): Equal/NotEqual/LessOrEqual/GreaterOrEqual/Less/Greater.'
