        faire planter tout le build. MetaBasketDef reste donc construit SANS ses MetaObjectDef enfants.
        A revisiter si un besoin reel de resoudre le detail des OBJECTS OF se presente.

        '
  note: 'Kind resolved dynamically: SIGN -> SignB, REFSYSTEM -> RefSystemB'
