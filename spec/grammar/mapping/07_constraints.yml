  note: 'CORRIGE (audit croisé grammar-metamodel-mapping.yml/python-bindings.yml, 2026-08-02, avant fusion
    spec). Le commentaire "needs confirmation" etait perime : deja confirme cote python-bindings.yml (kind-values.yml)
