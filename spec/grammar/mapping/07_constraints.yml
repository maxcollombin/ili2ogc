argument:
  grammar:
    rule: argument
  kind: Instance
  target: IlisMeta16.ModelData.ActualArgument
  discriminant:
    attribute: Kind
    dynamic: true
    rule:
      ALL: AllOf
      default: Expression
  attribute_bindings:
    Expression:
      source:
        field: expression
        optional: true
      note: 'CORRIGE (Lot 38) : `alt: 1` retire (`ctx.getAltNumber()` toujours 0 pour cette grammaire,
        voir PROGRESS.md Lot 37/38) - sans consequence, `expression` n''est accessible directement que
        sur l''alternative 1 (grammaire `argument : expression | ALL (...)`), jamais l''alternative 2.
        Confirmed attribute Expression: IlisMeta16.ModelData.Expression on ActualArgument, populated only
        for the Kind=Expression alternative.'
    ObjectClasses:
      source:
        field: restrictedClassOrAssRef
        optional: true
      note: 'CORRIGE (Lot 38) : `alt: 2` retire, meme raison que Expression ci-dessus - `restrictedClassOrAssRef`
        n''est accessible que dans la branche ALL (...) de la grammaire, jamais l''alternative 1. Confirmed
        attribute ObjectClasses: IlisMeta16.ModelData.ClassRef (0..*) on ActualArgument, for the ''ALL
        (restrictedClassOrAssRef)'' variant. restrictedClassOrAssRef already resolves to classOrAssociationRef
        entries (confirmed in Lot 4), feeding this list.'
  note: 'Kind resolved dynamically: ALL present -> AllOf, otherwise Expression Paths and references ||
    Confirmed via grammar (argument(), source ~12038-12070+), 2 alternatives: alt1: expression() alt2:
    ALL (LPAR restrictedClassOrAssRef RPAR | viewableRef RPAR)'
associationPath:
  grammar:
    rule: associationPath
  kind: Container
  attribute_bindings:
    Ref:
      source:
        field: Name
      note: feeds PathEl.Ref (INTERLIS.NAME, confirmed) on the enclosing pathEl (Kind=AssocPath)
    _leading_backslash:
      status: not_applicable
      note: 'Lot 18 (phase 2, résidus Phase 1). Preuve d''absence exhaustive : `PathEl` (ilismeta16-datatypes.yml/XMI)
        n''a que 4 attributs own - Kind, Ref, NumIndex, SpecIndex - aucun ne se prête à encoder "direction
        de traversée de l''association". Décision ModelBuilder : le BACKSLASH optionnel est un marqueur
        de désambiguïsation purement syntaxique, consommé au moment de la RÉSOLUTION du nom d''association
        (pour choisir quelle association porte ce nom en cas d''ambiguïté), sans effet sur les données
        stockées dans le PathEl résultant une fois l''association résolue - Ref reste le nom de l''association,
        identique avec ou sans backslash.

        '
  note: 'No direct IlisMeta16 instance expected. Disambiguates which association role to follow within
    a pathEl. Attribute references || Confirmed via grammar (associationPath(), source ~11778-11794):
    BACKSLASH? Name  -- an optional leading backslash then an association name, used to select which association
    a path traverses when a role name alone would be ambiguous. No dedicated ''AssociationPath'' class
    exists in the metamodel (grep confirms none) - this rule feeds directly into the enclosing pathEl''s
    PathEl.Ref/Kind=AssocPath, no separate class instance.'
attributePath:
  grammar:
    rule: attributePath
  kind: Container
  feeds_into: IlisMeta16.ModelData.PathOrInspFactor
  attribute_bindings:
    _dispatch:
      source:
        field: objectOrAttributePath
      note: pass-through construction - same target PathOrInspFactor as objectOrAttributePath itself;
        this rule adds no fields of its own.
  note: 'No direct IlisMeta16 instance expected. Pure pass-through to objectOrAttributePath. || Confirmed
    via grammar (attributePath(), source ~11581-11592): a pure single-child wrapper around objectOrAttributePath()
    - no own tokens.'
attributeRef:
  grammar:
    rule: attributeRef
  kind: Container
  attribute_bindings:
    Ref:
      source:
        field: Name
        optional: true
      note: 'CORRIGE (Lot 38) : `alt: 1` retire (`ctx.getAltNumber()` toujours 0, voir PROGRESS.md Lot
        37/38) - sans consequence, `Name` n''est accessible directement que sur l''alternative 1
        (grammaire `attributeRef : Name (...)? | AGGREGATES`), jamais sur AGGREGATES (alt2, aucun Name).
        Feeds PathEl.Ref (INTERLIS.NAME) on the enclosing pathEl (Kind=Attribute, corrected - see pathEl
        binding).'
    SpecIndex:
      source:
        field: FIRST|LAST
        kind: alt_token
        optional: true
      note: 'confirmed 1:1 match: PathEl.SpecIndex enum values are exactly First/Last (ilismeta16-kind-values.yml),
        matching attributeRef''s FIRST/LAST tokens inside the optional LSBR...RSBR bracket.'
    NumIndex:
      source:
        field: Number
        optional: true
      note: 'Lot 18 (phase 2, résidus Phase 1) - CONFIRMÉ, pas de mismatch (voir pathEl.NumIndex pour
        la preuve complète) : `MultRange` est un `uml:PrimitiveType` scalaire (docs/uml/IlisMeta16-formatted.xmi
        l.306-307), pas une structure Min/Max à deux bornes - le `Number` unique du bracket l''alimente
        donc directement, sans transformation ni "range dégénéré" à construire.

        '
  note: 'CORRIGE (audit croisé grammar-metamodel-mapping.yml/python-bindings.yml, 2026-08-02, avant fusion
    spec). L''ancien target AttrOrParam (et semantics.reference.target) ici n''a jamais ete confirme par
    un grep - non detecte par check_mapping.py car ce champ n''est pas dans son perimetre de validation
    (metamodel.target uniquement). Deja corrige cote python-bindings.yml (RULE #1, note "Reset to null")
    : cette regle ne construit pas sa propre instance, elle alimente les champs (Name/FIRST/LAST/Number/AGGREGATES)
    du PathEl construit par la regle ENGLOBANTE pathEl (alt8) - voir python-bindings.yml:attributeRef
    pour le detail complet. 08_functions_units Functions, parameters and units Function definitions ||
    Confirmed via grammar (attributeRef(), source ~11844-11884), 2 alternatives: alt1: Name (LSBR (FIRST|LAST|Number)
    RSBR)? alt2: AGGREGATES CORRECTION (RULE #1): the previous target IlisMeta16.ModelData. AttrOrParam
    here was NOT confirmed by any grep match tying attributeRef() specifically to AttrOrParam construction
    - AttrOrParam is a real class (ilismeta16-classes.yml) but nothing here justifies picking it over
    the far better-fitting PathEl, given attributeRef() is only ever called from pathEl() (alt8) and its
    own Name/FIRST/LAST/ Number tokens line up closely with PathEl''s own Ref/SpecIndex attributes. Reset
    to null: this rule contributes fields to the ENCLOSING pathEl''s PathEl instance, it does not construct
    its own class. CORRECTION (Lot 13, point 9): the enclosing pathEl alt8 -> Kind was previously labelled
    ReferenceAttr; re-examined against the INTERLIS 2 Reference Manual edition 2006-04-13 EBNF (section
    "Factors", p.61), which separates "ReferenceAttribute-Name" (a bare Name, no qualifier) from "AttributeRef"
    (Attribute-Name with optional [FIRST|LAST| Position] or AGGREGATES) as two DISTINCT PathEl alternatives.
    This project''s attributeRef() rule matches "AttributeRef" structurally (Name + optional [FIRST|LAST|Number]
    bracket, or AGGREGATES), so the enclosing pathEl''s Kind is now confirmed Attribute, not ReferenceAttr
    (see pathEl binding above for the full corrected mapping).'
constraintDef:
  grammar:
    rule: constraintDef
  kind: Container
  attribute_bindings:
    _dispatch:
      source:
        field: mandatoryConstraint|plausibilityConstraint|existenceConstraint|uniquenessConstraint|setConstraint|expression
        kind: alt_rule
      note: alt 6 (bare expression, no keyword) is plausibly a SimpleConstraint with Kind left unset (SimpleConstraint.Kind
        is optional per ilismeta16-kind-values.yml) and LogicalExpression=expression, by analogy with
        mandatoryConstraint/plausibilityConstraint. Not asserted as certain - ModelBuilder should route
        it through the same SimpleConstraint construction but without a Kind value.
  note: 'No direct IlisMeta16 instance expected. Dispatcher between mandatoryConstraint, plausibilityConstraint,
    existenceConstraint, uniquenessConstraint, setConstraint, or a bare boolean expression constraint.
    Constraint variants || Pure dispatcher rule: 6 alternatives (constraintDef(), source ~9773-9820).
    No own target - delegates to each sub-rule''s own construction, except alt 6 (bare `expression SEMI`,
    no keyword).'
constraintsDef:
  grammar:
    rule: constraintsDef
  kind: Container
  parent:
    association: ClassConstraint
    role: Constraint
    note: confirmed association IlisMeta16.ModelData.ClassConstraint (ilismeta16-associations.yml), ends
      ToClass/Constraint. If classOrAssociationRef resolves to an association, the same ClassConstraint
      association still applies since Association IS a Class (Kind=Association) - not DomainConstraint,
      which targets DomainType instead.
  attribute_bindings:
    Constraints:
      source:
        field: constraintDef
        multi: true
      note: each constraintDef -> a Constraint subclass instance (SimpleConstraint/ExistenceConstraint/UniqueConstraint/SetConstraint),
        appended via the ClassConstraint association (Constraint role) to the class resolved from classOrAssociationRef
  note: 'Container for constraint declarations. Meta objects and baskets || Confirmed via grammar (constraintsDef(),
    source ~10680-10730): CONSTRAINTS OF classOrAssociationRef EQ constraintDef* END SEMI A standalone
    topic-level block that ADDS constraints to an already-declared class/association (e.g. from an extending
    topic).'
existenceConstraint:
  grammar:
    rule: existenceConstraint
  kind: Instance
  target: IlisMeta16.ModelData.ExistenceConstraint
  parent:
    association: ExistenceDef
    role: ExistenceConstraint
    note: confirmed association IlisMeta16.ModelData.ExistenceDef (ilismeta16-associations.yml), ends
      ExistenceConstraint/ExistsIn; ExistsIn (target Class) is resolved from viewableRef(0).
  attribute_bindings:
    Name:
      source:
        field: Name
        optional: true
      note: ExistenceConstraint.Name is inherited from Constraint (mandatory) - same caveat as mandatoryConstraint.
    Attr:
      source:
        field: attributePath
        index: 0
      note: 'confirmed attribute Attr: IlisMeta16.ModelData.PathOrInspFactor on ExistenceConstraint (ilismeta16-classes.yml);
        attributePath(0) is the attribute whose existence is required. attributePath()''s internal PathEls/Inspection
        dispatch is Lot 7 (Expressions) - not resolved here.'
  note: 'CORRIGE (Lot 20, phase 2 - bug de grammaire confirme par test empirique ET corrige, voir grammar-divergences.md
    pour l''historique complet). AVANT : "EXISTENCE CONSTRAINT (Name COLON)? attributePath(0) REQUIRED
    IN viewableRef COLON attributePath(1) SEMI" - un seul couple viewableRef/attributePath, alors que
    le Reference Manual eCH-0031 V2.1.0 (§3.12) prevoit une clause repetable "{''OR'' ViewableRef '':''
    AttributePath}". Teste empiriquement (antlr4-python3-runtime) : rejetait "... : Attr OR Viewable2
    : Attr2;" (erreur de syntaxe sur OR) avant correction. APRES : "EXISTENCE CONSTRAINT (Name COLON)?
    attributePath(0) REQUIRED IN viewableRef(0) COLON attributePath(1) (OR viewableRef(i) COLON attributePath(i))*
    SEMI" - accessors viewableRef/attributePath desormais rule_multi (getTypedRuleContexts), nouvel accessor
    OR (token_multi). Parser regenere dans src/interlis/antlr/, mappings/antlr-rule-index.yml regenere
    (RULE #2bis), corrige dans vendor/interlis-antlr4/InterlisParser.g4.'
expression:
  grammar:
    rule: expression
  kind: Container
  feeds_into: IlisMeta16.ModelData.Expression
  attribute_bindings:
    _dispatch:
      source:
        field: term
      note: Expression has no own attributes - the concrete shape (UnaryExpr/CompoundExpr/Factor-derived)
        is entirely determined by what term() resolves to, recursively through term0/term1/term2/predicate/factor.
  note: 'No direct IlisMeta16 instance expected. Pure pass-through to term; the actual Expression subtype
    (UnaryExpr / CompoundExpr / Constant / FunctionCall / etc.) is produced further down the precedence
    chain (term0/term1/term2/factor). Expression operators || Confirmed via grammar (expression(), source
    ~10741-10754): pure single-child wrapper around term() - no own tokens. IlisMeta16.ModelData.Expression
    (ilismeta16-datatypes.yml) is a DataType with attributes.own: {} - a pure opaque/abstract container,
    confirming this rule has nothing of its own to bind either.'
factor:
  grammar:
    rule: factor
  kind: Conditional
  when_present:
    objectOrAttributePath:
      target: IlisMeta16.ModelData.PathOrInspFactor
  attribute_bindings:
    _dispatch:
      source:
        field: objectOrAttributePath|inspection|functionCall|constant|Number
        kind: alt_rule_or_token
      note: '8 alternatives:

        1. objectOrAttributePath() -> PathOrInspFactor-like path (see objectOrAttributePath binding)

        2. (inspection()|INSPECTION viewableRef) (OF objectOrAttributePath)? -> feeds PathOrInspFactor.Inspection;
        inspection() itself is Lot 9 (Views) scope, not resolved here

        3. functionCall() -> confirmed IlisMeta16.ModelData.FunctionCall

        4. INTERLIS DOT (URI|UUIDOID|...) (LPAR expression (COMMA expression)* RPAR)? -> unresolved, see
        below

        5. PARAMETER (Name DOT)? Name -> matches IlisMeta16.ModelData.RuntimeParamRef (confirmed DataType,
        ilismeta16-datatypes.yml) with RuntimeParam:NAME; the optional ''Name DOT'' prefix (topic qualifier)
        has no dedicated attribute slot on RuntimeParamRef (own: {RuntimeParam only}) - unresolved for
        that qualifier specifically

        6. ALL (OF objectOrAttributePath)? -> unresolved, no confirmed ''AllOf''-style Factor subtype
        found (ActualArgument.Kind has an ''AllOf'' value but that belongs to argument(), a different
        rule - see argument binding)

        7. constant() -> confirmed IlisMeta16.ModelData.Constant (already bound elsewhere)

        8. Number token -> presumably a numeric literal Constant(Type=Numeric) equivalent, but Number
        here is a bare token match with no constant() wrapper - unresolved whether ModelBuilder should
        synthesize a Constant or a distinct numeric Factor.

        '
  note: 'Dispatcher/wrapper for expression leaves. When objectOrAttributePath (optionally with an inspection()
    clause) is present, produces IlisMeta16.ModelData.PathOrInspFactor (PathEls from objectOrAttributePath,
    Inspection from inspection()). Otherwise delegates to functionCall, a parenthesized expression, or
    a constant/reference token. Function calls inside expressions || Confirmed via grammar (factor(),
    source ~11336-11500), 8 alternatives (RULE #3). IlisMeta16.ModelData.Factor (ilismeta16-datatypes.yml)
    is an empty DataType (attributes.own: {}) - a pure abstract marker, like Expression/Constraint. Each
    alternative dispatches to its own already- confirmed concrete construction rather than populating
    Factor fields.'
functionCall:
  grammar:
    rule: functionCall
  kind: Instance
  target: IlisMeta16.ModelData.FunctionCall
  attribute_bindings:
    Function:
      source:
        field: Name
        index: -1
        join: .
      note: 'confirmed attribute Function: INTERLIS.NAME on FunctionCall (ilismeta16-datatypes.yml). Grammar:
        (Name DOT)? (Name DOT)? Name LPAR ... RPAR - up to 3 Name tokens (qualifier.qualifier.functionName);
        the last Name is the actual function name, joined with any preceding qualifier Names via DOT for
        a fully-qualified reference.'
    Arguments:
      source:
        field: argument
        multi: true
      note: 'confirmed attribute Arguments: IlisMeta16.ModelData.ActualArgument (0..*) on FunctionCall;
        each argument() -> one ActualArgument (see argument binding below)'
  note: Expression arguments
globalUniqueness:
  grammar:
    rule: globalUniqueness
  kind: Container
  attribute_bindings:
    Elements:
      source:
        field: uniqueEl
        multi: true
      note: each uniqueEl -> one PathOrInspFactor entry, appended to the enclosing UniqueConstraint.UniqueDef
        list (no intermediate class instance)
  note: 'No direct IlisMeta16 instance expected. Comma-separated list of uniqueEl. Corresponds to Kind=GlobalU
    on the enclosing UniqueConstraint (created by uniquenessConstraint) when no localUniqueness clause
    is present in the same statement; feeds its UniqueDef (PathOrInspFactor list). No qualifier of its
    own (matches the official INTERLIS 2 Reference Manual EBNF, where GlobalUniqueness never carries a
    LOCAL/BASKET marker). || Confirmed via grammar (globalUniqueness(), source ~10260-10287): uniqueEl
    (COMMA uniqueEl)* - a comma-separated list of path elements. RULE #1 check: grep for "GlobalUniqueness"
    as a class name in mappings/ilismeta16-*.yml returns NOTHING - no such class exists. This matches
    the documented historical error to avoid (see copilot-instructions.md). This rule does NOT construct
    a class instance of its own; it only produces a list of PathOrInspFactor entries (via uniqueEl) that
    feed the enclosing UniqueConstraint''s UniqueDef attribute directly. CORRECTION (3e correction uniquenessConstraint,
    RULE #4 edition 2024) : globalUniqueness() elle- meme ne porte toujours aucun qualificatif propre,
    MAIS un corps globalUniqueness peut desormais etre associe a Kind=BasketU via le (BASKET) de l''englobant
    uniquenessConstraint (voir binding uniquenessConstraint.discriminant ci-dessus) - la note precedente
    ("GlobalUniqueness never carries LOCAL/BASKET") reste vraie au niveau de CETTE regle mais ne signifiait
    pas que Kind=BasketU etait impossible pour un corps global.'
localUniqueness:
  grammar:
    rule: localUniqueness
  kind: Container
  attribute_bindings:
    Kind:
      source:
        field: LOCAL
        presence: true
      mapping:
        LOCAL: LocalU
      note: 'CORRIGE (3e correction, RULE #4 edition 2024). Feeds the enclosing UniqueConstraint.Kind
        = LocalU (mandatory GlobalU/ BasketU/LocalU, ilismeta16-kind-values.yml) - LOCAL est desormais
        le SEUL token possible ici (BASKET n''est plus une alternative a ce niveau, voir uniquenessConstraint.discriminant
        pour le nouveau mecanisme de Kind=BasketU au niveau englobant).

        '
  note: 'No direct IlisMeta16 instance expected. CORRIGE (grammaire .g4 fixee) : porte desormais elle-meme
    son propre qualificatif MANDATORY "LPAR (LOCAL|BASKET) RPAR" (retire du niveau englobant uniquenessConstraint
    - voir commentaire ci-dessus et grammar-divergences.md). Sets Kind=LocalU ou Kind=BasketU sur l''enclosing
    UniqueConstraint selon le mot-cle capture ici. Le chemin de roles (Name (MINUS GT Name)*) et la liste
    d''attributs finale (COLON Name (COMMA Name)*)? alimentent probablement UniqueDef (PathOrInspFactor)
    - construction exacte encore une hypothese, voir python-bindings.yml. || CORRIGE x2 (Lot 14 point
    6, puis 3e correction uniquenessConstraint - voir grammar-divergences.md pour l''historique complet).
    Bug de grammaire confirme et corrige (RULE #4) : - AVANT (originel) : "UNIQUE (LPAR (LOCAL|BASKET)
    RPAR)? (Name COLON)? Name (MINUS GT Name)* (COLON Name (COMMA Name)*)? SEMI", avec un UNIQUE propre
    exigeant un UNIQUE IMBRIQUE dans l''englobant - INATTEIGNABLE pour la syntaxe naturelle. Confirme
    par test empirique de parsing. - CORRECTION INTERMEDIAIRE (Lot 14 point 6, basee sur l''edition 2006
    du Reference Manual) : "LPAR (LOCAL|BASKET) RPAR (Name COLON)? Name (MINUS GT Name)* (COLON Name (COMMA
    Name)*)?" - UNIQUE/SEMI retires, qualificatif rendu MANDATORY mais a tort fusionne LOCAL/BASKET. -
    CORRECTION FINALE (RULE #4 sur l''edition 2024, V2.1.0, approuvee 2024-04-24, qui PREVAUT sur l''edition
    2006) : "LocalUniqueness = ''('' ''LOCAL'' '')'' StructureAttribute-Name {...} ..." - (LOCAL) SEUL,
    jamais (BASKET) a ce niveau (BASKET est un qualificatif du niveau uniquenessConstraint, voir ce binding).
    Grammaire corrigee en consequence : "LPAR LOCAL RPAR (Name COLON)? Name (MINUS GT Name)* (COLON Name
    (COMMA Name)*)?". Confirme par test empirique complet (LOCAL et BASKET testes separement : BASKET
    dispatche desormais correctement vers globalUniqueness avec Kind=BasketU, LOCAL vers localUniqueness
    avec Kind=LocalU) + non-regression sur le corpus de 342 modeles reels (339/342, aucun changement par
    rapport aux corrections precedentes) + non-regression sur tous les tests synthetiques anterieurs.
    RULE #1 check: no "LocalUniqueness" class exists in the metamodel (same grep as globalUniqueness above
    returns nothing) - this rule must NOT construct its own class instance either.'
mandatoryConstraint:
  grammar:
    rule: mandatoryConstraint
  kind: Instance
  target: IlisMeta16.ModelData.SimpleConstraint
  discriminant:
    attribute: Kind
    value: MandC
  attribute_bindings:
    Name:
      source:
        field: Name
        optional: true
      note: optional 'Name COLON' prefix before the expression, confirmed via MandatoryConstraintContext.Name()/COLON().
        SimpleConstraint.Name is inherited from Constraint (mandatory, upper=1) - if grammar omits Name,
        ModelBuilder must supply a default.
    LogicalExpression:
      source:
        field: expression
      note: confirmed attribute on IlisMeta16.ModelData.SimpleConstraint (ilismeta16-classes.yml)
  note: 'Confirmed via grammar (mandatoryConstraint(), source ~9863-9915): MANDATORY CONSTRAINT (Name
    COLON)? expression SEMI'
metaDataBasketDef:
  grammar:
    rule: metaDataBasketDef
  kind: Instance
  target: IlisMeta16.ModelData.MetaBasketDef
  discriminant:
    attribute: Kind
    dynamic: true
    rule:
      SIGN: SignB
      REFSYSTEM: RefSystemB
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: inherited Name (MetaElement)
    Kind:
      source:
        field: SIGN|REFSYSTEM
        kind: alt_token
      rule:
        SIGN: SignB
        REFSYSTEM: RefSystemB
      note: confirmed MetaBasketDef.Kind enum (SignB/RefSystemB, kind-values.yml) - the mandatory leading
        '(SIGN|REFSYSTEM) BASKET' token dispatches the value directly.
    Final:
      source:
        field: FINAL
        presence: true
      note: optional FINAL token before the extends/topic clause; MetaBasketDef inherits Final from ExtendableME
        (confirmed own attr list includes it via inherited).
    extends_metaDataBasketRef:
      source:
        field: metaDataBasketRef
        optional: true
      note: 'CONFIRME (Lot 16, sous-groupe metaDataBasketDef). RULE #4, Reference Manual eCH-0031 V2.1.0
        (2024-04-24) §3.10.1, EBNF exact : "MetaDataBasketDef = (''SIGN''|''REFSYSTEM'') ''BASKET'' Basket-Name
        Properties<FINAL> [''EXTENDS'' MetaDataBasketRef] ''~'' TopicRef {...} '';''." MetaBasketDef EXTENDS
        ExtendableME, donc l''association generique Inheritance (Sub {0..*} ExtendableME <-> Super {0..1}
        ExtendableME, deja confirmee pour classDef/structureDef/viewDef/graphicDef/unitDef/DataUnit -
        Lots 12/13/15) s''applique ici aussi : feeds Inheritance (Sub = ce MetaBasketDef, Super = MetaBasketDef
        resolu par metaDataBasketRef()). Meme pattern reutilise, aucune nouvelle association necessaire.

        '
    topicRef:
      source:
        field: topicRef
      optional: true
      note: 'CONFIRME (Lot 16, sous-groupe metaDataBasketDef). La clause mandatory ''TILDE topicRef()''
        alimente IlisMeta16.ModelData.MetaDataUnit (MetaBasketDef {0..*} <-> MetaDataTopic {1..1} DataUnit,
        ilismeta16-associations.yml) : MetaDataTopic = la DataUnit, PAS le SubModel. topicRef() lui-meme
        resout vers SubModel (son target confirme), mais grace au design dual SubModel+DataUnit du TOPIC
        (Metamodel §2.1.4, point 18, deja confirme pour topicDef/DataUnit.Dependency) : le MetaDataTopic
        recherche ici est le jumeau DataUnit (nomme "BASKET") du meme topic, resolu par le meme Name que
        topicRef() a trouve pour le SubModel - pas une association MetaBasketDef<->SubModel distincte
        (fausse piste de l''ancienne note, la confusion terminologique SubModel/DataUnit etant justement
        le sujet du point 18).

        NON IMPLEMENTE cote moteur (Lot 28, decouvert en construisant CHBase_Part1_GEOMETRY_V1.ili,
        premier fichier reel du corpus a exercer "REFSYSTEM BASKET ... ~ topicRef") : le moteur generique
        (AttachmentResolver.attach) ne sait pas suivre `_twin` avant d''attacher - attacher directement le
        SubModel resolu leve BuildError ("topicRef introuvable comme attribut/role sur MetaBasketDef", la
        cle attendue etant en realite le role MetaDataTopic de l''association MetaDataUnit, cote DataUnit).
        `optional: true` ajoute pour tolerer l''echec (RULE #5) plutot que de faire planter tout le build a
        cause d''un mecanisme metadata annexe (REFSYSTEM/SIGN BASKET), sans rapport avec la validation
        d''attributs de classe metier visee par le validateur XTF en cours. MetaBasketDef reste donc
        construit SANS TopicRef (Kind/Name/Final/extends corrects). A revisiter si un besoin reel de
        resoudre les baskets REFSYSTEM/SIGN se presente.

        '
    objects_of_clauses:
      source:
        field: Name|Name
        multi: true
      optional: true
      note: 'CONFIRME (Lot 16, sous-groupe metaDataBasketDef) - ancienne piste AllowedInBasket ABANDONNEE
        (fausse piste : AllowedInBasket {OfDataUnit:DataUnit <-> ClassInBasket:Class} concerne les classes
        autorisees dans un basket de TRANSFERT ordinaire, sujet distinct du present OBJECTS OF). RULE
        #4, EBNF exact (§3.10.1) : "{''OBJECTS'' ''OF'' Class-Name '':'' MetaObject-Name {'','' MetaObject-Name}}
        '';''." Chaine de construction CONFIRMEE via 2 associations distinctes (ilismeta16-associations.yml)
        : pour chaque MetaObject-Name enumere sous un Class-Name donne, crée une instance IlisMeta16.ModelData.MetaObjectDef
        (Name = MetaObject-Name, IsRefSystem = (Kind du MetaBasketDef == RefSystemB)) liee (a) a ce MetaBasketDef
        via MetaBasketMembers (MetaBasketDef {0..1} <-> Member {0..*} MetaObjectDef, composite) et (b)
        a la Class resolue via Class-Name via MetaObjectClass (MetaObjectDef {0..*} <-> Class {1..1} Class).
        Boucle externe (un Class-Name par occurrence de la clause OBJECTS OF, plusieurs MetaObject-Name
        possibles par occurrence) a iterer cote ModelBuilder.

        NON IMPLEMENTE cote moteur (Lot 28, meme decouverte que topicRef ci-dessus) : `field: Name|Name,
        multi: true` renvoie une liste plate de tous les tokens Name (Class-Name ET MetaObject-Name
        confondus, aucun regroupement par occurrence) - la boucle de construction MetaObjectDef/
        MetaBasketMembers/MetaObjectClass decrite ci-dessus necessiterait un decoupage positionnel des
        enfants de la regle (meme famille que `domainDef._build_multi_declaration`, Lot 22 point 3),
