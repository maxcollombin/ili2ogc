  note: 'Confirmed via grammar (setConstraint(), source ~10544-10651), 2 structurally distinct alternatives
    inside one method (RULE #3): SET CONSTRAINT (LPAR (LOCAL|BASKET) RPAR)? alt A: Name COLON WHERE expression(0)
    COLON expression(1) alt B: (WHERE expression(0) COLON)? (Name COLON | INTERLIS COLON)? expression(last)
