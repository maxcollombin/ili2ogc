uniqueEl:
  grammar:
    rule: uniqueEl
  kind: Container
  feeds_into: IlisMeta16.ModelData.PathOrInspFactor
  attribute_bindings:
    _dispatch:
      source:
        field: objectOrAttributePath
      note: 'PathOrInspFactor has PathEls (list of PathEl) and Inspection (INTERLIS.NAME); which of the
        two objectOrAttributePath feeds depends on ObjectOrAttributePathContext''s own structure - deferred
        to Lot 7 (Expressions), which covers objectOrAttributePath/attributePath/pathEl. Not resolved
