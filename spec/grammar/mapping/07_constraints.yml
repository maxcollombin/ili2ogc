uniquenessConstraint:
  grammar:
    rule: uniquenessConstraint
  kind: Instance
  target: IlisMeta16.ModelData.UniqueConstraint
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
        optional: true
    Where:
      source:
        field: expression
        optional: true
      note: 'CONFIRME (2e correction - decouverte annexe, grammaire .g4 corrigee - voir commentaire de
        construction ci-dessus). Feeds UniqueConstraint.Where (Expression, 0..1, confirme ilismeta16-classes.yml)
        depuis le "WHERE expression" ajoute - meme pattern que setConstraint.Where deja confirme.

        '
  note: 'CORRIGE (grammaire .g4 fixee, cf. issue localUniqueness) : Kind n''est PLUS porte par un qualificatif
    (LOCAL|BASKET) sur uniquenessConstraint elle-meme (ce qualificatif a ete retire du niveau englobant
    car il etait consomme AVANT la boucle (globalUniqueness|localUniqueness)+, rendant localUniqueness
    inatteignable pour la syntaxe naturelle a un seul UNIQUE - voir grammar-divergences.md). Kind=GlobalU
    par defaut (corps ne contenant que des globalUniqueness) ; Kind=LocalU/BasketU si le corps contient
    une clause localUniqueness portant elle-meme (LOCAL) ou (BASKET) (voir localUniqueness ci-dessous).
    || CORRIGE x3 (voir grammar-divergences.md pour l''historique complet des 3 corrections successives
    sur cette regle). Forme actuelle confirmee via grammar (uniquenessConstraint(), regenere) : UNIQUE
    (LPAR BASKET RPAR)? (Name COLON)? (WHERE expression COLON)? (globalUniqueness | localUniqueness)+
    SEMI (Lot 24 : un doublon accidentel de (Name COLON)? issu d''un copier-coller lors d''une correction
    anterieure a ete retire du .g4 - inoffensif pour ce binding, qui ne lisait deja que la 1ere occurrence
    via index:0, mais ne correspondait pas a l''EBNF confirmee ci-dessous ; parser regenere, non-regression
    confirmee sur le corpus complet et les 14 tests pytest). 1ere correction (Lot 14 point 6) : le qualificatif fusionne (LPAR (LOCAL|BASKET) RPAR)? a ete
    RETIRE de ce niveau (il etait consomme ICI, avant la boucle, empechant structurellement localUniqueness()
    de jamais voir son propre marqueur). 2e correction (decouverte lors d''un test de non-regression sur
    342 modeles de production reels, models.geo.admin.ch/ilimodels.xml) : cette regle n''avait AUCUNE
    clause WHERE - confirme par un ECHEC DE PARSING REEL sur V_D/OeREB/OeREBKRMkvs_V2_0.ili:204 ("UNIQUE
    WHERE NOT(DEFINED(SubCode)): Code;"). 3e correction (RULE #4, apres reception par l''utilisateur de
    la source de verite la PLUS A JOUR : eCH-0031 INTERLIS 2 - Manuel de reference, edition V2.1.0, approuve
    2024-04-24, qui PREVAUT sur l''edition 2006-04-13 utilisee jusqu''ici) : le texte exact §3.12 "Conditions
    de coherence" y est : "UniquenessConstraint = ''UNIQUE'' [''('' ''BASKET'' '')''] [Constraint-Name
    '':''] [''WHERE'' Logical-Expression '':''] (GlobalUniqueness | LocalUniqueness) '';''." et "LocalUniqueness
    = ''('' ''LOCAL'' '')'' StructureAttribute-Name {''->'' StructureAttribute-Name} '':'' Attribute-Name
    {'','' Attribute-Name}." - CETTE edition confirme que (BASKET) est un qualificatif du niveau uniquenessConstraint
    LUI-MEME (applicable que le corps soit Global OU Local), et que (LOCAL) est EXCLUSIF a la branche
    LocalUniqueness (jamais un choix partage avec BASKET). Ma 2e correction (celle du fix precedent, basee
    sur l''edition 2006 qui ne precisait pas ce detail) avait a tort rendu le qualificatif de localUniqueness
    "(LOCAL|BASKET)" au lieu de "(LOCAL)" seul, et n''avait pas reintroduit de (BASKET) au niveau uniquenessConstraint.
    Corrige : (LPAR BASKET RPAR)? reintroduit ICI (BASKET seul, pas LOCAL) ; localUniqueness() n''a plus
    que "(LPAR LOCAL RPAR)" (voir plus bas). Confirme via RULE #4 que le Reference Manual 2006 et le Metamodel
    2022-06-17 (composedUnit, numeric/refSys, topicDef, viewAttributes, signParamAssignment - tous les
    autres points deja cites dans cette investigation) restent IDENTIQUES dans l''edition 2024 : aucune
    autre correction necessaire ailleurs. Revalide sur l''exemple reel (0 erreur), le corpus complet (339/342,
    memes 3 echecs preexistants sans rapport) et tous les tests empiriques synthetiques anterieurs (functionDef,
    numeric/refSys, localUniqueness) - aucune regression.'
