  note: 'Conditionally produces IlisMeta16.ModelData.CompoundExpr with Operation=Or when OR is present;
    PLUS/MINUS need confirmation against kind-values.yml (not currently listed as CompoundExpr operations
    - may indicate arithmetic handled differently). || Confirmed via grammar (term0(), source ~10864-10890):
    term1 ((OR|PLUS|MINUS) term1)*'
