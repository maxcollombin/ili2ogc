classDef:
  grammar:
    rule: classDef
  kind: Instance
  target: IlisMeta16.ModelData.Class
  discriminant:
    attribute: Kind
    value: Class
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: Name(1) after END is the closing name, must match Name(0) - validation only, not a separate
        attribute binding
    Abstract:
      source:
        field: ABSTRACT
        presence: true
      note: resolved from the optional (ABSTRACT|EXTENDED|FINAL) token group inside LPAR...RPAR after
        the class name
    Final:
      source:
        field: FINAL
        presence: true
    Super:
      association: Inheritance
      role: Super
      source:
        field: classOrStructureRef
        optional: true
      note: 'AJOUTE (Lot 38, demande explicite utilisateur - "attributs herites via EXTENDS"). `(EXTENDS
        classOrStructureRef)?` sur classDef() n''avait AUCUN binding jusqu''ici (grep negatif confirme,
        03_classes_and_structures.yml) - la clause EXTENDS etait entierement ignoree, aucune instance
        `Inheritance` jamais construite pour une classe/structure. `classOrStructureRef` resout deja
        directement vers un `Class` (Dispatcher classRef|structureRef, tous deux `kind: Reference,
        resolves_to: Class`) - pas de bag a deballer (`path:`), contrairement a `referenceAttr.BaseClass`/
        `roleDef.BaseClass` (source restrictedClassOrAssRef, elle bien un bag). Association `Inheritance`
        confirmee (ilismeta16-associations.yml : `Sub {0..*} <-> Super {0..1}`, `ExtendableME`) - Class
        EXTENDS ExtendableME (confirme ilismeta16-classes.yml). RULE #5, perimetre delibere : alimente
        UNIQUEMENT le lien Super lui-meme, ne remonte PAS automatiquement les attributs herites - voir
        `xtf/schema.py:attributes_of` pour la resolution transitive cote validateur XTF (Lot 38).'
classOrStructureDef:
  grammar:
    rule: classOrStructureDef
  kind: Container
  children:
  - attributeDef
  - constraintDef
  - parameterDef
  note: 'CORRIGE (audit pendant le smoke test ModelBuilder, 2026-08-02) : `kind:
    Dispatcher, dispatches_to: [classDef, structureDef]` etait faux - jamais
    verifie contre le code ANTLR reel (RULE #2), vraisemblablement confondu
    avec la regle voisine `classOrStructureRef` (elle, un vrai dispatcher
    classRef/structureRef). Verifie maintenant
    (InterlisParser.py:2597-2676, ClassDefContext.classOrStructureDef()) :
    `classOrStructureDef` est le CORPS partage de classDef/structureDef
    (accesseurs reels confirmes dans generated/ast-accessors.yml : ATTRIBUTE,
    PARAMETER, attributeDef, constraintDef - aucun accesseur classDef/
    structureDef). Pure dispatcher/aggregateur, pas de classe propre - une
    boucle repetee de 3 alternatives : "(ATTRIBUTE)? attributeDef+",
    "constraintDef+", "(PARAMETER)? parameterDef+". Chaque attributeDef/
    constraintDef/parameterDef alimente sa propre association confirmee
    (ClassAttr/ClassConstraint/ClassParam) sur le classDef/structureDef
    englobant via SON PROPRE `parent:`, pas via classOrStructureDef
    lui-meme - d''ou kind: Container + children (visite multiple, comme
    definitions), pas Dispatcher (alternative unique).'
classOrStructureRef:
  grammar:
    rule: classOrStructureRef
  kind: Dispatcher
  dispatches_to:
  - classRef
  - structureRef
  attribute_bindings:
    _dispatch:
      source:
        field: classRef|structureRef
        kind: alt_rule
      note: 'Pure dispatcher (2 alternatives): classRef() or structureRef(). Confirmed via grammar-metamodel-mapping.yml:
        "kind: Dispatcher, dispatches_to: [classRef, structureRef]". No own construction; result is whichever
        of the two sub-rules'' resolved reference matched.

        '
  note: 04_attributes Attribute definitions
classRef:
  grammar:
    rule: classRef
  kind: Reference
  target: IlisMeta16.ModelData.ClassRef
  resolves_to: Class
  attribute_bindings:
    Ref:
      source:
        field: INTERLIS
        DOT: null
        SIGN|Name: null
        join: .
      note: 'classRef() has 3 alternatives: "INTERLIS.REFSYSTEM" (a fixed predefined reference), "INTERLIS."
        + (SIGN|Name)(.(SIGN|Name))* (a qualified predefined INTERLIS-namespace class path), or a bare
        (SIGN|Name)(.(SIGN|Name))* path (a user-model-qualified class path, e.g. "MyTopic.MyClass"). SIGN
        is accepted alongside Name at each segment (the grammar allows the reserved word SIGN as a literal
        identifier here, same pattern as BASKET/LOCAL in enumElement). ClassRef is a DataType with a single
        own attribute Ref: INTERLIS.NAME (confirmed in ilismeta16-datatypes.yml), so all matched segments
        (plus the literal "INTERLIS" prefix and REFSYSTEM keyword where applicable) are joined with "."
        into this single Ref string.

        '
structureDef:
  grammar:
    rule: structureDef
  kind: Instance
  target: IlisMeta16.ModelData.Class
  discriminant:
    attribute: Kind
    value: Structure
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: inherited Name (MetaElement); same pattern as classDef above.
    Abstract:
      source:
        field: ABSTRACT
        presence: true
      note: 'resolved from the optional (ABSTRACT|GENERIC|FINAL) token group inside LPAR...RPAR - same
        shared modifier-token-set pattern as classDef (Lot: reused).'
    Final:
      source:
        field: FINAL
        presence: true
    Super:
      association: Inheritance
      role: Super
      source:
        field: structureRef
        optional: true
      note: 'AJOUTE (Lot 38) - meme raisonnement/verification que classDef.Super ci-dessus. `(EXTENDS
        structureRef)?` sur structureDef() n''avait aucun binding jusqu''ici ; `structureRef` resout deja
        directement vers un `Class[Kind=Structure]` (kind: Reference), pas de bag a deballer.'
structureRef:
  grammar:
    rule: structureRef
  kind: Reference
  resolves_to: Class
  resolves_to_constraint:
    Kind: Structure
  attribute_bindings:
    resolved_name:
      source:
        field: INTERLIS
        DOT: null
        BOOLEAN|URI|UUIDOID|Name: null
        join: .
      note: 'structureRef() has 2 alternatives: "INTERLIS." + (BOOLEAN|URI|UUIDOID|Name)(.Name)* (a predefined
        INTERLIS-namespace structure path, where BOOLEAN/URI/UUIDOID are accepted as literal first-segment
        identifiers alongside Name), or a bare Name(.Name)* path. Per grammar-metamodel-mapping.yml, structureRef''s
        semantics are "kind: Reference, reference.target.class: Class, constraint: Kind=Structure" - unlike
        classRef, it does NOT construct an IlisMeta16.ModelData.ClassRef DataType wrapper (no metamodel.target
        block for this rule); the joined qualified name resolves directly to an existing IlisMeta16.ModelData.Class
        instance with Kind=Structure, looked up by name rather than newly constructed.

        '
