classDef:
  grammar:
    rule: classDef
  kind: Instance
  target: IlisMeta16.ModelData.Class
  discriminant:
    attribute: Kind
    value: Class
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: Name(1) after END is the closing name, must match Name(0) - validation only, not a separate
        attribute binding
    Abstract:
      source:
        field: ABSTRACT
        presence: true
      note: resolved from the optional (ABSTRACT|EXTENDED|FINAL) token group inside LPAR...RPAR after
        the class name
    Final:
      source:
        field: FINAL
        presence: true
    Super:
      association: Inheritance
      role: Super
      source:
        field: classOrStructureRef
        optional: true
      note: '`(EXTENDS classOrStructureRef)?` on classDef() had NO binding at all until now - the EXTENDS
        clause was entirely ignored, no `Inheritance` instance ever built for a class/structure.
        `classOrStructureRef` already resolves
        directly to a `Class` (Dispatcher classRef|structureRef, both `kind: Reference,
        resolves_to: Class`) - no bag to unwrap (`path:`), unlike `referenceAttr.BaseClass`/
        `roleDef.BaseClass` (source restrictedClassOrAssRef, which is a bag). Association `Inheritance`
        (ilismeta16-associations.yml: `Sub {0..*} <-> Super {0..1}`, `ExtendableME`) - Class
        EXTENDS ExtendableME (ilismeta16-classes.yml). Deliberate scope: feeds ONLY
        the Super link itself, does not automatically roll up inherited attributes - see
        `xtf/schema.py:attributes_of` for the transitive resolution on the XTF validator side.'
classOrStructureDef:
  grammar:
    rule: classOrStructureDef
  kind: Container
  children:
  - attributeDef
  - constraintDef
  - parameterDef
  note: '`kind: Dispatcher, dispatches_to: [classDef, structureDef]` was wrong -
    never checked against the real ANTLR code, likely confused
    with the neighboring rule `classOrStructureRef` (which is a real dispatcher
    over classRef/structureRef). Per the real parser code
    (InterlisParser.py, ClassDefContext.classOrStructureDef()):
    `classOrStructureDef` is the SHARED BODY of classDef/structureDef
    (real accessors: ATTRIBUTE,
    PARAMETER, attributeDef, constraintDef - no classDef/
    structureDef accessor). A pure dispatcher/aggregator, no own class - a
    repeated loop of 3 alternatives: "(ATTRIBUTE)? attributeDef+",
    "constraintDef+", "(PARAMETER)? parameterDef+". Each attributeDef/
    constraintDef/parameterDef feeds its own association
    (ClassAttr/ClassConstraint/ClassParam) on the enclosing classDef/structureDef
    via ITS OWN `parent:`, not via classOrStructureDef
    itself - hence kind: Container + children (visited multiple times, like
    definitions), not Dispatcher (single alternative).'
classOrStructureRef:
  grammar:
    rule: classOrStructureRef
  kind: Dispatcher
  dispatches_to:
  - classRef
  - structureRef
  attribute_bindings:
    _dispatch:
      source:
        field: classRef|structureRef
        kind: alt_rule
      note: 'Pure dispatcher (2 alternatives): classRef() or structureRef().
        `kind: Dispatcher, dispatches_to: [classRef, structureRef]`. No own construction; result is whichever
        of the two sub-rules'' resolved reference matched.

        '
  note: 04_attributes Attribute definitions
classRef:
  grammar:
    rule: classRef
  kind: Reference
  target: IlisMeta16.ModelData.ClassRef
  resolves_to: Class
  attribute_bindings:
    Ref:
      source:
        field: INTERLIS
        DOT: null
        SIGN|Name: null
        join: .
      note: 'classRef() has 3 alternatives: "INTERLIS.REFSYSTEM" (a fixed predefined reference), "INTERLIS."
        + (SIGN|Name)(.(SIGN|Name))* (a qualified predefined INTERLIS-namespace class path), or a bare
        (SIGN|Name)(.(SIGN|Name))* path (a user-model-qualified class path, e.g. "MyTopic.MyClass"). SIGN
        is accepted alongside Name at each segment (the grammar allows the reserved word SIGN as a literal
        identifier here, same pattern as BASKET/LOCAL in enumElement). ClassRef is a DataType with a single
        own attribute Ref: INTERLIS.NAME (confirmed in ilismeta16-datatypes.yml), so all matched segments
        (plus the literal "INTERLIS" prefix and REFSYSTEM keyword where applicable) are joined with "."
        into this single Ref string.

        '
structureDef:
  grammar:
    rule: structureDef
  kind: Instance
  target: IlisMeta16.ModelData.Class
  discriminant:
    attribute: Kind
    value: Structure
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: inherited Name (MetaElement); same pattern as classDef above.
    Abstract:
      source:
        field: ABSTRACT
        presence: true
      note: 'resolved from the optional (ABSTRACT|GENERIC|FINAL) token group inside LPAR...RPAR - same
        shared modifier-token-set pattern as classDef.'
    Final:
      source:
        field: FINAL
        presence: true
    Super:
      association: Inheritance
      role: Super
      source:
        field: structureRef
        optional: true
      note: 'Same reasoning/check as classDef.Super above. `(EXTENDS
        structureRef)?` on structureDef() had no binding at all until now; `structureRef` already resolves
        directly to a `Class[Kind=Structure]` (kind: Reference), no bag to unwrap.'
structureRef:
  grammar:
    rule: structureRef
  kind: Reference
  resolves_to: Class
  resolves_to_constraint:
    Kind: Structure
  attribute_bindings:
    resolved_name:
      source:
        field: INTERLIS
        DOT: null
        BOOLEAN|URI|UUIDOID|Name: null
        join: .
      note: 'structureRef() has 2 alternatives: "INTERLIS." + (BOOLEAN|URI|UUIDOID|Name)(.Name)* (a predefined
        INTERLIS-namespace structure path, where BOOLEAN/URI/UUIDOID are accepted as literal first-segment
        identifiers alongside Name), or a bare Name(.Name)* path. structureRef''s
        semantics are `kind: Reference, reference.target.class: Class, constraint: Kind=Structure` - unlike
        classRef, it does NOT construct an IlisMeta16.ModelData.ClassRef DataType wrapper (no metamodel.target
        block for this rule); the joined qualified name resolves directly to an existing IlisMeta16.ModelData.Class
        instance with Kind=Structure, looked up by name rather than newly constructed.

        '
