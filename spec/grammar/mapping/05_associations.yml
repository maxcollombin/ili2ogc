associationDef:
  grammar:
    rule: associationDef
  kind: Instance
  target: IlisMeta16.ModelData.Class
  discriminant:
    attribute: Kind
    value: Association
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
    Abstract:
      source:
        field: ABSTRACT
        presence: true
    Final:
      source:
        field: FINAL
        presence: true
associationRef:
  grammar:
    rule: associationRef
  kind: Reference
  target: IlisMeta16.ModelData.Class
  discriminant:
    attribute: Kind
    value: Association
  attribute_bindings:
    _resolution:
      note: 'Pure reference resolution: qualified name (Name (DOT Name)?)? Name resolves to an existing
        IlisMeta16.ModelData.Class with Kind=Association (same pattern as classRef/structureRef); no own
        attributes constructed.'
  note: Association roles and cardinalities
cardinality:
  grammar:
    rule: cardinality
  kind: ValueObject
  target: IlisMeta16.ModelData.Multiplicity
  attribute_bindings:
    Min:
      source:
        field: PosNumber
        index: 0
      rule:
        MUL_alone: 0
        PosNumber: literal_value
      note: confirmed Multiplicity.own.Min (MultRange, mandatory). '{*}' alone means {0..*} (Min=0); '{PosNumber}'
        or '{PosNumber..X}' - the first PosNumber is Min.
    Max:
      source:
        field: MUL|PosNumber
        index: 1
        optional: true
      rule:
        MUL_alone: '*'
        MUL_after_DOTDOT: '*'
        PosNumber_after_DOTDOT: literal_value
        absent: same_as_Min
      note: confirmed Multiplicity.own.Max (MultRange, 0..1). '{*}' -> Max='*' (unbounded); '{N..*}' ->
        Max='*'; '{N..M}' -> Max=M; '{N}' alone (no DOTDOT) -> Max defaults to same value as Min (exact
        cardinality), per grammar structure where DOTDOT+bound is optional.
  note: 06_types
roleDef:
  grammar:
    rule: roleDef
  kind: Instance
  target: IlisMeta16.ModelData.Role
  parent:
    association: AssocRole
    role: Role
  attribute_bindings:
    Name:
      source:
        field: Name
    Strongness:
      source:
        field: MINUS
        sequence_pattern: true
        optional: true
      rule:
        MINUS MINUS: Assoc
        MINUS LT GT: Aggr
        MINUS LT HASH GT: Comp
      note: 'Confirmed against INTERLIS 2 Reference Manual §2.7.2 "Force of relationship": -- = Association,
        -<> = Aggregation (marks the role leading to the whole), -<#> = Composition (marks the role leading
        to the whole). Each role''s own symbol directly encodes its Strongness value. optional:true because
        of Alternative 2 (see rule-level note below) - confirmed on a real .ili example
        (models/IlisMeta16.ili, NumsRefSys.Axis: AxisInd - a type restriction on the inherited Axis role,
        no --/-<>/-<#> symbol at all, no new Role semantically created even though the engine currently
        still builds one (STATUS: unresolved, see rule-level note).

        '
    Ordered:
      source:
        field: ORDERED
        presence: true
      note: part of the (modifiers) group in LPAR...RPAR before the strength symbol
    Multiplicity:
      source:
        field: cardinality
        optional: true
    BaseClass:
      association: BaseClass
      role: BaseClass
      source:
        field: restrictedClassOrAssRef
        path: BaseRef
        optional: true
      note: 'CORRIGE (audit CLI ModelBuilder, 2026-08-03) : aucun binding ne couvrait la reference de classe
        cible de restrictedClassOrAssRef() - documentee "not yet mapped" ci-dessous depuis l''origine.
        Role EXTENDS ReferenceType EXTENDS ClassRelatedType (confirme ilismeta16-classes.yml) : la meme
        association BaseClass (CRT{0..*} ClassRelatedType <-> BaseClass{0..*} Class, ilismeta16-associations.yml)
        deja utilisee pour toute autre ClassRelatedType s''applique ici. restrictedClassOrAssRef() retourne
        un bag {BaseRef: ForwardRef, AnyClass, Restrictions} - BaseRef est LE nom de base resolu. Couvre
        uniquement la 1ere occurrence (le cas usuel) ; la boucle ''(OR restrictedClassOrAssRef)*'' pour des
        restrictions multiples reste hors perimetre de cette correction.'
    EmbeddedTransfer:
      source:
        field: EXTERNAL
        presence: false
      note: 'STATUS toujours unconfirmed (RULE #5) - reinvestigue au Lot 43 (geometrie/roles embarques),
        conclusion : la justification precedente ("spec 2.6.3/2.7.5") etait probablement une erreur de
        categorie, PAS confirmee comme correcte pour autant.

        Investigation RULE #4 (Lot 43) : le manuel eCH-0031 V2.1.0 decrit DEUX concepts distincts qui
        partagent un vocabulaire proche ("Beziehungszugang"/acces vs "eingebettete Beziehung"/embarquement) -
        a ne pas confondre :
        (1) §3.7.5 "Beziehungszugaenge" (AssociationAccess) : capacite de NAVIGUER par expression de chemin
        (`obj.RoleName`, §3.13) depuis un objet vers les instances de relation - lie au meme Topic ET a la
        clause EXTERNAL ("... muss dies bei der Rolle speziell angemerkt werden (EXTERNAL...). Die Klasse
        erhaelt dann keine Beziehungszugaenge.", citation directe) - CONFIRME comme un construit metamodele
        SEPARE (`ExplicitAssocAccess`, association `AssocAcc` roles `AssocAccOrigin`/`AssocAccTarget`,
        visible sur le diagramme "Abbildung 3: Uebersicht Hauptkonstrukte" du PDF metamodele ili24-metamodel_2022-06-17,
        totalement distinct de `Role.EmbeddedTransfer`).
        (2) §4.3.9 "Codierung von Beziehungen" (XTF embedding, deja implemente Lot 32 via
        `schema.embedded_roles_of`) : algorithme confirme base UNIQUEMENT sur le nombre de roles (2),
        la cardinalite max de chaque role, la presence d''un OID, et le Topic de la classe cible vs celui
        de l''association ("Beziehungen werden immer eingebettet, ausser wenn... mehr als zwei Rollen...
        beide Rollen max Kardinalitaet > 1... eine OID gefordert... bei gewissen themenuebergreifenden
        Beziehungen" - citation directe, RIEN sur EXTERNAL dans cette liste d''exceptions).

        Conclusion : `EmbeddedTransfer` (nom laissant supposer un lien avec (2)) ne peut PAS etre derive de
        la seule clause EXTERNAL PROPRE a ce role (qui relève de (1), un mecanisme different) sans preuve
        empirique - aucune trouvee (ni prose explicative dans le PDF metamodele autour de la declaration
        `EmbeddedTransfer: MANDATORY BOOLEAN;`, ni commentaire dans `models/IlisMeta16.ili`).

        REEXAMINE au Lot 45 (suite), une fois le gap grammatical CHBase corrige (le blocage ci-dessus est
        leve) : `CHBase_Part4_ADMINISTRATIVEUNITS_V1.ili` construit desormais, l''exemple reel cite ci-dessus
        (`ASSOCIATION Hierarchy = UpperLevelUnit (EXTERNAL) -<> {0..1} AdministrativeUnit; LowerLevelUnit --
        AdministrativeUnit; END Hierarchy;`) verifie EMPIRIQUEMENT sur l''instance `Role` reellement
        construite : `UpperLevelUnit.EmbeddedTransfer == ''EXTERNAL''` (le texte brut du token, PAS un vrai
        booleen - `presence: false` ci-dessus n''a en realite JAMAIS d''effet, `bool(source.get("presence"))`
        etant faux, le calcul retombe sur le "cas standard" field+index qui renvoie le texte du token via
        `_resolve_node` sur une LISTE a 1 element), `LowerLevelUnit.EmbeddedTransfer == None` (role sans
        EXTERNAL). Donc CE BINDING PRECIS calcule structurellement, de maniere confirmee et reproductible,
        "le texte du token EXTERNAL si ce role le porte, None sinon" - `bool(...)` en extrait exactement le
        meme signal binaire que `ReferenceType.External` (Lot 34), et c''est suffisant pour l''usage vise
        (`schema.reference_external_status`, distinguer REF externe legitime de REF potentiellement cassee)
        SANS avoir besoin d''elucider la correspondance exacte de ce champ avec le concept (2) du manuel -
        la VALEUR est fiable, seul le NOM metamodele "EmbeddedTransfer" (et sa correspondance a (1) vs (2))
        reste formellement non elucide. Verifie AUSSI (RULE #4) que `embedded_roles_of` (Lot 32, algorithme
        (2)) predit correctement `UpperLevelUnit` comme embarque sur `AdministrativeUnit` MALGRE le EXTERNAL
        - confirme que (1) et (2) sont bien independants comme conclu ci-dessus (EXTERNAL ne change PAS la
        decision d''embarquement XTF, seulement la legitimite d''une cible cross-panier). Desormais reutilise
        par `xtf/validate.py`/`schema.reference_external_status` (role d''association embarque) - voir sa
        note.

        '
  note: 'Strongness resolved dynamically: LT/GT -> Assoc, HASH -> Comp, default -> Aggr (needs confirmation
    against kind-values.yml) || Grammar covers two distinct alternatives sharing this rule name: --- Alternative
    1 (spec-documented, §2.7.1 EBNF): full role declaration --- Name (modifiers)? (--|-<>|-<#>) cardinality?
    restrictedClassOrAssRef (OR restrictedClassOrAssRef)* (ASSIGN STRING)? SEMI ASSIGN STRING at the end:
    spec EBNF shows '':='' Role-Factor (an Expression), but the ANTLR grammar (2.4 dialect) only matches
    a literal STRING here, not a full factor. Purpose/target attribute unclear - not yet mapped. --- Alternative
    2 (ili2c 2.4 dialect extension, not in the 2006 manual EBNF) --- Name COLON MANDATORY? (attrTypeDef
    | enumeration | numeric | constraintDef) SEMI Does NOT create a new Role instance. Restricts/redefines
    the type of an already-declared (inherited) role by name - likely feeds TypeRestriction on the existing
    Role, MANDATORY affecting DomainType.Mandatory. STATUS: unresolved, needs a real .ili example.'
