argumentDef:
  grammar:
    rule: argumentDef
  kind: Instance
  target: IlisMeta16.ModelData.Argument
  parent:
    association: FormalArgument
    role: Argument
  attribute_bindings:
    Name:
      source:
        field: Name
      note: Inherited attribute Argument.Name (mandatory, ilismeta16-classes.yml).
  note: 'Kind is resolved by the argumentType dispatcher. Grammar: Name COLON
    argumentType.'
argumentType:
  grammar:
    rule: argumentType
  kind: Dispatcher
  dispatches_to:
  - type
  - attrType
  attribute_bindings:
    Kind:
      source:
        field: attrTypeDef|OBJECT|OBJECTS|ENUMVAL|ENUMTREEVAL
        kind: alt_rule_or_token
        optional: true
      mapping:
        attrTypeDef_present: Type
        OBJECT_present: Type
        OBJECTS_present: Type
        ENUMVAL: EnumVal
        ENUMTREEVAL: EnumTreeVal
      note: 'Alt2 ("(OBJECT|OBJECTS) OF ...") also dispatches Kind=Type, same
        as alt1 - both dispatch Type, distinguished only by the concrete Type
        subtype (see _type_ref below and _object_of_variant). Argument.Kind
        stays exactly Type/EnumVal/EnumTreeVal (ilismeta16-kind-values.yml,
        mandatory: true).'
    _type_ref:
      source:
        field: attrTypeDef|restrictedClassOrAssRef|viewRef
        optional: true
      note: 'For a `field:` already in pipe form, the alt_token/"|" mechanism
        tries each name and keeps whichever is present, independently of any
        `alt:` (see source_resolver.py). When Kind=Type, feeds the
        ArgumentType association (Type end, target IlisMeta16.ModelData.Type):
        for alt1 (attrTypeDef) the concrete subtype follows attrTypeDef''s own
        mechanism; for alt2 (OBJECT|OBJECTS OF ...) it''s
        IlisMeta16.ModelData.ObjectType (see _object_of_variant).'
  note: 'Grammar (argumentType(), 4 alternatives): alt1 attrTypeDef, alt2
    (OBJECT|OBJECTS) OF (restrictedClassOrAssRef|viewRef), alt3 ENUMVAL, alt4
    ENUMTREEVAL.'
composedUnit:
  grammar:
    rule: composedUnit
  kind: Container
  attribute_bindings:
    Operands:
      source:
        field: unitRef
        multi: true
      note: The unitRef-typed operands (first plus each subsequent one after
        MUL/DIV/POW) resolve to Unit references and feed the enclosing Unit's
        Definition (Expression). The metamodel doesn't further specify the
        composed-unit expression shape, so ModelBuilder must build an
        appropriate Expression/CompoundExpr-like structure from these
        operands and the MUL/DIV/POW operators.
  note: 'No direct IlisMeta16 instance expected: sets Kind=ComposedU on the
    enclosing Unit (created by unitDef) and feeds a NumUnit association for
    each combined unitRef. Grammar (.g4 line 354): LPAR (unitRef|Name|INTERLIS
    DOT Name) ((MUL|DIV|POW) (unitRef|INTERLIS DOT Name|Name))* RPAR. No
    dedicated "ComposedUnit" class/datatype exists in the metamodel - only
    Unit.Kind=ComposedU marks a Unit as composed (ilismeta16-kind-values.yml).'
derivedUnit:
  grammar:
    rule: derivedUnit
  kind: Container
  attribute_bindings:
    _status:
      status: not_applicable
      note: 'derivedUnit is never called from anywhere else in the compiled
        parser (only from its own method definition) - an orphaned,
        unreachable grammar rule. ModelBuilder does not need to handle
        DerivedUnitContext for a normal .ili parse. Background:
        docs/dev-notes/unit-function-def-investigation.md.'
  note: 'No direct IlisMeta16 instance expected. Would set Kind=DerivedU on
    the enclosing Unit (created by unitDef); decConst/unitRef would feed the
    Unit''s Definition (Expression). Grammar (.g4 line 352): decConst
    ((MUL|DIV|POW) decConst)* LSBR unitRef RSBR. Unreachable in practice (see
    _status above), and in any case already covered via unitDef''s own
    bracket-unitRef branches.'
functionDef:
  grammar:
    rule: functionDef
  kind: Instance
  target: IlisMeta16.ModelData.FunctionDef
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: Inherited attribute FunctionDef.Name (mandatory, ilismeta16-classes.yml).
  note: 'Grammar (functionDef()): FUNCTION Name LPAR argumentDef (SEMI
    argumentDef)* RPAR COLON (BOOLEAN | attrTypeDef | Name) SEMI. Renamed
    from functionDecl (upstream issue #2, geostandards-ch/interlis-antlr4) -
    this rule builds the real FunctionDef of the INTERLIS 2 spec; the
    unrelated unit-adjacent rule below was renamed to functionallyDerivedUnit
    to free up this name.'
functionallyDerivedUnit:
  grammar:
    rule: functionallyDerivedUnit
  kind: Container
  attribute_bindings:
    _status:
      status: not_applicable
      note: 'Design decision: (a) an adjacent [functionallyDerivedUnit-alt1
        (header), functionallyDerivedUnit-alt2-bare-SEMI] pair is merged and
        treated as a unitDef with Kind=BaseU (Name/ShortName/EXTENDS ->
        Inheritance, same bindings as unitDef); (b) a complete
        functionallyDerivedUnit-alt2 (EQ FUNCTION Explanation LSBR unitRef
        RSBR) encountered without an immediately preceding alt1 has no Name
        and cannot build a Unit instance, so it raises an explicit error
        rather than guessing a name. This rule, formerly named functionDef
        in this project (a name reused - confusingly - by the real FunctionDef
        rule below, before upstream issue #2''s rename), is distinct from
        the real FunctionDef of the INTERLIS 2 spec. Background:
        docs/dev-notes/unit-function-def-investigation.md.'
  note: 'No direct IlisMeta16 instance expected. Despite the grammar keyword
    FUNCTION appearing in its 2nd alternative, this rule does NOT create the
    FunctionDef instance (that''s functionDef above) - it''s an optional
    trailing clause on a function/unit name specifying its result unit
    ([unitRef], EXTENDS unitRef) and Explanation text, feeding
    attributes/associations of the enclosing construct - matching ili2c''s
    own FunctionallyDerivedUnit concept (interlis24.g, derivedUnit rule),
    which this project''s rule name now mirrors. Grammar (.g4 lines
    509-515): functionallyDerivedUnit : UNIT? Name (LSBR Name RSBR)? (EXTENDS
    unitRef)? | (EQ FUNCTION Explanation LSBR unitRef RSBR)? SEMI. Full
    background on the 3 real call sites and how alt2 (EQ FUNCTION Explanation
    LSBR unitRef RSBR) maps onto IlisMeta16.ModelData.UnitFunction:
    docs/dev-notes/unit-function-def-investigation.md.'
parameterDef:
  grammar:
    rule: parameterDef
  kind: Instance
  target: IlisMeta16.ModelData.AttrOrParam
  parent:
    association: ClassParam
    role: ClassParameter
  attribute_bindings:
    Name:
      source:
        field: Name
      note: Inherited attribute AttrOrParam.Name (mandatory, ilismeta16-classes.yml).
    Abstract:
      source:
        field: ABSTRACT
        presence: true
      note: Inherited attribute AttrOrParam.Abstract (from ExtendableME),
        resolved from the optional (ABSTRACT|EXTENDED|FINAL) group - same
        pattern as classDef's own Abstract/Final handling.
    Final:
      source:
        field: FINAL
        presence: true
      note: Same optional-group pattern as Abstract above. EXTENDED has no
        AttrOrParam/ExtendableME attribute distinct from Abstract/Final (see
        classDef note - Generic is a separate ExtendableME attribute not tied
        to any token here).
  note: 'Grammar (parameterDef()): PARAMETER Name (LPAR (ABSTRACT|EXTENDED|FINAL)
    RPAR)? COLON (attrTypeDef | METAOBJECT (OF metaObjectRef)?) SEMI. The
    METAOBJECT(...) branch may instead reference MetaObjectDef - unconfirmed
    against a real .ili example using PARAMETER METAOBJECT.'
runTimeParameterDef:
  grammar:
    rule: runTimeParameterDef
  kind: Instance
  target: IlisMeta16.ModelData.AttrOrParam
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
    Abstract:
      source:
        field: ABSTRACT
        presence: true
      note: Same optional single-token modifier pattern as parameterDef, but
        without surrounding LPAR/RPAR here (bare (ABSTRACT|EXTENDED|FINAL)?
        directly after Name, per grammar).
    Final:
      source:
        field: FINAL
        presence: true
  note: 'Grammar (runTimeParameterDef()): PARAMETER Name (ABSTRACT|EXTENDED|FINAL)?
    COLON attrTypeDef SEMI.'
unitDef:
  grammar:
    rule: unitDef
  kind: Instance
  target: IlisMeta16.ModelData.Unit
  discriminant:
    attribute: Kind
    dynamic: true
    rule:
      unitRef: BaseU
      derivedUnit: DerivedU
      composedUnit: ComposedU
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: Inherited attribute Unit.Name (mandatory, ilismeta16-classes.yml).
    Abstract:
      source:
        field: ABSTRACT
        presence: true
      note: Inherited attribute (ExtendableME.Abstract), resolved from the
        optional (LPAR ABSTRACT RPAR) group.
    Definition:
      source:
        field: expression
        optional: true
      note: 'Attribute Unit.Definition: IlisMeta16.ModelData.Expression (0..1,
        ilismeta16-classes.yml); populated only for the first unitDef
        alternative (bare expression, with or without a bracketed unitRef).'
  note: 'Kind resolved dynamically: plain unitRef -> BaseU, derivedUnit ->
    DerivedU, composedUnit -> ComposedU. Grammar (.g4 lines 339-349): UNIT?
    Name (LSBR Name RSBR)? (LPAR ABSTRACT RPAR)? (EXTENDS unitRef)? EQ
    ( expression (LSBR unitRef RSBR)? | composedUnit | functionallyDerivedUnit
    | LSBR unitRef RSBR )? SEMI.'
unitRef:
  grammar:
    rule: unitRef
  kind: Reference
  target: IlisMeta16.ModelData.UnitRef
  attribute_bindings:
    Unit:
      source:
        field: INTERLIS+DOT+Name|Name+DOT+Name
        join: .
      note: 'Attribute Unit: INTERLIS.NAME (0..1) on IlisMeta16.ModelData.UnitRef
        (ilismeta16-datatypes.yml); populated by joining all Name tokens (and
        the literal INTERLIS qualifier when alt2 matches) with "." separators,
        mirroring the same join pattern used for classRef/structureRef/domainRef.'
  note: 'Grammar (unitRef(), 2 alternatives): alt1 Name (DOT Name)*, alt2
    INTERLIS DOT Name.'
