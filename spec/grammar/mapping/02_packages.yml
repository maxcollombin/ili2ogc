definitions:
  grammar:
    rule: definitions
  kind: Container
  children:
  - classDef
  - structureDef
  - associationDef
  - domainDef
  - functionDef
  - functionallyDerivedUnit
  - unitDef
  - metaDataBasketDef
  - contextDef
  - constraintsDef
  - viewDef
  - graphicDef
  attribute_bindings:
    _dispatch:
      note: 'Pure dispatcher, no own class (12 mutually exclusive alternatives, each delegating to its
        own already-bound or later-bound rule: metaDataBasketDef/unitDef/functionallyDerivedUnit/
        functionDef/domainDef/contextDef/classDef/structureDef/associationDef/constraintsDef/viewDef/
        graphicDef).'
  note: 'The 12 exact accessors (via inspect.signature on DefinitionsContext) are
    associationDef/classDef/constraintsDef/contextDef/domainDef/functionDef/functionallyDerivedUnit/
    graphicDef/metaDataBasketDef/structureDef/unitDef/viewDef. topicDef has no place here: a TOPIC is
    defined at the modeldef level (definitions is the content OF a topic, not topicDef itself).
    functionDef/functionallyDerivedUnit are the renamed functionDecl/functionDef rules (upstream issue
    #2, geostandards-ch/interlis-antlr4) - see the functionDef binding in 08_functions_units.yml for the
    full rename rationale.'
genericRef:
  grammar:
    rule: genericRef
  kind: Container
  attribute_bindings:
    _resolution:
      source:
        field: domainRef
        index: 0
      note: No own class; pure single-child wrapper around domainRef() (same pattern as expression/uniqueEl).
        Resolves the generic domain type; the topicDef DEFERRED GENERICS clause using this feeds GenericDef.GenericDomain
        (unresolved cross-reference, see topicDef.deferred_generics note above).
  note: '`reference.target: [Context, GenericDef]` was checked against the real ANTLR code
    (src/interlis/antlr/InterlisParser.py:2580-2594): genericRef is an unconditional single-child
    wrapper, `domainRef()` alone, no branching - consistent with what''s already documented on the
    python-bindings side: "No own class; pure single-child wrapper around domainRef() (same pattern
    as expression/uniqueEl)."'
modeldef:
  grammar:
    rule: modeldef
  kind: Instance
  target: IlisMeta16.ModelData.Model
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: inherited Name (MetaElement)
    Contracted:
      source:
        field: CONTRACTED
        presence: true
      note: confirmed Model.own.Contracted (BOOLEAN, 0..1) - optional leading CONTRACTED token.
    Kind:
      source:
        field: TYPE|REFSYSTEM|SYMBOLOGY
        kind: alt_token
      rule:
        TYPE: TypeM
        REFSYSTEM: RefSystemM
        SYMBOLOGY: SymbologyM
        absent: NormalM
      note: 'confirmed Model.Kind enum (Model.Kind: NormalM/TypeM/RefSystemM/SymbologyM, kind-values.yml);
        one of the optional lead-in modifier tokens before MODEL dispatches the value, absent -> NormalM
        default.'
    iliVersion:
      source:
        field: null
      note: propagated from the enclosing interlis2def's Dec token (see interlis2def binding above) -
        not a field of ModeldefContext itself.
    At:
      source:
        field: STRING
        index: 0
        optional: true
      note: confirmed Model.own.At (TEXT, 0..1) - the STRING after the optional 'AT' token.
    Version:
      source:
        field: STRING
        index: 1
        optional: true
      note: confirmed Model.own.Version (TEXT, 0..1) - the STRING after VERSION keyword.
    Language:
      source:
        field: Name
        anchor: LPAR
        optional: true
      note: 'Reference Manual eCH-0031 V2.1.0/2024-04-24 (§3.5.1, exact EBNF) and the 2006-04-13 edition
        (identical on this point): "ModelDef = ... ''MODEL'' Model-Name [ ''('' Language-Name '')'' ] ...''
        - this is exactly the ''(LPAR Name RPAR)?'' that follows the model''s Name in ModeldefContext.
        Language-Name should follow ISO 639 (2 letters, e.g. ''en''/''fr''/''de''/''it''/''rm''),
        optionally followed by an ISO 3166 country code (''de_CH''). Merged with the former
        ''generic_alias'' entry (same grammar field).
        "index: 1" is wrong when no language clause is present - Name(1) then becomes the closing name
        "END Model-Name" (same rule as "Name(1) after END" on classDef), not the language. "anchor: LPAR"
        resolves both cases correctly: absent if LPAR is absent (no language clause), the Name
        immediately after LPAR otherwise - same mechanism as CharSetIANAName/xmlns below.

        '
    CharSetIANAName:
      source:
        field: STRING
        anchor: CHARSET
        optional: true
      note: 'The CHARSET token existed in InterlisLexer.g4 but was not referenced anywhere in the
        ''modeldef'' rule of InterlisParser.g4 - unreachable (parsing fails with "mismatched input
        ''CHARSET''"). Reference Manual eCH-0031 V2.1.0 (2024-04-24), exact EBNF: ''... ''='' [ ''CHARSET''
        IANA-Name-String '';'' ] [ ''XMLNS'' XMLNS-String '';'' ] { ''IMPORTS'' ... } ...'' - absent from
        the 2006 edition (a 2.4 extension). Fixed in vendor/interlis-antlr4/InterlisParser.g4: added
        ''(CHARSET STRING SEMI)?'' right after EQ (and after the existing CONTRACT ISSUED BY extension).
        ''anchor: CHARSET'' means: the STRING immediately adjacent to the CHARSET token in ctx.children,
        not a flat STRING(i) index (the flat position depends on which optional clauses actually precede
        it - AT/VERSION, TRANSLATION - see also xmlns below).

        '
    xmlns:
      source:
        field: STRING
        anchor: XMLNS
        optional: true
      note: 'Same bug and same fix as CharSetIANAName above: the XMLNS token is lexed (InterlisLexer.g4)
        but absent from the ''modeldef'' rule - unreachable. Fixed by adding ''(XMLNS STRING SEMI)?'' in
        InterlisParser.g4 right after the CHARSET clause (eCH-0031 V2.1.0 §3.5.1 EBNF order: CHARSET
        then XMLNS then IMPORTS*). ''anchor: XMLNS'': same convention as CharSetIANAName (the STRING
        adjacent to the XMLNS token, not a flat index).

        '
    NoIncrementalTransfer:
      source:
        field: NOINCREMENTALTRANSFER
        presence: true
      note: 'Same grammar-gap category as CHARSET/XMLNS: the NOINCREMENTALTRANSFER token is lexed
        (InterlisLexer.g4) but was absent from ''modeldef'' - unreachable. Reference Manual eCH-0031
        V2.1.0 (2024-04-24), exact EBNF: ''... MODEL Model-Name [ ''('' Language-Name '')'' ]
        [ ''NOINCREMENTALTRANSFER'' ] ''AT'' URI-String ...'' - placed after the optional
        ''(Language-Name)'' and before ''AT''. Per the manual, NOINCREMENTALTRANSFER indicates that no
        incremental transfer needs to be accepted for the data transfer - a 2.4 extension, absent from
        the 2006 edition. Fixed by adding ''NOINCREMENTALTRANSFER?'' in InterlisParser.g4 at the exact
        EBNF position. A simple presence accessor (no associated STRING, so no index ambiguity like
        CHARSET/XMLNS).

        '
    ili1Transfername:
      status: not_applicable
      note: 'not_applicable confirmed: Metamodel edition 2022-06-17 documents ili1Transfername/
        ili1Format as INTERLIS 1 compatibility metadata (legacy transfer format name, TID/blank/
        undefined/continue-code parameters, character set) - neither Reference Manual edition (2006 nor
        2024) documents an EBNF clause in ModelDef for these values; they are fed by a mechanism
        external to the .ili 2.x syntax (e.g. ili2c command-line options or a separate INTERLIS 1
        format description file), not by parsing the model itself. Not expressible in .ili syntax - a
        legitimate closure, not a mapping gap.

        '
    contract_issued_by:
      status: not_applicable
      note: 'Confirmed grammar divergence (not a bug): the ''(CONTRACT ISSUED BY Name SEMI)?'' clause
        present in InterlisParser.g4 exists in neither edition of the official ModelDef EBNF (2006-04-13
        nor eCH-0031 V2.1.0/2024-04-24); IlisMeta16.ModelData.Model has no own attribute for a
        "contract issuer" (own attributes confirmed by exhaustive grep: iliVersion/Contracted/Kind/
        Language/At/Version/NoIncrementalTransfer/CharSetIANAName/xmlns/ili1Transfername/ili1Format -
        nothing else). The 2024 manual also notes that the concept of contracts found no practical use
        and was abandoned - consistent with a residual grammar extension for a notion the standard
        itself dropped, similar to the POW (composedUnit) divergence. Grammar left unchanged (a
        harmless, already-optional extension). ModelBuilder ignores this clause if encountered (no
        metamodel target).

        '
    imports:
      for_each:
        field: Name|INTERLIS
        multi: true
        optional: true
        between: [IMPORTS, END]
      target: IlisMeta16.ModelData.Import
      ImportedP:
        association: Import
        role: ImportedP
        source:
          field: null
          context_key: __item__
          as_forward_ref: true
          always_external_ref: true
      ImportingP:
        association: Import
        role: ImportingP
        source:
          field: null
          context_key: modeldef
      note: '''(IMPORTS UNQUALIFIED? (Name|INTERLIS) (COMMA UNQUALIFIED? (Name|INTERLIS))* SEMI)*''
        feeds IlisMeta16.ModelData.Import (ImportingP {0..*} Package <-> ImportedP {0..*} Package,
        ilismeta16-associations.yml and metamodel.txt ''ASSOCIATION Import''): one Import instance per
        Name/INTERLIS referenced in the loop - ImportingP = this Model, ImportedP = the Package resolved
        by that name (or the INTERLIS pseudo-model itself if the INTERLIS token is used). The UNQUALIFIED
        modifier has no metamodel target of its own - the Import association has no own attribute
        (metamodel.txt: ''ASSOCIATION Import = ImportingP -- Package; ImportedP (EXTERNAL) -- Package;
        END Import;'' - nothing else); UNQUALIFIED is therefore an ili2c-internal name-resolution detail
        (whether an unqualified reference to the imported model''s elements is allowed), not persisted
        in the metamodel - status: not_applicable for that specific sub-point (see
        _imports_unqualified below); the Import construction itself is confirmed.

        Uses the engine''s `for_each` mechanism (a grammar loop -> N linked instances, not a single
        nested construction) - ImportedP becomes a ForwardRef (resolved to UnresolvedNamedReference in
        the single-file V1, since the imported model is never loaded - an accepted scope decision). No
        inverse Model->Import association exists on the metamodel side (Import is only referenced from
        its own ends): the built instances are kept under the raw "imports" key on the Model (not an
        official metamodel role), just to stay reachable from Python.

        '
    _imports_unqualified:
      status: not_applicable
      note: 'See the ''imports'' note above: the UNQUALIFIED modifier has no target in
        IlisMeta16.ModelData.Import (an association with no own attribute) - an ili2c-internal
        name-resolution detail, not persisted.'
topicDef:
  grammar:
    rule: topicDef
  kind: Instance
  target:
  - IlisMeta16.ModelData.SubModel
  - IlisMeta16.ModelData.DataUnit
  parent:
    association: PackageElements
    role: Element
    note: applies to BOTH instances (SubModel AND DataUnit) - Element targets MetaElement broadly
      (ilismeta16-associations.yml), DataUnit qualifies via ExtendableME.
  attribute_bindings:
    SubModel.Name:
      source:
        field: Name
        index: 0
      note: 'confirmed inherited Name (MetaElement via Package) - the TOPIC''s own name (e.g.
        ''MyTopic''). SubModel has no other own attribute (own: {}, confirmed in
        ilismeta16-classes.yml) - every other topicDef clause now feeds DataUnit (see below), not
        SubModel.'
    DataUnit.Name:
      source:
        field: null
        kind: constant
        value: BASKET
      note: 'Exact IDL citation from Metamodel 2022-06-17 §2.1.4: "the metaelement ''DataUnit''
        (Name: ''BASKET'', DataUnitName: Modelname.Topicname)" - Name is a literal constant "BASKET"
        for every DataUnit instance built from a topicDef, not a value taken from the grammar.

        '
    DataUnit.DataUnitName:
      note: 'Confirmed by the same citation as Name above ("DataUnitName: Modelname.Topicname") - a
        computed value, not a direct accessor on topicDef(): it needs the enclosing MODEL''s Name (not
        accessible from topicDef() itself). Not a metamodel-mapping ambiguity (both target and formula
        are confirmed) - purely a ModelBuilder plumbing detail (reaching the parent Model at
        construction time), already resolved structurally since topicDef() is always invoked within an
        enclosing modeldef() context.

        '
    DataUnit.ViewUnit:
      source:
        field: VIEW
        presence: true
      note: 'The optional leading VIEW token ("VIEW TOPIC Name...") maps to DataUnit.own.ViewUnit
        (BOOLEAN, mandatory, confirmed in ilismeta16-classes.yml) - direct name match, consistent with
        Reference Manual 2006-04-13 §2.15: "Views are only transferred if they have been defined in a
        VIEW TOPIC". True if VIEW is present, false otherwise.

        '
    DataUnit.Abstract:
      source:
        field: ABSTRACT
        presence: true
      note: DataUnit EXTENDS ExtendableME (confirmed in ilismeta16-classes.yml), which carries
        Abstract/Generic/Final - fed by the optional '(ABSTRACT|FINAL)' after the topic name. Not
        SubModel (which does not extend ExtendableME).
    DataUnit.Final:
      source:
        field: FINAL
        presence: true
      note: See DataUnit.Abstract above - same shared modifier slot.
    DataUnit.Super:
      association: Inheritance
      role: Super
      source:
        field: topicRef
        anchor: EXTENDS
        optional: true
      note: '''EXTENDS topicRef()'' - DataUnit extends ExtendableME, so the generic Inheritance
        association (Sub {0..*} ExtendableME <-> Super {0..1} ExtendableME, already confirmed for
        classDef/structureDef/viewDef/graphicDef/unitDef) applies here too: feeds Inheritance
        (Sub=this DataUnit, Super=the DataUnit of the resolved topicRef()).

        Getting there took 3 fixes: the binding key (needs explicit `association`/`role`, not just a
        renamed field), the accessor (`anchor: EXTENDS` instead of a flat index, so as not to confuse
        EXTENDS with DEPENDS ON targets), and the resolution mechanism itself (topicRef() resolves to a
        SubModel, but Super needs the DataUnit twin - see `ForwardRef.resolve_via_twin`). Full history:
        docs/dev-notes/topicdef-super-binding-investigation.md.'
    DataUnit.BasketOID:
      target: IlisMeta16.ModelData.BasketOID
      note: 'Reference Manual 2006-04-13 §2.5.2, exact EBNF: "[''BASKET'' ''OID'' ''AS'' OID-DomainRef
        '';'']" (first clause, with BASKET) vs "[''OID'' ''AS'' OID-DomainRef '';'']" (second clause,
        without BASKET, different semantics - see default_class_oid below). The first clause maps to
        IlisMeta16.ModelData.BasketOID (ForDataUnit {0..*} DataUnit <-> Oid {0..1} DomainType,
        ilismeta16-associations.yml): feeds BasketOID(ForDataUnit=this DataUnit, Oid=resolved domain).
        No `source:` (documentation marker only, same convention as default_class_oid below): neither
        classDef nor topicDef exposes a `domainRef()` accessor for this clause (both inline the tokens
        directly, confirmed via mappings/antlr-rule-index.yml, RULE #2bis) - no declarative binding fits.
        Resolved procedurally by InterlisModelBuilder._apply_topic_oid_clauses (positional scan via
        _scan_oid_clauses - also tells this clause apart from default_class_oid''s bare `OID AS` when
        only one, unprefixed by BASKET, is present, see that method''s docstring for the real-corpus
        evidence behind the disambiguation rule).

        '
    default_class_oid:
      target: IlisMeta16.ModelData.ObjectOID
      note: 'Reference Manual eCH-0031 V2.1.0 (2024-04-24) §3.5.2 "Themen": "BASKET OID AS ... OID AS
        für die Objektidentifikationen der Objekte, sofern bei der jeweiligen Klasse keine spezifische
        Definition dafür gemacht wird" (OID AS defines the domain for object identifications, as long
        as no specific definition is made for the class in question) - confirms the "default value"
        semantics. Also confirmed by the canonical metamodel .ili file itself
        (`models/IlisMeta16.ili`, association `ObjectOID`): "!! No OID, if no assoc" - a Class with no
        associated `ObjectOID` instance simply has no OID. This confirms the target: this second clause
        feeds the SAME `ObjectOID` association (Class <-> Oid:DomainType, ilismeta16-associations.yml)
        used for explicit per-class OIDs (classDef.own_oid_clause, spec/grammar/mapping/03_classes_and_structures.yml),
        not a separate attribute. No `source:` (documentation marker only - see DataUnit.BasketOID
        above): resolved procedurally by InterlisModelBuilder._apply_topic_oid_clauses, which builds
        `ObjectOID(Class=X, Oid=domain resolved here)` for every Class of this topic that carries no
        `_own_oid_clause` of its own (classDef''s explicit `OID AS`/`NO OID`, if present, always wins -
        never overridden by this default, matching the citation''s "sofern... keine spezifische
        Definition" wording).

        '
    DataUnit.Dependency:
      source:
        field: topicRef
        multi: true
        optional: true
      note: 'Confirmed for the target. ''DEPENDS ON topicRef(,topicRef)*'' -> IlisMeta16.ModelData.Dependency
        (Using {0..*} DataUnit <-> Dependent {0..*} DataUnit, ilismeta16-associations.yml): feeds a
        Dependency between this DataUnit and each DataUnit resolved via topicRef(). Directionality
        confirmed via the canonical metamodel .ili file (`models/IlisMeta16.ili`): `ASSOCIATION
        Dependency = Using -- DataUnit; Dependent (EXTERNAL) -- DataUnit; END Dependency;` - the
        `Dependent` role is marked `(EXTERNAL)`, consistent with `DEPENDS ON topicRef` always
        referencing ANOTHER topic (potentially outside the current basket/transfer, hence EXTERNAL),
        never the current topic itself. So: Using = this DataUnit (the one declaring DEPENDS ON),
        Dependent = the DataUnit resolved via each topicRef().

        '
    deferred_generics:
      target: IlisMeta16.ModelData.GenericDef
      note: 'Confirmed by structural reasoning (Reference Manual §3.5.2 confirms the semantic role:
        generic assignments not fixed until transfer must be explicitly listed under DEFERRED
        GENERICS) - lists the generic domains whose concrete assignment stays deferred to the
        transfer, currently limited to coordinate domains: "GenericRef = GenericCoordType-DomainRef".
        `IlisMeta16.ModelData.GenericDef` (Context {0..1} <-> GenericDomain {0..*}:DomainType,
        ilismeta16-associations.yml) has an OPTIONAL `Context` end (0..1) - which allows precisely a
        `GenericDef` instance with no associated Context, distinct from the `contextDef` case (already
        confirmed) where a real `Context` is always present. Construction: each `genericRef` under
        `DEFERRED GENERICS` feeds `GenericDef(Context=None, GenericDomain=[resolved domain(s)])` - a
        "declaration without context" mechanism, as opposed to the "assignment with context" mechanism
        of `contextDef`, reusing the same association.

        '
    definitions:
      source:
        field: definitions
        index: null
      note: loop of definitions() - each dispatches to its own construction (classDef/structureDef/associationDef/domainDef/etc.),
        attached to SubModel via their own confirmed parent associations (PackageElements) - SubModel
        remains the 'package' facet holding the topic's contents, unaffected by the DataUnit fix.
  note: 'INTERLIS 2 Metamodel edition 2022-06-17, §2.1.4 "Models and topics", exact text: "A ''Topic''
    of the INTERLIS-language is represented by one metaelement of EACH of the classes ''SubModel'' and
    ''DataUnit''. By means of the class SubModel a topic may be considered a package in the UML sense
    of the term; within this package the metaelement ''DataUnit'' (Name: ''BASKET'', DataUnitName:
    Modelname.Topicname) describes the structure and organization of corresponding INTERLIS-data
    baskets (''Basket'')." - topicDef genuinely builds TWO linked instances, not one (see "targets"
    below, replacing the former single SubModel-only target, which left Dependency/AllowedInBasket/
    BasketOID without a valid target since those 3 associations target DataUnit, never SubModel).
    Package contents container.

    || topicDef builds two linked instances (Metamodel 2022-06-17 §2.1.4). What follows reads as
    "attribute_bindings for the SubModel instance" and "attribute_bindings for the DataUnit instance"
    (explicit prefixes - this file''s schema has no native notion of per-target bindings).'
topicRef:
  grammar:
    rule: topicRef
  kind: Reference
  target: IlisMeta16.ModelData.SubModel
  resolves_to: SubModel
  attribute_bindings:
    _resolution:
      note: 'Pure reference resolution: qualified name (Name DOT)? Name resolves to an existing IlisMeta16.ModelData.SubModel
        by qualified_name (same pattern as classRef/viewRef/graphicRef).'
