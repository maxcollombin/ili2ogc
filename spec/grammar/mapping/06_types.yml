alignmentType:
  grammar:
    rule: alignmentType
  kind: Container
  attribute_bindings:
    resolved_type:
      source:
        field: HALIGNMENT|VALIGNMENT
        kind: alt_token
      rule:
        HALIGNMENT: INTERLIS.HALIGNMENT
        VALIGNMENT: INTERLIS.VALIGNMENT
      note: 'alignmentType() is a single mandatory choice between the HALIGNMENT and VALIGNMENT tokens;
        it builds no new IlisMeta16 instance, only resolves to a reference to one of the predefined built-in
        enumeration types confirmed in ilismeta16-enumerations.yml (INTERLIS.HALIGNMENT / INTERLIS.VALIGNMENT).
        Consistent with target: null. Feeds the Type association end of whichever construct consumes baseType.

        '
  note: No direct IlisMeta16 instance expected. Selects between the built-in INTERLIS.HALIGNMENT or INTERLIS.VALIGNMENT
    enumeration domains.
attributeType:
  grammar:
    rule: attributeType
  kind: Instance
  target: IlisMeta16.ModelData.AttributeRefType
  attribute_bindings:
    Restrictions:
      source:
        field: attrTypeDef
        multi: true
        optional: true
      note: '"(RESTRICTION LPAR attrTypeDef (COMMA attrTypeDef)* RPAR)?" suffix. Confirmed via ilismeta16-associations.yml
        ARefRestriction association: "ARef {0..*} AttributeRefType -- Type {0..*} Type" - each attrTypeDef''s
        resolved type feeds this association''s Type end. AttributeRefType has no own attributes (own:
        {}, confirmed in ilismeta16-classes.yml).

        '
    Of:
      source:
        field: classType
        attributePath: null
        optional: true
      note: 'Reference Manual eCH-0031 V2.1.0 (2024-04-24) §3.8.11 "Wertebereiche von Klassen und
        Attributpfaden", exact EBNF: `AttributePathType = ''ATTRIBUTE'' [''OF'' (ClassType-AttributePath
        | ''@'' Argument-Name)] [''RESTRICTION'' ''('' AttrTypeDef {'';'' AttrTypeDef} '')''].` - the
        manual notes it can be required that [the path] belong to ONE class (not a subclass) per another
        definition (OF). This form always resolves to a single class (never a restriction list),
        consistent with `ARefOf.Of` (0..1 Class, confirmed in ilismeta16-associations.yml): fed by the
        BASE class resolved by `classType()` (its `resolved_ref`, not its optional `Restrictions` list).
        `attributePath` itself feeds no additional attribute - `AttributeRefType.own = {}`: the type only
        fixes the target class, never the precise attribute name (that comes later, on the DATA side, via
        `AttributePathConst = ''>>'' [ViewableRef ''->''] Attribute-Name` - the same type/constant
        distinction already established for `ClassType`/`ClassConst`). ModelBuilder ignores the trailing
        `DOT attributePath` (no target), feeding `ARefOf.Of` with `classType()`''s base class.

        '
    _at_symbol_name:
      source:
        field: AT_SYMBOL
        Name: null
        optional: true
      status: not_applicable
      note: 'not_applicable confirmed. Same manual citation as `Of` above: `''@'' Argument-Name` - per
        the manual, in the case of a function definition this refers to another (formal) argument. This
        confirms the mechanism''s nature (a reference to another formal parameter of the enclosing
        function, not a class), but the metamodel has no target for it: `AttributeRefType.own = {}` (no
        attribute at all) and no association targets a `FormalArgument`/parameter from
        `AttributeRefType`/`ARefOf` (its only target is `Class`, via `ARefOf`). ModelBuilder raises a
        warning if `@Name` is encountered (nothing to feed).

        '
baseType:
  grammar:
    rule: baseType
  kind: Container
  attribute_bindings:
    _dispatch:
      note: Pure dispatcher, no own class - 13 mutually exclusive alternatives, each delegating to an
        already-bound rule from earlier lots (textType/enumerationType/enumTreeValueType/alignmentType/booleanType/numericType/formattedType/dateTimeType/coordinateType/oIDType/blackboxType/classType/attributeType).
blackboxType:
  grammar:
    rule: blackboxType
  kind: Instance
  target: IlisMeta16.ModelData.BlackboxType
  attribute_bindings:
    Kind:
      source:
        field: BINARY|XML
        kind: alt_token
      rule:
        BINARY: Binary
        XML: Xml
      note: 'blackboxType() has a single alternative: BLACKBOX followed by a mandatory choice between
        BINARY and XML. Values confirmed via ilismeta16-kind-values.yml IlisMeta16.ModelData.BlackboxType.Kind:
        [Binary, Xml].

        '
  note: Class and attribute path types
booleanType:
  grammar:
    rule: booleanType
  kind: Instance
  target: IlisMeta16.ModelData.BooleanType
  note: 'IlisMeta16.ModelData.BooleanType has no own attributes (confirmed via ilismeta16-classes.yml:
    attributes.own: {}); booleanType() matches only the BOOLEAN keyword, a pure marker with no data to
    bind. Presence of this rule is itself the signal to construct a BooleanType instance; no field mapping
    is needed.'
classConst:
  grammar:
    rule: classConst
  kind: Instance
  target: IlisMeta16.ModelData.ClassConst
  attribute_bindings:
    Class:
      source:
        field: viewableRef
      note: '"> viewableRef" (e.g. ">MyClass"). Confirmed via ilismeta16-datatypes.yml: ClassConst is
        a DataType with a single own attribute Class: INTERLIS.NAME (0..1). The resolved viewableRef''s
        qualified name feeds this attribute.

        '
classType:
  grammar:
    rule: classType
  kind: Instance
  target: IlisMeta16.ModelData.ClassRefType
  attribute_bindings:
    _kind_marker:
      source:
        field: CLASS|STRUCTURE
        kind: alt_token
      note: '"CLASS (RESTRICTION LPAR viewableRef (COMMA viewableRef)* RPAR)?" or "STRUCTURE (RESTRICTION
        LPAR classOrStructureRef (COMMA classOrStructureRef)* RPAR)?". ClassRefType has no own attributes
        (own: {}, confirmed in ilismeta16-classes.yml) and inherits from the abstract ClassRelatedType
        (also own: {}), so the CLASS/STRUCTURE keyword itself is not recorded as a value anywhere - it
        only determines which sub-rule (viewableRef vs classOrStructureRef) supplies the restriction entries
        below, i.e. whether the restriction set is constrained to classes or to structures.

        '
    Restrictions:
      source:
        field: viewableRef|classOrStructureRef
        multi: true
        optional: true
      note: 'Entries inside the optional RESTRICTION(...) clause. Confirmed via ilismeta16-associations.yml
        ClassRestriction association: "CRTR {0..*} ClassRelatedType -- ClassRestriction {0..*} Class"
        - each resolved viewableRef/classOrStructureRef feeds the ClassRestriction association''s Class
        end.

        '
    _unrestricted_base:
      status: not_applicable
      note: 'not_applicable confirmed. INTERLIS 2 Reference Manual edition 2006-04-13, section 2.8.11
        "Domains of classes and attribute paths" (p.45): "By indicating structure any structure or
        class, by indicating class (also permissible as extension of STRUCTURE) any class (but no
        structures) are admitted. If only certain structures, resp. classes and their extensions are to
        be admitted, these have to be listed (RESTRICTION)." This confirms that the absence of
        RESTRICTION(...) simply means "no restriction" (implicitly "any Class"/"any Structure or Class")
        - no explicit reference is expected to be built anywhere, neither via ClassRestriction (which
        stays at 0 entries, its {0..*} multiplicity explicitly allows that) nor via BaseClass (a
        completely separate mechanism, unrelated to this case). Same conclusion applies by analogy to
        the equivalent case on attributeType (RESTRICTION(...) absent -> Restrictions stays an empty
        list). ModelBuilder builds nothing more than the absence of entries in ClassRestriction/
        Restrictions when RESTRICTION(...) is absent - the correct and complete representation of
        "unrestricted".

        '
constant:
  grammar:
    rule: constant
  kind: Instance
  target: IlisMeta16.ModelData.Constant
  discriminant:
    attribute: Type
    dynamic: true
    rule:
      UNDEFINED: Undefined
      numericConst: Numeric
      textConst: Text
      formattedConst: Text
      enumerationConst: Enumeration
  attribute_bindings:
    _dispatch:
      note: '7 mutually exclusive alternatives: UNDEFINED (bare token) or one of 6 sub-rules (numericConst/textConst/formattedConst/enumerationConst/classConst/attributePathConst),
        each already bound in earlier lots (Lots 1-4) with their own DataType targets (ClassConst/AttributePathConst/etc.).'
    Value:
      source:
        field: numericConst|textConst|formattedConst|enumerationConst|classConst|attributePathConst
        kind: alt_rule
      note: confirmed Constant.own.Value (TEXT, mandatory) - raw literal text of whichever sub-constant
        matched; UNDEFINED alternative likely leaves Value unset/sentinel.
    Type:
      source:
        field: null
      note: confirmed Constant.own.Type (Kind enum, mandatory) - dispatched from which of the 7 alternatives
        matched (needs mapping to Constant.Type's enum values, not read in this lot's scope - values not
        yet cross-checked against kind-values.yml).
  note: 'Type resolved dynamically: UNDEFINED -> Undefined, numericConst -> Numeric, textConst/formattedConst
    -> Text, enumerationConst -> Enumeration. classConst/attributePathConst need separate confirmation
    (may not map to Constant.Type at all).'
contextDef:
  grammar:
    rule: contextDef
  kind: Instance
  target: IlisMeta16.ModelData.Context
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: 'inherited Name (MetaElement); IlisMeta16.ModelData.Context has no own attributes (attributes.own:
        {}, confirmed ilismeta16-classes.yml).'
    generic_concrete_pairs:
      note: 'The compiled body confirms the exact structure: `(domainRef EQ domainRef (OR domainRef)*
        SEMI)+` - a repeated outer loop of "pair-groups", each with EXACTLY ONE generic domainRef (left)
        and 1+ OR-joined concrete domainRefs (right). ConcreteForGeneric.GenericDef has `target_kind:
        Unknown` (confirmed in ilismeta16-associations.yml) - evidence that `GenericDef` is treated as a
        reified association class (each link is individually referenceable, not just a role pair). A
        single GenericDef shared across the whole contextDef would lose the generic/concrete pairing (all
        ConcreteForGeneric instances would point to the same link, making it impossible to know which
        concrete domains go with which generic domain) - only "one GenericDef PER pair-group" (Context=
        this Context, shared across all pair-groups; GenericDomain=[this pair-group''s left domainRef
        only]) preserves the source information faithfully. Each right-hand domainRef of the same
        pair-group then creates a ConcreteForGeneric(GenericDef=this specific link, ConcreteDomain=
        resolved domainRef).

        '
controlPoints:
  grammar:
    rule: controlPoints
  kind: Container
  attribute_bindings:
    _resolution:
      source:
        field: Name
        multi: true
      note: 'No own class; ''VERTEX Name(DOT Name)*'' is a qualified name reference, resolving to a
        CoordType instance. This declarative binding (`field: Name, multi: true`) only ever produced a
        LIST of token texts, never actually attached anywhere (LineType.CoordType stayed None).
        `controlPoints` is now a dedicated special case (`InterlisModelBuilder._build_control_points_ref`,
        called directly from `_relay` before this declarative bag is computed - this `_resolution` entry
        is therefore never reached in practice, kept only as a record of the former state) that builds a
        ForwardRef (qualified name joined by "." from the Name tokens, VERTEX ignored), attached via the
        `lineType.CoordType` binding (LineCoord association, see lineType above).'
coordinateType:
  grammar:
    rule: coordinateType
  kind: Instance
  target: IlisMeta16.ModelData.CoordType
  attribute_bindings:
    Multi:
      source:
        field: COORD|MULTICOORD
        kind: alt_token
      rule:
        COORD: false
        MULTICOORD: true
      note: 'Confirmed via the IlisMeta16 metamodel PDF (INTERLIS 2 - Metamodel, edition 2022-06-17):
        CoordType has an own "Multi: BOOLEAN" attribute (also confirmed in ilismeta16-classes.yml).

        '
    Axis:
      source:
        field: numeric|NUMERIC
        kind: alt_rule_or_token
        multi: true
        cardinality: 1..3
      wrap:
        numeric: IlisMeta16.ModelData.NumType
        NUMERIC: IlisMeta16.ModelData.NumType
      note: '1 to 3 axis definitions, comma-separated, each either a full numeric() range or the bare
        NUMERIC keyword (unrestricted axis). Confirmed via the metamodel PDF: "ASSOCIATION AxisSpec =
        CoordType -- Axis (ORDERED, EXTERNAL) {1..3} NumType;" - each numeric() feeds one ordered NumType
        instance linked via AxisSpec.Axis; a bare NUMERIC keyword (no range/circular/unit) still produces
        a NumType instance (with Min/Max/Circular/Unit left unset).

        `wrap:` was missing from the engine''s `multi: true` branch (source_resolver.py,
        `_resolve_multi_node`), unlike the `alt` branch (already used by attributeDef.Type). Real
        consequence: CoordType.Axis contained only raw bag dicts (`{Min:..., Max:..., ...}`), never real
        `NumType` instances - silently unusable by any downstream code expecting `MetaInstance` (e.g.
        `xtf/schema.coord_axes`). Each `numeric()`/`NUMERIC` in the list now becomes its own `NumType`
        instance (empty for the bare token - see note above).

        '
    NullAxis:
      source:
        field: rotationDef
        path: NullAxis
        optional: true
      note: 'The real source is coordinateType''s own rotationDef() (see the rotationDef binding below),
        not clauses internal to numeric(). The first PosNumber of "ROTATION PosNumber -> PosNumber" feeds
        NullAxis (type AxisInd = domain 1..3, ilismeta16-classes.yml/metamodel PDF section 2.3.1). The
        "{ Name [PosNumber] }"/"< Name >" clauses of numeric() are a separate matter (NumsRefSys-like, not
        concerned by this point).
        `field: rotationDef, index: 0` used to wrongly index the rotationDef() accessor itself (single, 0
        or 1 occurrence) instead of its internal PosNumber -> `path: NullAxis` now delegates to the
        rotationDef rule (see below, which exposes NullAxis/PiHalfAxis itself via its own indexed
        PosNumber).

        '
    PiHalfAxis:
      source:
        field: rotationDef
        path: PiHalfAxis
        optional: true
      note: 'Same rotationDef() as NullAxis above; the second PosNumber (after MINUS GT) feeds PiHalfAxis
        (AxisInd). Same fix as NullAxis (path instead of a direct index on rotationDef).

        '
    _rotation_via_rotationDef:
      note: 'There is no separate "Rotation" attribute/association on CoordType (ilismeta16-classes.yml:
        only NullAxis/PiHalfAxis/Multi are own) - rotationDef() feeds NullAxis+PiHalfAxis above directly,
        there is nothing more to look for under the name "Rotation".

        '
dateTimeType:
  grammar:
    rule: dateTimeType
  kind: Container
  attribute_bindings:
    resolved_type:
      source:
        field: DATE|TIMEOFDAY|DATETIME
        kind: alt_token
      rule:
        DATE: INTERLIS.GregorianDate
        TIMEOFDAY: INTERLIS.TimeOfDay
        DATETIME: INTERLIS.GregorianDateTime
      note: 'dateTimeType() has 3 mutually exclusive single-token alternatives; none builds a new IlisMeta16
        instance. Each resolves to a reference to a predefined built-in INTERLIS datatype, confirmed in
        ilismeta16-datatypes.yml under the INTERLIS.* namespace (not IlisMeta16.ModelData.*). Consistent
        with target: null. The resolved qualified_name feeds whichever
        parent construct consumes baseType (attrType/attrTypeDef Type association end).

        '
  note: No direct IlisMeta16 instance expected. Selects one of the built-in INTERLIS date/time primitives
    (INTERLIS.GregorianDate / INTERLIS.TimeOfDay / INTERLIS.GregorianDateTime), not a ModelData class.
decConst:
  grammar:
    rule: decConst
  kind: Container
  attribute_bindings:
    resolved_value:
      source:
        field: Dec|LNBASE|PI|PosNumber
        kind: alt_token_or_rule
      note: 'decConst() is a single mandatory choice among 4 forms: a Dec literal, a PosNumber literal,
        or one of the two named mathematical constant keywords LNBASE (natural log base e) or PI. No dedicated
        IlisMeta16 instance is created (target: null); this resolved numeric value feeds the parent construct''s
        own numeric value (e.g. numericConst -> Constant via the constant dispatch, or a plausibilityConstraint
        bound used as numericConst).

        '
  note: No direct IlisMeta16 instance expected. Numeric literal, or PI/LNBASE built-in constant; feeds
    the enclosing numericConst/Constant.Value.
domainDef:
  grammar:
    rule: domainDef
  kind: Container
  multi_declaration: true
  parent:
    association: PackageElements
    role: Element
  note: 'No fixed target: IlisMeta16.ModelData.DomainType is abstract (isAbstract=true in the XMI). The
    concrete instantiated subclass is resolved by the type_ dispatcher (-> textType/numericType/
    booleanType/enumerationType/coordinateType/lineType/classType/attributeType/oIDType/blackboxType),
    each already individually mapped with its own qualified_name.

    `domainDef()` grammatically loops over N declarations sharing one `DOMAIN` keyword, each with its
    own Name and exactly one content alternative (`type_()`, bare `numeric()`, or bare `enumeration()`) -
    handled by the special-cased `InterlisModelBuilder._build_multi_declaration` rather than
    `attribute_bindings` (`multi_declaration: true`). It also builds two alternatives that are easy to
    miss: `STRING DOTDOT STRING` (real occurrences exist) and inline `CLASS RESTRICTION(...)` - and
    attaches the `EXTENDS domainRef` clause (`Super`, Inheritance association) on every declaration.
    Full history of the 4 fixes involved: docs/dev-notes/domaindef-multi-declaration-investigation.md.'
domainRef:
  grammar:
    rule: domainRef
  kind: Reference
  target: IlisMeta16.ModelData.DomainType
  resolves_to:
  - DomainType
  - Class
  attribute_bindings:
    _resolution:
      note: 'Pure reference resolution: qualified name (Name (DOT Name)*)? Name, or ''INTERLIS DOT Name''
        for predefined domains - resolves to an existing IlisMeta16.ModelData.DomainType subclass instance
        by qualified_name; no own attributes constructed (DomainType itself is abstract, own: {Mandatory}
        inherited by all concrete subclasses already bound in earlier lots).'
  note: 'Type dispatching. `resolves_to: [DomainType, Class]`: domainRef() is syntactically
    indistinguishable from a structureRef/classRef for a simple qualified name (the classic INTERLIS
    domain/structure/class grammar ambiguity) - confirmed on `models/IlisMeta16.ili`
    ("Multiplicity: Multiplicity;", the attribute AND the type share the name "Multiplicity", which is
    actually a STRUCTURE/Class, not a DomainType). Without the "Class" fallback hint, the ambiguity with
    other same-named entities (e.g. an attribute named the same way elsewhere) stayed unresolved even
    when the real target (the Class) was the only candidate left after filtering.

    '
enumElement:
  grammar:
    rule: enumElement
  kind: Instance
  target: IlisMeta16.ModelData.EnumNode
  note: 'Tree construction is handled explicitly by `InterlisModelBuilder._build_enumeration_tree`
    (a special case triggered on `rule_name == "enumeration"`, same family as
    `multi_declaration`/`_build_multi_target`, the only other 2 special cases among the 121 rules) - a
    synthetic TOP node plus children via SubNode/role Node, correctly scoped by nesting level. There is
    no `parent:` binding here: an earlier `{association: TopNode, role: TopNode}` version made every
    enumElement fight over EnumType''s single TopNode slot regardless of nesting, flattening the tree
    into a chain. Full history: docs/dev-notes/enumelement-tree-construction-investigation.md.'
  attribute_bindings:
    Name:
      source:
        field: BASKET|LOCAL|Name
        index: 0
        kind: alt_token_or_rule
      note: 'enumElement() = (BASKET|LOCAL|Name) (DOT Name)* enumeration()?. The first segment is matched
        as BASKET, LOCAL, or Name (the grammar explicitly allows the reserved words BASKET/LOCAL to also
        serve as an enum element''s literal identifier text here). EnumNode has no own attributes beyond
        inherited Name/ Documentation (confirmed: ilismeta16-classes.yml, EnumNode attributes.own: {}).

        '
    _dotted_path:
      source:
        field: DOT
        Name: null
        multi: true
        optional: true
      note: 'Reference Manual eCH-0031 V2.1.0 (2024-04-24) §3.8.2 "Aufzählungen", exact EBNF: `EnumElement
        = EnumElement-Name {''.'' EnumElement-Name} [Sub-Enumeration].` - per the manual, within
        (re)definitions of enumerations (primary definition, additional elements of an extension), the
        EnumElement may consist of only ONE name; multiple names are only allowed to IDENTIFY, in an
        extension, an ALREADY EXISTING enumeration element. So the dotted path does not create a chain of
        new `EnumNode`s - it NAVIGATES through already-existing `EnumNode`s (via the `SubNode`
        association, same mechanism as `Children`) to identify the leaf node to extend; only the LAST
        segment can carry a nested `enumeration()` that adds real new children to that resolved node.
        ModelBuilder resolves each successive segment via `SubNode` (the first segment''s Name = the
        top-level EnumNode to find in the existing EnumType; each following segment = one more `SubNode`
        step down), without constructing a new instance for intermediate segments - only the final
        construction (`Children`) creates new `EnumNode`s.

        '
    Children:
      source:
        field: enumeration
        optional: true
      note: 'Optional nested enumeration() defines this node''s children (a sub-list of enumElement, e.g.
        "Warm(Red,Orange,Yellow)"), each of which becomes a child EnumNode of this one via the SubNode
        association (ParentNode=this node, Node=child; confirmed in ilismeta16-associations.yml: "SubNode
        = ... ParentNode {0..1} EnumNode -- Node {0..*} EnumNode (composite)"). This is a DIFFERENT use
        of enumeration() than the domain-restriction use noted on the enumeration binding itself - here
        it defines new child nodes rather than restricting an existing domain.

        '
    _parent_association_dispatch:
      note: 'The rule-level `parent: {association: TopNode, role: TopNode}` is only correct for
        enumElement instances directly under enumerationType()/enumeration() at the top of a new EnumType
        (TopNode: EnumType {0..1} -- TopNode {1} EnumNode, confirmed in ilismeta16-associations.yml). For
        enumElement instances appearing INSIDE another enumElement''s nested enumeration() (see Children
        above), the correct association is SubNode (ParentNode=the enclosing EnumNode), not TopNode.
        ModelBuilder dispatches on nesting depth at construction time; a single grammar rule serves both
        cases depending on the calling context.

        '
enumTreeValueType:
  grammar:
    rule: enumTreeValueType
  kind: Container
  attribute_bindings:
    ET:
      source:
        field: domainRef
      note: '"ALL OF domainRef". No direct IlisMeta16 instance is created
        here; the resolved domainRef (an EnumType) feeds the TreeValueTypeOf association''s ET end (confirmed
        in ilismeta16-associations.yml: "TreeValueTypeOf = ETVT {0..*} EnumTreeValueType -- ET {1} EnumType").
        The EnumTreeValueType instance itself (own: {} - no own attributes, confirmed in ilismeta16-classes.yml)
        is constructed by the enclosing rule (e.g. attrTypeDef/attrType dispatch).

        '
  note: 'No direct IlisMeta16 instance expected. "ALL OF domainRef": designates the domain feeding the
    TreeValueTypeOf association''s ET end (IlisMeta16.ModelData.EnumType); the EnumTreeValueType instance
    itself is created elsewhere.'
enumeration:
  grammar:
    rule: enumeration
  kind: Container
  attribute_bindings:
    Elements:
      source:
        field: enumElement
        multi: true
      note: 'Each enumElement -> EnumNode instance (same TopNode/SubNode construction as in enumerationType).
        enumeration() is a restriction/extension list of an existing
        enumeration domain, not a new EnumType declaration, so these EnumNode instances restrict/extend
        the referenced base EnumType''s node tree rather than populating a freshly-created EnumType.

        '
    Final:
      source:
        field: FINAL
        presence: true
      note: 'Reference Manual eCH-0031 V2.1.0 (2024-04-24) §3.8.2, exact EBNF: "EnumerationType =
        Enumeration [''ORDERED''|''CIRCULAR'']. Enumeration = ''('' EnumElement {'','' EnumElement}
        ['':'' ''FINAL''] '')''. EnumElement = EnumElement-Name {...} [Sub-Enumeration]." - the project''s
        .g4 rule enumeration() merges Enumeration AND EnumerationType''s [ORDERED|CIRCULAR] suffix into a
        single rule (a structural fact, not a bug - the suffix stays optional and correctly placed). The
        target depends on the call site, as already hinted by attrType''s "anonymous EnumType" note
        (attrType/enumeration/numeric/NUMERIC dispatch):
        - Top-level call (from attrType - itself from domainDef or roleDef alt2 - "Name COLON MANDATORY?
        (attrTypeDef|enumeration|numeric|constraintDef) SEMI"): enumeration() is the equivalent of the
        official EnumerationType for this anonymous type -> builds a new IlisMeta16.ModelData.EnumType
        (same target as enumerationType()), Final = EnumType.Final (inherited from ExtendableME, confirmed
        in ilismeta16-classes.yml).
        - Nested call (as enumElement''s optional Sub-Enumeration: ''(enumeration)?''): does NOT create a
        new EnumType (confirmed by the manual''s official example: ''JoursSemaine = (JoursOuvrables
        (lundi,mardi,...), dimanche) CIRCULAR;'' - the trailing CIRCULAR applies to JoursSemaine''s single
        EnumType only, the ''(lundi,mardi,...)'' sub-list of JoursOuvrables does not create a second one);
        here Final instead marks the ENCLOSING EnumNode (the one whose children this Sub-Enumeration
        lists) as not further extensible - EnumNode.Final (also inherited from ExtendableME, confirmed in
        ilismeta16-classes.yml) - same Final attribute, different target depending on nesting level.'
    Order:
      source:
        field: CIRCULAR|ORDERED
        presence: true
      rule:
        neither: Unordered
        ORDERED: Ordered
        CIRCULAR: Circular
      note: 'For the top-level call: same mechanism as enumerationType.Order (values Unordered/Ordered/
        Circular, ilismeta16-kind-values.yml) - targets EnumType.Order (own, mandatory). For the nested
        call (a enumElement''s Sub-Enumeration): effectively not_applicable - EnumNode has no Order
        attribute at all (ilismeta16-classes.yml, own: {} plus only what it inherits from ExtendableME)
        and the Reference Manual confirms the [ORDERED|CIRCULAR] suffix belongs exclusively to
        EnumerationType, never to Sub-Enumeration (''Sub-Enumeration'' = ''Enumeration'', with no suffix,
        in the official EBNF) - if this token is nonetheless encountered at a nested level in this
        project (grammar slightly more permissive than the spec), ModelBuilder ignores it (no metamodel
        target at that level).

        '
  note: No direct IlisMeta16 instance expected. "(el1, el2, ...)" restriction/extension list of an existing
    enumeration domain, not a new EnumType declaration (see enumerationType for that). || Reference
    Manual eCH-0031 V2.1.0 (2024-04-24) §3.8.2, EBNF
enumerationConst:
  grammar:
    rule: enumerationConst
  kind: Container
  attribute_bindings:
    Value:
      source:
        field: Name
        multi: true
        optional: true
      note: '"#Name(.Name)*(.OTHERS)?" or "#OTHERS" - symbolic enum literal;
        feeds Constant.Value (Type=Enumeration) on the enclosing Constant.
        The dotted Name segments form the qualified path to the referenced EnumNode (resolved against
        the applicable EnumType''s node tree via TopNode/SubNode).

        '
    Others:
      source:
        field: OTHERS
        presence: true
      note: 'Either a bare "#OTHERS" (whole-enum wildcard) or a trailing ".OTHERS" qualifying a specific
        tree branch''s catch-all. Feeds the same Constant.Value slot as Value above, as the special OTHERS
        pseudo-node rather than a resolved EnumNode path.

        '
  note: No direct IlisMeta16 instance expected. "#Name" or "#OTHERS" symbolic enum literal; feeds Constant.Value
    (Type=Enumeration) on the enclosing Constant.
enumerationType:
  grammar:
    rule: enumerationType
  kind: Instance
  target: IlisMeta16.ModelData.EnumType
  attribute_bindings:
    Order:
      source:
        field: CIRCULAR|ORDERED
        presence: true
      rule:
        neither: Unordered
        ORDERED: Ordered
        CIRCULAR: Circular
      note: 'enumerationType() = ENUM LCBR enumElement (COMMA enumElement)* RCBR (CIRCULAR|ORDERED)?.
        Values confirmed via ilismeta16-kind-values.yml IlisMeta16.ModelData.EnumType.Order: [Unordered,
        Ordered, Circular] (mandatory, so absence of both tokens resolves to Unordered).

        '
    Elements:
      source:
        field: enumElement
        multi: true
      note: 'Each enumElement -> EnumNode instance, linked via the TopNode association (see the enumElement
        binding''s own parent: association TopNode / role TopNode).

        '
formatDef:
  grammar:
    rule: formatDef
  kind: Container
  attribute_bindings:
    _template:
      source:
        field: INHERITANCE
        STRING: null
        baseAttrRef: null
      target: IlisMeta16.ModelData.FormattedType.Format
      note: 'Confirmed by elimination (see formattedType._formatDef_template for the full argument).
        formatDef() = LPAR INHERITANCE? STRING? (baseAttrRef STRING)* baseAttrRef STRING? RPAR - an
        alternating sequence of literal STRING separators and structure attribute references
        (baseAttrRef), with an optional leading INHERITANCE flag. No own IlisMeta16 instance is created
        here (target: null): this rule feeds directly into `Format` (TEXT, the only own attribute of
        `FormattedType`) on the enclosing `formattedType` rule, via serialization on the ModelBuilder
        side. The `INHERITANCE` flag and the exact order of the `baseAttrRef` list remain serialization-
        algorithm details (how to reconstitute the template text), not a metamodel-target ambiguity.

        '
  note: No direct IlisMeta16 instance expected. Format pattern (STRING literals + baseAttrRef placeholders);
    feeds FormattedType.Format.
formattedConst:
  grammar:
    rule: formattedConst
  kind: Container
  attribute_bindings:
    Value:
      source:
        field: STRING
      note: 'formattedConst() is a single STRING token, no dedicated IlisMeta16 instance (target: null).
        Feeds the parent construct''s own Value (e.g. Constant.Value via the constant dispatch), analogous
        to textConst.

        '
  note: No direct IlisMeta16 instance expected. Single STRING literal; feeds Constant.Value (Type=Text)
    on the enclosing Constant (created by constant).
formattedType:
  grammar:
    rule: formattedType
  kind: Instance
  target: IlisMeta16.ModelData.FormattedType
  attribute_bindings:
    Format:
      source:
        field: Name
        optional: true
      note: 'No `alt:` selector here - `ctx.getAltNumber()` always returns 0 for this rule, so an
        alt-based selector would leave this binding permanently None. `Name` is a direct accessor of
        `formattedType` (FORMAT INTERLIS DOT Name STRING DOTDOT STRING | FORMAT BASED_ON structureRef
        formatDef | FORMAT domainRef STRING DOTDOT STRING) only on alternative 1 - the other 2 expose no
        Name directly (structureRef()/domainRef() are sub-rules, any internal Name of theirs isn''t
        exposed on formattedType''s ctx). Alternative 1 only: "FORMAT INTERLIS.Name STRING..STRING". The
        qualified predefined format name ("INTERLIS." + Name) feeds FormattedType.Format (own attribute,
        mandatory TEXT, ilismeta16-classes.yml). Alternatives 2 and 3 do not directly supply Format this
        way - see Struct/BaseFormat below.

        '
    Min:
      source:
        field: STRING
        index: 0
        optional: true
      note: '`alt: 1|3` removed, same reason as Format above. Harmless: `STRING` as a direct accessor of
        formattedType exists only on alternatives 1 and 3 (both "... STRING DOTDOT STRING") - alternative
        2 has none (its only STRINGs live inside formatDef(), a sub-rule, never exposed directly on this
        ctx). Alt1 and alt3 feed the same target the same way anyway (Min = 1st STRING) - no remaining
        ambiguity between the two. Feeds the inherited NumType.Min (FormattedType extends NumType
        per ilismeta16-classes.yml). NumType.Min/Max share the same raw type GUID
        (C16095C6-1D80-49ab-9A0B-5847A355489B) as Class.Name (a TEXT-like primitive), consistent with
        storing format example strings rather than numeric bounds here.

        '
    Max:
      source:
        field: STRING
        index: 1
        optional: true
      note: '`alt: 1|3` removed, same reason/verification as Min above. Second
        STRING of the STRING..STRING range in alternatives 1 and 3; feeds NumType.Max (see Min note).'
    Struct:
      source:
        field: structureRef
        optional: true
      note: '`alt: 2` removed, same reason as Format above - `structureRef` is a direct accessor of
        formattedType only on alternative 2. Alternative 2 only: "FORMAT
        BASED_ON structureRef formatDef". Confirmed via ilismeta16-associations.yml StructOfFormat
        association: "FormattedType {0..*} -- Struct {1} Class". structureRef resolves the Struct end
        (a Class[Kind=Structure]).

        '
    _formatDef_template:
      source:
        field: formatDef
        optional: true
      target: IlisMeta16.ModelData.FormattedType.Format
      note: '`alt: 2` removed (`ctx.getAltNumber()` always returns 0) - `formatDef` is a direct accessor
        of formattedType only on alternative 2, harmless to remove.
        Confirmed by elimination: alternative 2''s formatDef() (see the separate formatDef binding)
        describes the template composing the struct''s attributes into the Format string.
        `FormattedType.own` contains only ONE attribute (`Format`, TEXT, mandatory - confirmed
        exhaustively in ilismeta16-classes.yml); no other target exists to receive this content, so
        `Format` receives the serialization of formatDef()''s alternating STRING/baseAttrRef sequence.
        The exact serialization algorithm (how to concatenate STRING/baseAttrRef into text) remains a
        ModelBuilder implementation detail, not a metamodel-mapping ambiguity.

        '
    _domainRef_base:
      source:
        field: domainRef
        optional: true
      status: not_applicable
      note: 'No `alt:` selector here either (same reason as Format above) - harmless with the `_` prefix
        (never attached literally, per `model_builder.py`''s `_apply_one_binding`/project convention): at
        worst this field resolves a real ForwardRef instead of staying None, but it stays ignored
        regardless (no target to feed, see below).
        No metamodel association lets a `FormattedType` be based on another domain: the only association
        targeting `FormattedType` in `ilismeta16-associations.yml` is `StructOfFormat` (alternative 2''s
        `Struct`, unrelated); `TypeRestriction` attaches to `TypeRelatedType` and
        `BaseClass`/`ClassRestriction` to `ClassRelatedType`/`Class`, and `FormattedType.all_superclasses`
        (NumType, DomainType, Type, ExtendableME, MetaElement) includes neither. ModelBuilder decision: if
        this 3rd alternative (`FORMAT domainRef STRING..STRING`) is encountered, build the `FormattedType`
        without a base (Min/Max only, like alternative 1), ignoring the resolved `domainRef` (optional
        warning) - nothing to feed.

        '
intersectionDef:
  grammar:
    rule: intersectionDef
  kind: Container
  attribute_bindings:
    _resolution:
      source:
        field: Dec|Number|PosNumber
        kind: alt_token
      note: 'No own class; ''WITHOUT OVERLAPS GT (Dec|Number|PosNumber)'' (e.g. ''WITHOUT OVERLAPS >0.001''
        or ''WITHOUT OVERLAPS >5'') directly feeds the parent lineType''s confirmed LineType.own.MaxOverlap
        (TEXT, 0..1) with the matched token''s raw value - see lineType binding above.


        Real engine bug, confirmed on 4 real files from the wider models.geo.admin.ch corpus -
        ISOS_V1.ili/rebbaukataster_20120601.ili/Bewirtschaftungseinheit_V1_3.ili): the vendored grammar
        used to require exclusively the ''Dec'' token after GT, but the ANTLR lexer can never emit that
        token type for a bare integer with no decimal point (e.g. ''> 5'') - ''PosNumber''/''Number''
        (lexer rules defined before ''Dec'', same match length) systematically win ANTLR''s
        disambiguation for this case, making ''WITHOUT OVERLAPS > 5;'' (a common, real form - eCH-0031
        V2.1.0 explicitly requires the same numeric precision as the coordinate domain, so a bare integer
        is legitimate for a 0-decimal domain) grammatically impossible to parse despite the manual''s
        citation ''IntersectionDef = WITHOUT OVERLAPS [ > Dec ].'' - the same category of lexer/parser
        divergence already encountered and worked around elsewhere in this same grammar (the numeric()
        rule already explicitly lists ''Number DOTDOT Number | Number DOTDOT PosNumber | PosNumber
        DOTDOT PosNumber | Dec DOTDOT Dec'' for the same reason - a direct precedent, not improvised).
        Fixed in the vendored grammar (vendor/interlis-antlr4/InterlisParser.g4): ''intersectionDef :
        WITHOUT OVERLAPS GT (Dec | Number | PosNumber);'' - parser regenerated.'
  note: 'No direct IlisMeta16 instance expected. WITHOUT OVERLAPS > <dec|number|posnumber>: single value
    feeding LineType.MaxOverlap.'
lineForm:
  grammar:
    rule: lineForm
  kind: Container
  attribute_bindings:
    _resolution:
      source:
        field: lineFormType
        multi: true
      note: No own class; pure wrapper 'WITH LPAR lineFormType(,lineFormType)* RPAR' around a list of
        lineFormType() entries. Each resolved lineFormType feeds the enclosing lineType's confirmed LinesForm
        association (LineType <-> LineForm, 1..*) - see lineType binding above.
  note: 'No direct IlisMeta16 instance expected. This rule is the WITH(...) clause of a lineType: it groups
    one or more lineFormType resolutions and produces LinesForm association links between the enclosing
    LineType and each resolved LineForm.'
lineFormType:
  grammar:
    rule: lineFormType
  kind: Container
  feeds_into: IlisMeta16.ModelData.LineForm
  attribute_bindings:
    _resolution:
      note: '3 alternatives: bare STRAIGHTS/ARCS tokens (built-in line forms, resolved by name to a predefined
        LineForm instance, likely a well-known INTERLIS-namespace LineForm since LineForm.own is empty
        and Name is inherited from MetaElement), or ''Name DOT Name'' (qualified reference to a custom
        LineForm declared elsewhere via lineFormTypeDef, resolved via LineFormStructure: LineForm <->
        Structure:Class, 1..1). LineForm itself has no own attributes (attributes.own: {}, confirmed ilismeta16-classes.yml)
        - purely a named reference resolution in all 3 cases.'
  note: 'No direct IlisMeta16 instance expected. Resolves a single element of a lineForm''s WITH(...)
    list: either a built-in keyword (STRAIGHTS / ARCS) or a qualified reference to an existing LineForm
    declared elsewhere via lineFormTypeDef.'
lineFormTypeDef:
  grammar:
    rule: lineFormTypeDef
  kind: Instance
  target: IlisMeta16.ModelData.LineForm
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: 'inherited Name (MetaElement); LineForm has no own attributes (attributes.own: {}, confirmed
        ilismeta16-classes.yml) - the custom form''s actual shape is entirely carried by the LineFormStructure
        association below.'
    structure_link:
      association: LineFormStructure
      role: Structure
      source:
        field: Name
        index: 1
      note: 'confirmed IlisMeta16.ModelData.LineFormStructure: LineForm <-> Structure:Class (1..1) - the
        ''LINE FORM { Name : Name ; }'' body''s second Name (after COLON) resolves the backing Structure
        class that defines this custom line form''s coordinate attributes.'
lineType:
  grammar:
    rule: lineType
  kind: Instance
  target: IlisMeta16.ModelData.LineType
  attribute_bindings:
    Kind:
      source:
        field: POLYLINE|SURFACE|AREA|MULTIPOLYLINE|MULTISURFACE|MULTIAREA
        kind: alt_token
      rule:
        POLYLINE: Polyline
        DIRECTED_POLYLINE: DirectedPolyline
        SURFACE: Surface
        AREA: Area
        MULTIPOLYLINE: Polyline
        MULTISURFACE: Surface
        MULTIAREA: Area
      note: confirmed LineType.Kind enum (Polyline/DirectedPolyline/Surface/Area, kind-values.yml) - exactly
        4 values for 6 grammar alternatives; the MULTI* alternatives collapse onto the same Kind as their
        singular counterpart, distinguished instead by Multi below.
    Multi:
      source:
        field: MULTIPOLYLINE|MULTISURFACE|MULTIAREA
        kind: alt_token
      rule:
        MULTIPOLYLINE: true
        MULTISURFACE: true
        MULTIAREA: true
        absent: false
      note: 'confirmed LineType.own.Multi (BOOLEAN, 0..1) - true for the 3 MULTI* alternatives, false
        otherwise; structural match confirmed (4 Kind values x optional Multi flag = 6 grammar alternatives
        feasible + DIRECTED sub-flag).

        `presence: true` replaced by `kind: alt_token` + an explicit `rule:`: a composite `field`
        (containing "|") always triggers the engine''s alt branch (`resolve_source`, "|" in field) before
        `presence: true` is ever consulted (per source_resolver.py: the `if kind in ALT_KINDS or "|" in
        field:` check comes before the `if source.get("presence")` check much lower down) - `Multi` would
        otherwise receive the matched token''s literal text ("MULTIPOLYLINE"/"MULTISURFACE"/"MULTIAREA", a
        non-empty string - always accidentally `bool()`-truthy, so never
        noticed via `validate.py`, which only does `bool(getattr(...))`) instead of `True`, and raised a
        `warnings.warn` on every SINGULAR LineType (bare POLYLINE/SURFACE/AREA, none of the group''s
        alternatives present, no `rule_map`/"absent" to silently absorb that case). Same explicit
        mechanism (`alt_token`+`rule`) as `Kind` above, now with `absent: false` provided (Multi is False
        rather than a `warnings.warn` on every construction).

        '
    _directed_flag:
      source:
        field: DIRECTED
        presence: true
      note: optional DIRECTED token before POLYLINE/MULTIPOLYLINE dispatches Kind=DirectedPolyline vs
        Polyline (see Kind rule above) - not a separate attribute.
    MaxOverlap:
      source:
        field: intersectionDef
        index: 0
        optional: true
      note: 'confirmed LineType.own.MaxOverlap (TEXT, 0..1) - fed by the optional intersectionDef() clause
        (WITHOUT OVERLAPS > Dec), see intersectionDef binding below. `optional: true` added: this note
        already documented it as optional, but the flag itself was missing (e.g. "Line = POLYLINE WITH
        (STRAIGHTS, ARCS) VERTEX Coord2;" with no WITHOUT OVERLAPS clause, CHBase_Part1_GEOMETRY_V2.ili).

        '
    CoordType:
      source:
        field: controlPoints
        optional: true
      association: LineCoord
      role: CoordType
      note: 'LineCoord (LineType <-> CoordType, 0..1) stayed unattached since the controlPoints binding
        was first written (an earlier note already documented it as the target, but no code actually did
        it - LineType.CoordType stayed None, including on "Line = POLYLINE WITH (STRAIGHTS, ARCS) VERTEX
        Coord2;", CHBase_Part1_GEOMETRY_V1.ili). `controlPoints()` is now a 5th special case (see
        InterlisModelBuilder._build_control_points_ref) that produces a ForwardRef resolved via the
        generic mechanism already in place for any ForwardRef attached via association+role
        (`_apply_one_binding`) - no nested construction (`target:`) is needed here, `controlPoints` itself
        has no own metamodel class.

        '
numeric:
  grammar:
    rule: numeric
  kind: Container
  attribute_bindings:
    Min:
      source:
        child_index: 0
      note: 'numeric() has 4 mutually exclusive range forms: (Number DOTDOT Number) | (Number DOTDOT PosNumber)
        | (PosNumber DOTDOT PosNumber) | (Dec DOTDOT Dec). The first operand of whichever alternative
        matched feeds NumType.Min.

        `field: Number|PosNumber|Dec, index: 0, kind: alt_rule` replaced by `child_index: 0` - a real bug
        found on `ili_corpus/CHBase_Part1_GEOMETRY_V1.ili` (`Coord2 = COORD 460000.000 .. 870000.000 [m]
        {CHLV03[1]}, ...`): the alt_rule mechanism (`ca.has_accessor` + index) was fooled by the
        `PosNumber` of the optional REFSYS clause (`{CHLV03[1]}`, unrelated to the range) whenever the
        actual alternative taken was ''Dec DOTDOT Dec'' - `ctx.PosNumber(0)` returned that PosNumber
        (has_accessor only tests whether the METHOD exists, not this specific occurrence) instead of
        None, so Min wrongly resolved to ''1'' (the refsys index) instead of ''460000.000''. Confirmed by
        direct introspection of the real ANTLR tree: all 4 numeric() alternatives are always of the form
        ''operand DOTDOT operand'' at child positions 0/1/2 (DOTDOT always at 1), regardless of the
        alternative - `child_index` reads that position directly, immune to any accessor-name ambiguity
        with an unrelated pattern elsewhere in the same ctx. Found while building the geometry validation
        in schema.coord_axes/validate.py that actually consumes NumType.Min/Max on real data (previously
        invisible: Max, computed second, happened to fall back correctly to Dec for lack of a 2nd
        refsys PosNumber, masking that Min was already wrong).

        '
    Max:
      source:
        child_index: 2
      note: 'Second operand of the matched range alternative, feeds NumType.Max. Same reason as Min above
        (child_index=2, DOTDOT always being child 1 between the two operands); Max itself was already
        correct in practice (fell back to Dec by accident, for lack of a 2nd refsys PosNumber), but also
        switches to `child_index` for consistency/robustness (the alt_rule mechanism remains just as
        fragile for Max against a future unrelated pattern).'
    Circular:
      source:
        field: CIRCULAR
        presence: true
    Clockwise:
      source:
        field: CLOCKWISE|COUNTERCLOCKWISE
        kind: alt_token
        optional: true
      rule:
        CLOCKWISE: true
        COUNTERCLOCKWISE: false
      note: 'Optional, mutually exclusive with each other; absent when neither is present (NumType.Clockwise
        is itself optional per multiplicity {0..1} confirmed in ilismeta16-classes.yml/check_mapping.py
        output). The `optional: true` structural flag was missing even though this same note already
        described that behavior - added to match.

        '
    Unit:
      source:
        field: unitRef
        optional: true
      note: '"[ Unit ]" clause (LSBR unitRef RSBR). Confirmed via the IlisMeta16 metamodel PDF (INTERLIS
        2 - Metamodel, edition 2022-06-17): "ASSOCIATION NumUnit = Num -- NumType; Unit (EXTERNAL) --
        {0..1} Unit;". Feeds the NumUnit association''s Unit role, not an own NumType attribute.

        '
    _refsys_clause:
      target: IlisMeta16.ModelData.NumsRefSys
      note: '"{ Name [PosNumber] }"/"< Name >" (a bare token, inside numeric() itself) is equivalent to
        refSys() (LCBR metaObjectRef.../domainRef... RCBR/GT -> NumsRefSys.RefSys+Axis) - a grammar
        duplication/artifact (ANTLR4 adaptivePredict, no semantic justification), but semantically
        identical either way: NumsRefSys.RefSys (resolved as a
        MetaObjectDef if "{}", as a CoordType if "<>", by simple Name lookup, exactly as
        metaObjectRef()/domainRef() would in their simplest unqualified form) and NumsRefSys.Axis (the
        optional PosNumber). ModelBuilder treats an inline LCBR/LT+Name+RSBR/GT inside numeric() itself
        exactly like a refSys() whose Name is already resolved (no qualification possible on this path -
        only a simple Name, never Name.Name or INTERLIS.Name, consistent with numeric()''s inline clause
        having only a single Name field with no DOT). Full investigation history (5 test cases, ANTLR
        trees): docs/dev-notes/numeric-refsys-clause-investigation.md.

        '
      RefSys:
        source:
          field: Name
        note: resolved as metaObjectRef() (if LCBR) or domainRef() (if LT) would for a simple unqualified
          Name - same NumsRefSys.RefSys target as refSys().
      Axis:
        source:
          field: PosNumber
          optional: true
        note: feeds NumsRefSys.Axis (AxisInd), identical to refSys().Axis - only present in numeric()''s
          LCBR branch (the LT+axis case always goes through refSys(), see test F).
    _trailing_lt_name_gt:
      note: 'Merged with _refsys_clause above: "< Name >" is the same case documented in _refsys_clause
        (the LT branch without an axis, absorbed by numeric()''s inline clause). Kept as a distinct key so
        as not to lose the reference; see _refsys_clause for the full binding, and
        docs/dev-notes/numeric-refsys-clause-investigation.md for the investigation.

        '
  note: No direct IlisMeta16 instance expected. Min..Max numeric range with optional [unitRef] and CIRCULAR
    flag; feeds NumType.Min/Max/Circular on the enclosing NumType (created by numericType). Numeric types
numericConst:
  grammar:
    rule: numericConst
  kind: Container
  attribute_bindings:
    Value:
      source:
        field: decConst
      note: 'decConst() result feeds the parent Constant.Value (decConst
        with an optional [unitRef]; feeds Constant.Value).

        '
    Unit:
      source:
        field: unitRef
        optional: true
      note: 'Optional "[ unitRef ]" suffix, analogous to the "[ Unit ]" clause in numeric() (NumUnit association),
        here applied to a constant rather than a domain range.

        '
  note: No direct IlisMeta16 instance expected. decConst with an optional [unitRef]; feeds Constant.Value
    (Type=Numeric) on the enclosing Constant.
numericType:
  grammar:
    rule: numericType
  kind: Instance
  target: IlisMeta16.ModelData.NumType
  attribute_bindings:
    Min:
      source:
        field: numeric
        path: Min
        optional: true
      note: Delegates to the embedded numeric() rule's Min binding, when numeric() is present.
    Max:
      source:
        field: numeric
        path: Max
        optional: true
      note: Delegates to the embedded numeric() rule's Max binding, when numeric() is present.
    Circular:
      source:
        field: CIRCULAR
        presence: true
      note: 'numericType() has 5 mutually exclusive alternatives dispatched by ANTLR lookahead (state
        1109); CIRCULAR can appear either directly at the numericType level (alternatives 2 and 4, after
        numeric()) - both resolve to the same NumType.Circular attribute as the CIRCULAR handled inside
        numeric() itself (see numeric() binding). ModelBuilder should treat presence at either grammar
        position identically.

        '
    Clockwise:
      source:
        field: CLOCKWISE|COUNTERCLOCKWISE
        kind: alt_token
        optional: true
      rule:
        CLOCKWISE: true
        COUNTERCLOCKWISE: false
      note: 'Same semantics as the Clockwise handling inside numeric() (alternative 5 of numericType()
        places CLOCKWISE/ COUNTERCLOCKWISE directly after numeric() rather than inside it).

        '
    Unit:
      source:
        field: LSBR
        unitRef: null
        RSBR: null
        optional: true
      note: '"[ unitRef ]" clause appearing directly at the numericType level (alternatives 3 and 4).
        Same NumUnit association target as the equivalent clause inside numeric().

        '
    RefSys:
      source:
        field: refSys
        optional: true
      note: 'Alternative 5 allows a refSys() rule directly after numeric() as an alternative to CLOCKWISE/COUNTERCLOCKWISE.
        See the separate refSys binding; feeds the same NumsRefSys association as the "{ Name [ PosNumber
        ] }" inline clause inside numeric().

        '
oIDType:
  grammar:
    rule: oIDType
  kind: Conditional
  when_present:
    numeric:
      target: IlisMeta16.ModelData.NumType
    textType:
      target: IlisMeta16.ModelData.TextType
  default:
    target: IlisMeta16.ModelData.AnyOIDType
  attribute_bindings:
    _dispatch:
      note: '"OID (ANY | numeric | textType)" or "UUIDOID" (4 forms). "OID numeric" delegates to numeric()
        (builds a NumType with Min/Max/Circular/Clockwise/Unit); "OID textType" delegates to textType()
        (builds a TextType with Kind/MaxLength) - no restriction is lost: the numeric/text restriction is
        carried by the built NumType/TextType, not by a hypothetical AnyOIDType attribute. "OID ANY" and
        "UUIDOID" build a bare AnyOIDType (own={} - a pure marker, confirmed exhaustively in both the
        source XMI and ilismeta16-classes.yml); no ANY/UUIDOID distinction is carried (AnyOIDType has
        structurally no room for such a flag) - not_applicable confirmed for this specific distinction.
        ModelBuilder dispatches on the matched grammar alternative (numeric()/textType() present ->
        NumType/TextType; otherwise -> AnyOIDType), without trying to distinguish ANY from UUIDOID beyond
        this shared construction.

        '
  note: 'oIDType() is not a single constructor (AnyOIDType), it is a DISPATCHER (same family as
    type()/factor()). AnyOIDType.own = {} (no attribute, confirmed via the source XMI
    docs/uml/IlisMeta16-formatted.xmi and ilismeta16-classes.yml) - no room for a numeric/textType
    restriction. And ObjectOID.Oid (the association attaching an OID to a Class,
    ilismeta16-associations.yml) targets the generic `DomainType` type, not specifically AnyOIDType -
    evidence that oIDType()''s 4 alternatives can legitimately produce different DomainType subclasses.
    "OID ANY" and "UUIDOID" build AnyOIDType (the "any" marker, a fitting name); "OID numeric"/"OID
    textType" delegate to numeric()/textType(), which already build NumType/TextType (an existing
    mechanism, reused as-is, no new construction).'
refSys:
  grammar:
    rule: refSys
  kind: Container
  attribute_bindings:
    RefSys:
      source:
        field: metaObjectRef|domainRef
        kind: alt_rule
      note: 'refSys() has 2 mutually exclusive alternatives: "{ metaObjectRef [ PosNumber ] }" or "< domainRef
        [ PosNumber ] >". Confirmed via the IlisMeta16 metamodel PDF (INTERLIS 2 - Metamodel, edition
        2022-06-17): "ASSOCIATION NumsRefSys = NumType -- NumType; RefSys (EXTERNAL) -- {0..1} MetaObjectDef
        OR CoordType; Axis: AxisInd;". metaObjectRef resolves the MetaObjectDef branch, domainRef resolves
        the CoordType branch (CoordType extends DomainType, per ilismeta16-classes.yml). No direct IlisMeta16
        instance is created by refSys() itself (target: null); it feeds the NumsRefSys association end
        RefSys on the enclosing NumType.

        '
    Axis:
      source:
        field: PosNumber
        optional: true
      note: 'Optional in both alternatives; feeds NumsRefSys.Axis (type AxisInd, domain 1..3 per the metamodel
        PDF cited above).

        '
  note: No direct IlisMeta16 instance expected. References a MetaObjectDef (reference system) via metaObjectRef,
    with optional precision (PosNumber) and axis domain (domainRef); feeds the NumsRefSys association.
    Formatted types
rotationDef:
  grammar:
    rule: rotationDef
  kind: Container
  attribute_bindings:
    NullAxis:
      source:
        field: PosNumber
        index: 0
      note: 'Feeds directly into the enclosing coordinateType''s CoordType instance (via path:, see
        coordinateType.NullAxis/PiHalfAxis). coordinateType used to index `field: rotationDef` directly
        with index 0/1, while rotationDef() is itself a SINGLE accessor (0 or 1 occurrence - confirmed
        RotationDefContext has no rule_multi kind for rotationDef on CoordinateTypeContext) - only its
        internal PosNumber (rule_multi, confirmed) is indexable 0/1. That raised a TypeError on any
        coordinateType() with a real ROTATION clause (e.g. CHBase_Part1_GEOMETRY_V2.ili).

        '
    PiHalfAxis:
      source:
        field: PosNumber
        index: 1
      note: Second PosNumber (after MINUS GT) - see NullAxis above for the full context of the fix.
  note: 'No direct IlisMeta16 instance expected. ROTATION <n1> -> <n2>: two numeric values feeding a rotation-related
    attribute of the enclosing element (coordinate system definition context). ||
    rotationDef() = ROTATION PosNumber(0) MINUS GT PosNumber(1), i.e. "ROTATION axisA ->
    axisB" (two 1-based axis indices). No own class (target: null is correct - this rule has no own class/datatype
    instance, it feeds directly two attributes on the ENCLOSING coordinateType''s CoordType instance).
    Confirmed via ilismeta16-classes.yml (CoordType.NullAxis/ PiHalfAxis, both type AxisInd)
    and the INTERLIS 2 Metamodel PDF edition 2022-06-17, section 2.3.1 (p.10) and IDL text: "DOMAIN AxisInd
    = 1..3; CLASS CoordType EXTENDS DomainType = NullAxis: AxisInd; PiHalfAxis: AxisInd; Multi: BOOLEAN;
    END CoordType;" - AxisInd is a 1..3-valued index into CoordType''s ordered Axis list (association
    AxisSpec), exactly matching rotationDef''s two 1-based PosNumber tokens. No separate "Rotation" class/attribute
    exists or is needed - see coordinateType.NullAxis/PiHalfAxis bindings above.'
textConst:
  grammar:
    rule: textConst
  kind: Container
  attribute_bindings:
    Value:
      source:
        field: STRING
      note: 'textConst() has a single alternative matching the STRING token verbatim. No dedicated IlisMeta16
        instance is created ("No direct IlisMeta16 instance expected");
        this raw string value feeds the parent construct''s own Value/Constant handling (e.g. Constant.Value
        via the `constant` rule dispatch).

        '
  note: No direct IlisMeta16 instance expected. Single STRING literal; feeds Constant.Value (Type=Text)
    on the enclosing Constant (created by constant).
textType:
  grammar:
    rule: textType
  kind: Instance
  target: IlisMeta16.ModelData.TextType
  attribute_bindings:
    Kind:
      source:
        field: MTEXT|TEXT|NAME|URI
        kind: alt_token
      rule:
        MTEXT: MText
        TEXT: Text
        NAME: Name
        URI: Uri
      note: 'textType() in InterlisParser.py has 4 mutually exclusive alternatives dispatched on the lookahead
        token (MTEXT, TEXT, NAME, URI); exactly one of the four tokens is present per instance. Values
        confirmed via ilismeta16-kind-values.yml IlisMeta16.ModelData.TextType.Kind: [MText, Text, Name,
        Uri].

        '
    MaxLength:
      source:
        field: PosNumber
        optional: true
      note: 'Only present in the MTEXT and TEXT alternatives, and only when followed by MUL PosNumber
        (e.g. TEXT*20); absent for the NAME and URI alternatives and for MTEXT/TEXT without an explicit
        length. Feeds TextType.MaxLength (type IlisMeta16.ModelData.LengthRange per ilismeta16-classes.yml).
        Note: LengthRange itself has no standalone qualified_name entry in ilismeta16-datatypes.yml/ilismeta16-classes.yml
        - it appears only as a referenced attribute type, not as its own extracted definition; ModelBuilder
        must construct it from the raw PosNumber token value.

        '
  note: Kind resolved dynamically per kind-values.yml (MText/Text/Name/Uri)
type:
  grammar:
    rule: type
  kind: Container
  dispatches_to:
  - attrType
  - baseType
  - classType
  - lineType
  attribute_bindings:
    _dispatch:
      note: 'Pure dispatcher, no own class - 3 alternatives: baseType() (delegates further), lineType()
        (delegates further), or bare ''STRING DOTDOT STRING'' (a text-range domain). The 3rd alternative
        has no confirmed dedicated DomainType subclass distinct from TextType/LengthRange - status unresolved.'
    text_range_alt:
      note: '"''STRING DOTDOT STRING''" (e.g. "a".."z") does occur in real data (CoordSys-20151124.ili:
        "Angle_DMS_90 EXTENDS Angle_DMS = ''-90:00:00.000'' .. ''90:00:00.000'';", where Angle_DMS is
        itself a FORMAT BASED ON ... - a FormattedType). Built via
        `InterlisModelBuilder._build_type_string_range` (same special-case family as
        multi_declaration/enumeration, not the standard declarative mechanism), targeting the same
        `IlisMeta16.ModelData.FormattedType` that `formattedType()` (alternatives 1/3, the exact same
        "STRING DOTDOT STRING" syntax) already targets. `domainDef()` has its own direct alternative for
        this same pattern, but it is grammatically unreachable (ANTLR resolves the ambiguity in favor of
        `type()`) - `_build_type_string_range` is the only real entry point. Background, including a
        broader engine issue this uncovered (`ctx.getAltNumber()` always 0):
        docs/dev-notes/type-string-range-investigation.md.

        '
  note: Primitive and base types
