alignmentType:
  grammar:
    rule: alignmentType
  kind: Container
  attribute_bindings:
    resolved_type:
      source:
        field: HALIGNMENT|VALIGNMENT
        kind: alt_token
      rule:
        HALIGNMENT: INTERLIS.HALIGNMENT
        VALIGNMENT: INTERLIS.VALIGNMENT
      note: 'alignmentType() is a single mandatory choice between the HALIGNMENT and VALIGNMENT tokens;
        it builds no new IlisMeta16 instance, only resolves to a reference to one of the predefined built-in
        enumeration types confirmed in ilismeta16-enumerations.yml (INTERLIS.HALIGNMENT / INTERLIS.VALIGNMENT).
        Consistent with target: null. Feeds the Type association end of whichever construct consumes baseType.

        '
  note: No direct IlisMeta16 instance expected. Selects between the built-in INTERLIS.HALIGNMENT or INTERLIS.VALIGNMENT
    enumeration domains. Boolean types
attributeType:
  grammar:
    rule: attributeType
  kind: Instance
  target: IlisMeta16.ModelData.AttributeRefType
  attribute_bindings:
    Restrictions:
      source:
        field: attrTypeDef
        multi: true
        optional: true
      note: '"(RESTRICTION LPAR attrTypeDef (COMMA attrTypeDef)* RPAR)?" suffix. Confirmed via ilismeta16-associations.yml
        ARefRestriction association: "ARef {0..*} AttributeRefType -- Type {0..*} Type" - each attrTypeDef''s
        resolved type feeds this association''s Type end. AttributeRefType has no own attributes (own:
        {}, confirmed in ilismeta16-classes.yml).

        '
    Of:
      source:
        field: classType
        attributePath: null
        optional: true
      note: 'Lot 19 (phase 2) - CONFIRMÉ par citation IDL directe. RULE #4, Reference Manual eCH-0031
        V2.1.0 (2024-04-24) §3.8.11 "Wertebereiche von Klassen und Attributpfaden", EBNF exacte : `AttributePathType
        = ''ATTRIBUTE'' [''OF'' (ClassType-AttributePath | ''@'' Argument-Name)] [''RESTRICTION'' ''(''
        AttrTypeDef {'';'' AttrTypeDef} '')''].` - texte explicatif : "Es kann verlangt werden, dass es
        zu EINER Klasse (KEINE Subklasse!) gemäss einer anderen Definition gehört (OF)" (il peut être
        exigé que [le chemin] appartienne à UNE SEULE classe - PAS une sous-classe - selon une autre définition).
        Ceci confirme que cette forme resoud TOUJOURS vers UNE SEULE classe (jamais une liste de restriction),
        cohérent avec `ARefOf.Of` (0..1 Class, confirmé ilismeta16-associations.yml) : alimenté par la
        classe de BASE résolue par `classType()` (son `resolved_ref`, pas sa liste `Restrictions` optionnelle).
        `attributePath` lui-même ne feed AUCUN attribut supplémentaire - `AttributeRefType.own = {}` (confirmé
        exhaustivement) : le type ne fixe QUE la classe cible, jamais le nom d''attribut précis (celui-ci
        est fourni plus tard, côté DONNÉE, via `AttributePathConst = ''>>'' [ViewableRef ''->''] Attribute-Name`
        - même distinction type/constante que `ClassType`/`ClassConst` déjà confirmée ailleurs). Décision
        ModelBuilder : ignorer le `DOT attributePath` traînant (aucune cible), alimenter `ARefOf.Of` avec
        la classe de base de `classType()`.

        '
    _at_symbol_name:
      source:
        field: AT_SYMBOL
        Name: null
        optional: true
      status: not_applicable
      note: 'Lot 19 (phase 2) - CONFIRMÉ `not_applicable`. Même citation IDL que `Of` ci-dessus : `''@''
        Argument-Name` - texte explicatif : "im Falle einer Definition einer Funktion... auf ein anderes
        Argument verwiesen werden" (dans le cas d''une définition de fonction, on renvoie vers un AUTRE
        ARGUMENT [formel]). Ceci confirme la nature du mécanisme (référence à un autre paramètre formel
        de la fonction englobante, pas une classe), mais preuve d''ABSENCE exhaustive côté métamodèle
        extrait : `AttributeRefType.own = {}` (aucun attribut du tout, pas seulement pour ce cas) et aucune
        association ne cible un `FormalArgument`/paramètre depuis `AttributeRefType`/`ARefOf` (seule cible
        : `Class`, via `ARefOf`). Absence confirmée, pas une incertitude persistante. Décision ModelBuilder
        : lever un avertissement si `@Name` est rencontré (aucune cible à alimenter).

        '
baseType:
  grammar:
    rule: baseType
  kind: Container
  attribute_bindings:
    _dispatch:
      note: Pure dispatcher, no own class - 13 mutually exclusive alternatives, each delegating to an
        already-bound rule from earlier lots (textType/enumerationType/enumTreeValueType/alignmentType/booleanType/numericType/formattedType/dateTimeType/coordinateType/oIDType/blackboxType/classType/attributeType).
blackboxType:
  grammar:
    rule: blackboxType
  kind: Instance
  target: IlisMeta16.ModelData.BlackboxType
  attribute_bindings:
    Kind:
      source:
        field: BINARY|XML
        kind: alt_token
      rule:
        BINARY: Binary
        XML: Xml
      note: 'blackboxType() has a single alternative: BLACKBOX followed by a mandatory choice between
        BINARY and XML. Values confirmed via ilismeta16-kind-values.yml IlisMeta16.ModelData.BlackboxType.Kind:
        [Binary, Xml].

        '
  note: Class and attribute path types
booleanType:
  grammar:
    rule: booleanType
  kind: Instance
  target: IlisMeta16.ModelData.BooleanType
  note: 'IlisMeta16.ModelData.BooleanType has no own attributes (confirmed via ilismeta16-classes.yml:
    attributes.own: {}); booleanType() matches only the BOOLEAN keyword, a pure marker with no data to
    bind. Presence of this rule is itself the signal to construct a BooleanType instance; no field mapping
    is needed.'
classConst:
  grammar:
    rule: classConst
  kind: Instance
  target: IlisMeta16.ModelData.ClassConst
  attribute_bindings:
    Class:
      source:
        field: viewableRef
      note: '"> viewableRef" (e.g. ">MyClass"). Confirmed via ilismeta16-datatypes.yml: ClassConst is
        a DataType with a single own attribute Class: INTERLIS.NAME (0..1). The resolved viewableRef''s
        qualified name feeds this attribute.

        '
  note: Polyline types
classType:
  grammar:
    rule: classType
  kind: Instance
  target: IlisMeta16.ModelData.ClassRefType
  attribute_bindings:
    _kind_marker:
      source:
        field: CLASS|STRUCTURE
        kind: alt_token
      note: '"CLASS (RESTRICTION LPAR viewableRef (COMMA viewableRef)* RPAR)?" or "STRUCTURE (RESTRICTION
        LPAR classOrStructureRef (COMMA classOrStructureRef)* RPAR)?". ClassRefType has no own attributes
        (own: {}, confirmed in ilismeta16-classes.yml) and inherits from the abstract ClassRelatedType
        (also own: {}), so the CLASS/STRUCTURE keyword itself is not recorded as a value anywhere - it
        only determines which sub-rule (viewableRef vs classOrStructureRef) supplies the restriction entries
        below, i.e. whether the restriction set is constrained to classes or to structures.

        '
    Restrictions:
      source:
        field: viewableRef|classOrStructureRef
        multi: true
        optional: true
      note: 'Entries inside the optional RESTRICTION(...) clause. Confirmed via ilismeta16-associations.yml
        ClassRestriction association: "CRTR {0..*} ClassRelatedType -- ClassRestriction {0..*} Class"
        - each resolved viewableRef/classOrStructureRef feeds the ClassRestriction association''s Class
        end.

        '
    _unrestricted_base:
      status: not_applicable
      note: 'CONFIRME not_applicable (Lot 13, point 5, phase 2). RULE #4 : INTERLIS 2 Reference Manual
        edition 2006-04-13, section 2.8.11 "Domains of classes and attribute paths" (p.45), texte exact
        : "By indicating structure any structure or class, by indicating class (also permissible as extension
        of STRUCTURE) any class (but no structures) are admitted. If only certain structures, resp. classes
        and their extensions are to be admitted, these have to be listed (RESTRICTION)." Ceci confirme
        sans ambiguite que l''absence de RESTRICTION(...) signifie simplement "aucune restriction" (implicitement
        "n''importe quelle Class"/"n''importe quelle Structure ou Class") - AUCUNE reference explicite
        n''est censee etre posee nulle part, ni via ClassRestriction (qui reste a 0 entree, sa multiplicite
        {0..*} le permet explicitement) ni via BaseClass (qui est un mecanisme totalement distinct, sans
        lien avec ce cas de figure - non confirme comme pertinent ici, aucune preuve ne l''y rattache).
        Meme conclusion applicable par analogie au cas equivalent sur attributeType (RESTRICTION(...)
        absent -> Restrictions reste une liste vide, deja traite ainsi sans marqueur unresolved separe).
        Decision ModelBuilder : ne rien construire de plus que l''absence d''entrees dans ClassRestriction/Restrictions
        quand RESTRICTION(...) est absent - c''est la representation correcte et complete de "non restreint".

        '
constant:
  grammar:
    rule: constant
  kind: Instance
  target: IlisMeta16.ModelData.Constant
  discriminant:
    attribute: Type
    dynamic: true
    rule:
      UNDEFINED: Undefined
      numericConst: Numeric
      textConst: Text
      formattedConst: Text
      enumerationConst: Enumeration
  attribute_bindings:
    _dispatch:
      note: '7 mutually exclusive alternatives: UNDEFINED (bare token) or one of 6 sub-rules (numericConst/textConst/formattedConst/enumerationConst/classConst/attributePathConst),
        each already bound in earlier lots (Lots 1-4) with their own DataType targets (ClassConst/AttributePathConst/etc.).'
    Value:
      source:
        field: numericConst|textConst|formattedConst|enumerationConst|classConst|attributePathConst
        kind: alt_rule
      note: confirmed Constant.own.Value (TEXT, mandatory) - raw literal text of whichever sub-constant
        matched; UNDEFINED alternative likely leaves Value unset/sentinel.
    Type:
      source:
        field: null
      note: confirmed Constant.own.Type (Kind enum, mandatory) - dispatched from which of the 7 alternatives
        matched (needs mapping to Constant.Type's enum values, not read in this lot's scope - values not
        yet cross-checked against kind-values.yml).
  note: 'Type resolved dynamically: UNDEFINED -> Undefined, numericConst -> Numeric, textConst/formattedConst
    -> Text, enumerationConst -> Enumeration. classConst/attributePathConst need separate confirmation
    (may not map to Constant.Type at all). Text types'
contextDef:
  grammar:
    rule: contextDef
  kind: Instance
  target: IlisMeta16.ModelData.Context
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: 'inherited Name (MetaElement); IlisMeta16.ModelData.Context has no own attributes (attributes.own:
        {}, confirmed ilismeta16-classes.yml).'
    generic_concrete_pairs:
      note: 'Lot 18 (phase 2, résidus Phase 1) - CONFIRMÉ par nécessité structurelle. Lecture du corps
        compilé (RULE #2bis) confirme la structure exacte : `(domainRef EQ domainRef (OR domainRef)* SEMI)+`
        - une boucle EXTERNE répétée de "pair-groups", chacun avec EXACTEMENT UN domainRef générique (gauche)
        et 1+ domainRefs concrets OR-joints (droite). Résolution de l''ambiguïté précédente ("un seul
        GenericDef pour tout le contextDef, ou un par pair-group ?") : ConcreteForGeneric.GenericDef a
        `target_kind: Unknown` (confirmé ilismeta16-associations.yml) - preuve que `GenericDef` est traité
        comme une CLASSE D''ASSOCIATION réifiée (chaque lien est individuellement référençable, pas juste
        une paire de rôles). Un seul GenericDef partagé par tout le contextDef PERDRAIT l''appariement
        générique/concret (tous les ConcreteForGeneric pointeraient vers le même lien, rendant impossible
        de savoir quels domaines concrets vont avec quel domaine générique) - seule la lecture "un GenericDef
        PAR pair-group" (Context=ce Context, partagé entre tous les pair-groups ; GenericDomain=[le domainRef
        gauche de CE pair-group seulement]) préserve fidèlement l''information source. Chaque domainRef
        droit du même pair-group crée alors un ConcreteForGeneric(GenericDef=ce lien précis, ConcreteDomain=
        domainRef résolu). Hypothèse structurante, pas une citation IDL directe - mais la seule lecture
        qui ne perd pas d''information.

        '
  note: Object identification types
controlPoints:
  grammar:
    rule: controlPoints
  kind: Container
  attribute_bindings:
    _resolution:
      source:
        field: Name
        multi: true
      note: No own class; 'VERTEX Name(DOT Name)*' is an attribute path (structure-nested), resolving
        to a CoordType-typed attribute of the enclosing structure. Feeds the parent lineType's confirmed
        LineCoord association (LineType <-> CoordType, 0..1) - see lineType binding above. The multi-Name
        DOT chain itself is a path resolution akin to attributePath (Lot 7), not a separate class instance.
coordinateType:
  grammar:
    rule: coordinateType
  kind: Instance
  target: IlisMeta16.ModelData.CoordType
  attribute_bindings:
    Multi:
      source:
        field: COORD|MULTICOORD
        kind: alt_token
      rule:
        COORD: false
        MULTICOORD: true
      note: 'Confirmed via the IlisMeta16 metamodel PDF (INTERLIS 2 - Metamodel, edition 2022-06-17):
        CoordType has an own "Multi: BOOLEAN" attribute (also confirmed in ilismeta16-classes.yml).

        '
    Axis:
      source:
        field: numeric|NUMERIC
        kind: alt_rule_or_token
        multi: true
        cardinality: 1..3
      note: '1 to 3 axis definitions, comma-separated, each either a full numeric() range or the bare
        NUMERIC keyword (unrestricted axis). Confirmed via the metamodel PDF: "ASSOCIATION AxisSpec =
        CoordType -- Axis (ORDERED, EXTERNAL) {1..3} NumType;" - each numeric() feeds one ordered NumType
        instance linked via AxisSpec.Axis; a bare NUMERIC keyword (no range/circular/unit) still produces
        a NumType instance (with Min/Max/Circular/Unit left unset).

        '
    NullAxis:
      source:
        field: rotationDef
        path: NullAxis
        optional: true
      note: 'CONFIRME (Lot 13, point 2, phase 2). Correction : la piste precedente (clauses internes a
        numeric()) est abandonnee - la vraie source est le rotationDef() de coordinateType lui-meme (voir
        binding rotationDef ci-dessous). Le premier PosNumber de "ROTATION PosNumber -> PosNumber" alimente
        NullAxis (type AxisInd = domaine 1..3, ilismeta16-classes.yml/metamodel PDF section 2.3.1). Les
        clauses "{ Name [PosNumber] }"/"< Name >" de numeric() restent une question separee (point 3,
        Lot 14 - NumsRefSys-like, non concernees par ce point).
        CORRIGE (audit corpus reel models.geo.admin.ch, 2026-08-03) : `field: rotationDef, index: 0`
        indexait a tort l''accesseur rotationDef() lui-meme (single, 0 ou 1 occurrence) au lieu de son
        PosNumber interne -> `path: NullAxis` delegue desormais a la regle rotationDef (voir ci-dessous,
        qui expose elle-meme NullAxis/PiHalfAxis via son propre PosNumber indexe).

        '
    PiHalfAxis:
      source:
        field: rotationDef
        path: PiHalfAxis
        optional: true
      note: 'CONFIRME (Lot 13, point 2) - meme rotationDef() que NullAxis ci-dessus ; le second PosNumber
        (apres MINUS GT) alimente PiHalfAxis (AxisInd). CORRIGE (audit corpus reel, 2026-08-03) - meme
        correctif que NullAxis (path au lieu d''index direct sur rotationDef).

        '
    _rotation_via_rotationDef:
      note: 'Precision : il n''existe PAS d''attribut/association "Rotation" separe sur CoordType (confirme,
        ilismeta16-classes.yml : seuls NullAxis/PiHalfAxis/Multi en own) - rotationDef() alimente DIRECTEMENT
        NullAxis+PiHalfAxis ci-dessus, il n''y a rien de plus a chercher sous le nom "Rotation".

        '
dateTimeType:
  grammar:
    rule: dateTimeType
  kind: Container
  attribute_bindings:
    resolved_type:
      source:
        field: DATE|TIMEOFDAY|DATETIME
        kind: alt_token
      rule:
        DATE: INTERLIS.GregorianDate
        TIMEOFDAY: INTERLIS.TimeOfDay
        DATETIME: INTERLIS.GregorianDateTime
      note: 'dateTimeType() has 3 mutually exclusive single-token alternatives; none builds a new IlisMeta16
        instance. Each resolves to a reference to a predefined built-in INTERLIS datatype, confirmed in
        ilismeta16-datatypes.yml under the INTERLIS.* namespace (not IlisMeta16.ModelData.*). Consistent
        with target: null in grammar-metamodel-mapping.yml. The resolved qualified_name feeds whichever
        parent construct consumes baseType (attrType/attrTypeDef Type association end).

        '
  note: No direct IlisMeta16 instance expected. Selects one of the built-in INTERLIS date/time primitives
    (INTERLIS.GregorianDate / INTERLIS.TimeOfDay / INTERLIS.GregorianDateTime), not a ModelData class.
    Coordinate and geometry types
decConst:
  grammar:
    rule: decConst
  kind: Container
  attribute_bindings:
    resolved_value:
      source:
        field: Dec|LNBASE|PI|PosNumber
        kind: alt_token_or_rule
      note: 'decConst() is a single mandatory choice among 4 forms: a Dec literal, a PosNumber literal,
        or one of the two named mathematical constant keywords LNBASE (natural log base e) or PI. No dedicated
        IlisMeta16 instance is created (target: null); this resolved numeric value feeds the parent construct''s
        own numeric value (e.g. numericConst -> Constant via the constant dispatch, or a plausibilityConstraint
        bound used as numericConst).

        '
  note: No direct IlisMeta16 instance expected. Numeric literal, or PI/LNBASE built-in constant; feeds
    the enclosing numericConst/Constant.Value.
domainDef:
  grammar:
    rule: domainDef
  kind: Container
  multi_declaration: true
  parent:
    association: PackageElements
    role: Element
  note: 'No fixed target: IlisMeta16.ModelData.DomainType is abstract (isAbstract=true in the XMI). The
    concrete instantiated subclass is resolved by the type_ dispatcher (-> textType/numericType/ booleanType/enumerationType/coordinateType/lineType/classType/
    attributeType/oIDType/blackboxType), each already individually mapped with its own qualified_name.
    CORRIGE (audit corpus reel models.geo.admin.ch, 2026-08-03) : domainDef() n''est PAS "une seule
    declaration de domaine" mais boucle grammaticalement (confirme sur le code genere reel,
    InterlisParser.py, boucle while _alt!=2) sur N declarations partageant un seul mot-cle DOMAIN (ex.
    "DOMAIN\n  Code = 0..255;\n  MultRange = 0..2147483647;\n  LengthRange EXTENDS MultRange =
    1..2147483647;", models/IlisMeta16.ili), chacune avec son PROPRE Name + exactement une alternative de
    contenu parmi 3 SOEURS DIRECTES - `type_()`, `numeric()` nu, `enumeration()` nu (confirme : la_==1
    type_(), la_==2 numeric(), la_==3 enumeration() - PAS des alternatives imbriquees dans type_()).
    Aucun mecanisme generique existant (bag/for_each) ne correle plusieurs accesseurs DIFFERENTS a la
    MEME position parmi N occurrences - `multi_declaration: true` delegue entierement a
    InterlisModelBuilder._build_multi_declaration (model_builder.py), qui decoupe ctx.children par
    position (delimiteur SEMI, un token par declaration) plutot que par nom d''accesseur : pour chaque
    segment, retrouve son propre Name/MANDATORY et sa propre alternative de contenu (type_() deja visite
    normalement, numeric()/enumeration() nus enveloppes en NumType/EnumType via le meme mecanisme
    `wrap:`/visit_wrapped que attrTypeDef.Type, Lot 19) - meme cas particulier reconnu que topicDef
    (_build_multi_target, seul autre cas special parmi les 121 regles). N''utilise PAS
    attribute_bindings (ignore par cette strategie) - STRING DOTDOT STRING / CLASS RESTRICTION(...)
    restent non mappes (pas de cible metamodele connue), silencieusement ignores comme avant.
    || No fixed target: DomainType is abstract. Concrete class resolved by type_ dispatcher (see grammar-metamodel-mapping.yml
    comment).'
domainRef:
  grammar:
    rule: domainRef
  kind: Reference
  target: IlisMeta16.ModelData.DomainType
  resolves_to:
  - DomainType
  - Class
  attribute_bindings:
    _resolution:
      note: 'Pure reference resolution: qualified name (Name (DOT Name)*)? Name, or ''INTERLIS DOT Name''
        for predefined domains - resolves to an existing IlisMeta16.ModelData.DomainType subclass instance
        by qualified_name; no own attributes constructed (DomainType itself is abstract, own: {Mandatory}
        inherited by all concrete subclasses already bound in earlier lots).'
  note: 'Type dispatching. resolves_to: [DomainType, Class] ajoute (audit corpus reel, 2026-08-03) :
    domainRef() est syntaxiquement indistinguable d''un structureRef/classRef pour un simple nom qualifie
    (l''ambiguite grammaticale INTERLIS classique domaine/structure/classe) - confirme sur
    models/IlisMeta16.ili ("Multiplicity: Multiplicity;", l''attribut ET le TYPE partagent le nom
    "Multiplicity", qui est en realite une STRUCTURE/Class, pas un DomainType). Sans le hint "Class" en
    repli, l''ambiguite avec d''autres entites homonymes (ex. un attribut nomme pareil ailleurs) restait
    non resolue meme quand la vraie cible (la Class) etait un candidat unique parmi les candidats
    filtres.

    '
enumElement:
  grammar:
    rule: enumElement
  kind: Instance
  target: IlisMeta16.ModelData.EnumNode
  parent:
    association: TopNode
    role: TopNode
  attribute_bindings:
    Name:
      source:
        field: BASKET|LOCAL|Name
        index: 0
        kind: alt_token_or_rule
      note: 'enumElement() = (BASKET|LOCAL|Name) (DOT Name)* enumeration()?. The first segment is matched
        as BASKET, LOCAL, or Name (the grammar explicitly allows the reserved words BASKET/LOCAL to also
        serve as an enum element''s literal identifier text here). EnumNode has no own attributes beyond
        inherited Name/ Documentation (confirmed: ilismeta16-classes.yml, EnumNode attributes.own: {}).

        '
    _dotted_path:
      source:
        field: DOT
        Name: null
        multi: true
        optional: true
      note: 'Lot 19 (phase 2) - CONFIRMÉ par citation IDL directe. RULE #4, Reference Manual eCH-0031
        V2.1.0 (2024-04-24) §3.8.2 "Aufzählungen", EBNF exacte : `EnumElement = EnumElement-Name {''.''
        EnumElement-Name} [Sub-Enumeration].` - texte explicatif determinant : "Im Rahmen von Neudefinitionen
        von Aufzählungen (Primärdefinition, zusätzliche Elemente einer Erweiterung) darf das EnumElement
        nur aus EINEM Namen bestehen. Mehrere Namen sind nur zulässig, um für eine Erweiterung ein BISHERIGES
        Aufzählungselement zu IDENTIFIZIEREN." (dans le cadre de (re)définitions d''énumérations - définition
        primaire, éléments additionnels d''une extension - l''EnumElement ne peut consister QUE d''UN
        SEUL nom. Plusieurs noms ne sont autorisés QUE pour IDENTIFIER, dans une extension, un élément
        d''énumération DÉJÀ EXISTANT). Ceci tranche définitivement l''hypothèse précédente : le chemin
        pointé NE crée PAS de chaîne de nouveaux `EnumNode` - il NAVIGUE à travers des `EnumNode` déjà
        existants (via l''association `SubNode`, même mécanisme que `Children`) pour identifier le nœud-feuille
        à étendre ; seul le DERNIER segment (units) peut porter une `enumeration()` imbriquée ajoutant
        de VRAIS nouveaux enfants à ce nœud résolu. ModelBuilder : résoudre chaque segment successif via
        `SubNode` (Name du premier segment = EnumNode top-level à trouver dans l''EnumType existant ;
        chaque segment suivant = un `SubNode` de plus en descendant), sans construire de nouvelle instance
        pour les segments intermédiaires - seule la construction finale (`Children`) crée de nouveaux
        `EnumNode`.

        '
    Children:
      source:
        field: enumeration
        optional: true
      note: 'Optional nested enumeration() defines this node''s children (a sub-list of enumElement, e.g.
        "Warm(Red,Orange,Yellow)"), each of which becomes a child EnumNode of this one via the SubNode
        association (ParentNode=this node, Node=child; confirmed in ilismeta16-associations.yml: "SubNode
        = ... ParentNode {0..1} EnumNode -- Node {0..*} EnumNode (composite)"). This is a DIFFERENT use
        of enumeration() than the domain-restriction use noted on the enumeration binding itself - here
        it defines new child nodes rather than restricting an existing domain.

        '
    _parent_association_dispatch:
      note: 'RESOLU (Lot 12, phase 2) : le parent: {association: TopNode, role: TopNode} declare au niveau
        de la regle n''est correct QUE pour les instances enumElement directement sous enumerationType()/enumeration()
        au sommet d''un EnumType neuf (TopNode: EnumType {0..1} -- TopNode {1} EnumNode, confirme dans
        ilismeta16-associations.yml). Pour les instances enumElement apparaissant DANS le enumeration()
        imbrique d''un autre enumElement (cf. Children ci-dessus), l''association correcte est SubNode
        (ParentNode=le EnumNode englobant), pas TopNode. Directive d''implementation ModelBuilder : dispatcher
        sur la profondeur d''imbrication au moment de la construction ; une seule regle grammaticale sert
        les deux cas selon le contexte d''appel.

        '
enumTreeValueType:
  grammar:
    rule: enumTreeValueType
  kind: Container
  attribute_bindings:
    ET:
      source:
        field: domainRef
      note: '"ALL OF domainRef". Per grammar-metamodel-mapping.yml, no direct IlisMeta16 instance is created
        here; the resolved domainRef (an EnumType) feeds the TreeValueTypeOf association''s ET end (confirmed
        in ilismeta16-associations.yml: "TreeValueTypeOf = ETVT {0..*} EnumTreeValueType -- ET {1} EnumType").
        The EnumTreeValueType instance itself (own: {} - no own attributes, confirmed in ilismeta16-classes.yml)
        is constructed by the enclosing rule (e.g. attrTypeDef/attrType dispatch).

        '
  note: 'No direct IlisMeta16 instance expected. "ALL OF domainRef": designates the domain feeding the
    TreeValueTypeOf association''s ET end (IlisMeta16.ModelData.EnumType); the EnumTreeValueType instance
    itself is created elsewhere.'
enumeration:
  grammar:
    rule: enumeration
  kind: Container
  attribute_bindings:
    Elements:
      source:
        field: enumElement
        multi: true
      note: 'Each enumElement -> EnumNode instance (same TopNode/SubNode construction as in enumerationType).
        Per grammar-metamodel-mapping.yml, enumeration() is "a restriction/extension list of an existing
        enumeration domain, not a new EnumType declaration", so these EnumNode instances restrict/extend
        the referenced base EnumType''s node tree rather than populating a freshly-created EnumType.

        '
    Final:
      source:
        field: FINAL
        presence: true
      note: "CONFIRME (Lot 16, sous-groupe enumeration/enumElement). RULE #4, Reference Manual eCH-0031\
        \ V2.1.0 (2024-04-24) §3.8.2, EBNF exact : \"EnumerationType = Enumeration ['ORDERED'|'CIRCULAR'].\
        \ Enumeration = '(' EnumElement {',' EnumElement} [':' 'FINAL'] ')'. EnumElement = EnumElement-Name\
        \ {...} [Sub-Enumeration].\" -> notre regle .g4 enumeration() fusionne Enumeration ET le suffixe\
        \ [ORDERED|CIRCULAR] de EnumerationType en UNE seule regle (constat structurel, pas un bug - le\
        \ suffixe reste optionnel et bien place). La cible depend du POINT D'APPEL, deja pressenti par\
        \ la note \"anonymous EnumType\" de attrType (Lot 5, dispatch attrType/enumeration/numeric/NUMERIC)\
        \ : - Appel SOMMET (depuis attrType - lui-meme depuis domainDef ou\n  roleDef alt2 - \"Name COLON\
        \ MANDATORY? (attrTypeDef|\n  enumeration|numeric|constraintDef) SEMI\") : enumeration()\n  EST\
        \ l'equivalent du EnumerationType officiel pour ce type\n  anonyme -> construit une IlisMeta16.ModelData.EnumType\
        \ neuve\n  (meme target que enumerationType(), Lot 13), Final =\n  EnumType.Final (herite d'ExtendableME,\
        \ confirme\n  ilismeta16-classes.yml).\n- Appel IMBRIQUE (comme Sub-Enumeration optionnelle de\n\
        \  enumElement : '(enumeration)?') : NE cree PAS de nouvel\n  EnumType (confirme par l'exemple\
        \ officiel du manuel :\n  'JoursSemaine = (JoursOuvrables (lundi,mardi,...), dimanche)\n  CIRCULAR;'\
        \ - le CIRCULAR final s'applique au SEUL EnumType de\n  JoursSemaine, la sous-liste '(lundi,mardi,...)'\
        \ de\n  JoursOuvrables n'en cree pas un second) ; Final ici marque a\n  la place l'EnumNode ENGLOBANT\
        \ (celui dont ce Sub-Enumeration\n  liste les enfants) comme non extensible plus loin -\n  EnumNode.Final\
        \ (egalement herite d'ExtendableME, confirme\n  ilismeta16-classes.yml) - meme attribut Final,\
        \ cible\n  different selon le niveau d'imbrication.\n"
    Order:
      source:
        field: CIRCULAR|ORDERED
        presence: true
      rule:
        neither: Unordered
        ORDERED: Ordered
        CIRCULAR: Circular
      note: 'CONFIRME pour l''appel SOMMET (Lot 16) : meme mecanisme que enumerationType.Order (Lot 13,
        valeurs Unordered/Ordered/ Circular, ilismeta16-kind-values.yml) - cible EnumType.Order (own,
        mandatory). Pour l''appel IMBRIQUE (Sub-Enumeration d''un enumElement) : status not_applicable
        de fait - EnumNode n''a AUCUN attribut Order (verifie ilismeta16-classes.yml, own: {} + herite
        d''ExtendableME seulement) et le Reference Manual confirme que le suffixe [ORDERED|CIRCULAR] appartient
        exclusivement a EnumerationType, jamais a Sub-Enumeration (''Sub-Enumeration'' = ''Enumeration'',
        sans suffixe, dans l''EBNF officiel) - si ce token est neanmoins rencontre a un niveau imbrique
        dans ce projet (grammaire legerement permissive par rapport au spec, cf. grammar-divergences.md),
        ModelBuilder doit l''ignorer (pas de cible metamodele a ce niveau).

        '
  note: No direct IlisMeta16 instance expected. "(el1, el2, ...)" restriction/extension list of an existing
    enumeration domain, not a new EnumType declaration (see enumerationType for that). || 4, Reference
    Manual eCH-0031 V2.1.0 (2024-04-24) §3.8.2, EBNF
