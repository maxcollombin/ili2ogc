    Max:
      source:
        field: Number|PosNumber|Dec
        index: 1
        kind: alt_rule
      note: Second operand of the matched range alternative, feeds NumType.Max.
    Circular:
      source:
        field: CIRCULAR
        presence: true
    Clockwise:
      source:
        field: CLOCKWISE|COUNTERCLOCKWISE
        kind: alt_token
        optional: true
      rule:
        CLOCKWISE: true
        COUNTERCLOCKWISE: false
      note: 'Optional, mutually exclusive with each other; absent when neither is present (NumType.Clockwise
        is itself optional per multiplicity {0..1} confirmed in ilismeta16-classes.yml/check_mapping.py
        output). CORRIGE (audit smoke test ModelBuilder, 2026-08-02) : le flag structure `optional: true`
        manquait alors que cette meme note le decrit deja - ajoute pour correspondre.

        '
    Unit:
      source:
        field: unitRef
        optional: true
      note: '"[ Unit ]" clause (LSBR unitRef RSBR). Confirmed via the IlisMeta16 metamodel PDF (INTERLIS
        2 - Metamodel, edition 2022-06-17): "ASSOCIATION NumUnit = Num -- NumType; Unit (EXTERNAL) --
        {0..1} Unit;". Feeds the NumUnit association''s Unit role, not an own NumType attribute.

        '
    _refsys_clause:
      target: IlisMeta16.ModelData.NumsRefSys
      note: 'CONFIRME (Lot 14, point 3, phase 2). Tranche par test EMPIRIQUE de parsing (RULE #4, meme
        technique que le point 11) : la question etait de savoir si "{ Name [PosNumber] }"/"< Name >"
        (bare token, dans numeric() lui-meme) est bien equivalent a refSys() (LCBR metaObjectRef.../domainRef...
        RCBR/GT, deja confirme -> NumsRefSys.RefSys+Axis). Confirme par lecture du code compile (RULE
        #2/#3) : numericType() (PAS numeric()) a son PROPRE accesseur refSys() distinct - sa 5e alternative
        est exactement "NUMERIC numeric() (CLOCKWISE|COUNTERCLOCKWISE| refSys())?", ce qui correspond
        mot pour mot a l''EBNF officiel du Reference Manual 2006-04-13 §2.8.5 : "NumericType = (Min-Dec
        ''..'' Max-Dec | ''NUMERIC'') [''CIRCULAR''] [''['' UnitRef '']''] [''CLOCKWISE''|''COUNTERCLOCKWISE''|RefSys]."
        - refSys() (deja confirme, metaObjectRef()/domainRef()) EST la vraie implementation de cette clause
        finale ; le "{Name[PosNumber]}"/ "<Name>" DANS numeric() lui-meme est un DOUBLON/artefact de grammaire
        (probablement introduit lors de la redefinition post 2.4 en recopiant la forme de refSys() a l''interieur
        de numeric() sans remarquer que numericType() appelle deja refSys() separement). Test empirique
        (5 cas, extraits .ili minimaux parses via antlr4-python3-runtime) : la REPARTITION entre les deux
        chemins est asymetrique et dépend de la presence de l''index d''axe ET du type de crochet - "{Name}"
        (sans axe) et "<Name[N]>" (avec axe) passent par refSys() separement (arbre : (numericType NUMERIC
        (numeric ...) (refSys {...}/<...>))) ; "<Name>" (sans axe) et "{Name[N]}" (avec axe) sont a l''inverse
        absorbes par la clause interne de numeric() lui-meme (arbre : (numeric ... {...}/<...>) sans noeud
        refSys separe). Cette asymetrie n''a AUCUNE justification semantique claire - c''est un artefact
        deterministe de resolution d''ambiguite par adaptivePredict d''ANTLR4, pas une distinction voulue
        par le langage. CONCLUSION : peu importe lequel des deux chemins absorbe le texte source, la SEMANTIQUE
        est identique dans les 4 cas - NumsRefSys.RefSys (resolu comme un MetaObjectDef si "{}", comme
        un CoordType si "<>", par simple recherche du Name, EXACTEMENT comme metaObjectRef()/domainRef()
        le feraient dans leur forme la plus simple - non qualifiee) et NumsRefSys.Axis (le PosNumber optionnel).
        Decision ModelBuilder : quand numeric() lui-meme contient un LCBR/LT+Name+RSBR/GT (sans passer
        par refSys()), traiter cette clause EXACTEMENT comme un refSys() dont le Name est deja resolu
        (pas de qualification possible dans ce chemin - seul un Name simple, jamais Name.Name ni INTERLIS.Name,
        voir test D/E qui confirment qu''un Name QUALIFIE force TOUJOURS le passage par refSys()/metaObjectRef()/domainRef()
        - coherent avec le fait que la clause interne de numeric() n''a qu''un seul champ Name sans DOT).

        '
      RefSys:
        source:
          field: Name
        note: resolu comme metaObjectRef() (si LCBR) ou domainRef() (si LT) le ferait pour un Name simple
          non qualifie - meme cible NumsRefSys.RefSys que refSys().
      Axis:
        source:
          field: PosNumber
          optional: true
        note: feeds NumsRefSys.Axis (AxisInd), identique a refSys().Axis - present uniquement dans la
          branche LCBR de numeric() (le cas LT+axis passe systematiquement par refSys(), voir test F).
    _trailing_lt_name_gt:
      note: 'FUSIONNE avec _refsys_clause ci-dessus (Lot 14, point 3) : "< Name >" est le meme cas que
        documente dans _refsys_clause (branche LT sans axe, absorbee par la clause interne de numeric()
        - voir test C). Conserve comme cle distincte uniquement pour ne pas perdre la reference historique
        du point transversal ; voir _refsys_clause pour le binding complet.

        '
  note: No direct IlisMeta16 instance expected. Min..Max numeric range with optional [unitRef] and CIRCULAR
    flag; feeds NumType.Min/Max/Circular on the enclosing NumType (created by numericType). Numeric types
numericConst:
