        ET ilismeta16-classes.yml) ; aucune distinction ANY/UUIDOID n''est portée (AnyOIDType n''a structurellement
        aucune place pour un tel flag) - CONFIRMÉ `not_applicable` pour cette distinction spécifique (pas
        juste "dropped by design" hypothétique : preuve exhaustive obtenue). Décision ModelBuilder : dispatcher
        sur l''alternative grammaticale matched (numeric()/textType() présent -> NumType/TextType ; sinon
        -> AnyOIDType), sans chercher à distinguer ANY de UUIDOID au-delà de cette construction commune.

        '
  note: 'Lot 18 (phase 2, résidus Phase 1) - correction : oIDType() n''est PAS un constructeur unique
    (AnyOIDType), c''est un DISPATCHER (meme famille que type()/factor()). Preuve (RULE #1) : AnyOIDType.own
    = {} (aucun attribut, confirme via le XMI source docs/uml/IlisMeta16-formatted.xmi ET ilismeta16-classes.yml)
    - pas de place pour une restriction numeric/textType. Et ObjectOID.Oid (l''association qui rattache
    un OID a une Class, ilismeta16-associations.yml) cible le type GENERIQUE `DomainType`, PAS specifiquement
    AnyOIDType - preuve que les 4 alternatives d''oIDType() peuvent legitimement produire des DomainType
    DIFFERENTS. "OID ANY" et "UUIDOID" construisent AnyOIDType (le marqueur "any", nom coherent) ; "OID
    numeric"/ "OID textType" delegent a numeric()/textType(), qui construisent deja NumType/TextType (deja
    confirmes ailleurs, mecanisme reutilise tel quel, pas de nouvelle construction). Blackbox types ||
    Lot 18 (phase 2, résidus Phase 1) - CORRECTION : oIDType() est un DISPATCHER (comme type()/factor()),
    pas un constructeur unique. Voir grammar-metamodel-mapping.yml pour la preuve complète (AnyOIDType.own={}
    exhaustivement vide, ObjectOID.Oid cible DomainType générique et non AnyOIDType spécifiquement).'
refSys:
  grammar:
    rule: refSys
  kind: Container
  attribute_bindings:
    RefSys:
      source:
        field: metaObjectRef|domainRef
        kind: alt_rule
      note: 'refSys() has 2 mutually exclusive alternatives: "{ metaObjectRef [ PosNumber ] }" or "< domainRef
        [ PosNumber ] >". Confirmed via the IlisMeta16 metamodel PDF (INTERLIS 2 - Metamodel, edition
        2022-06-17): "ASSOCIATION NumsRefSys = NumType -- NumType; RefSys (EXTERNAL) -- {0..1} MetaObjectDef
        OR CoordType; Axis: AxisInd;". metaObjectRef resolves the MetaObjectDef branch, domainRef resolves
        the CoordType branch (CoordType extends DomainType, per ilismeta16-classes.yml). No direct IlisMeta16
        instance is created by refSys() itself (target: null); it feeds the NumsRefSys association end
        RefSys on the enclosing NumType.

        '
    Axis:
      source:
        field: PosNumber
        optional: true
      note: 'Optional in both alternatives; feeds NumsRefSys.Axis (type AxisInd, domain 1..3 per the metamodel
        PDF cited above).

        '
  note: No direct IlisMeta16 instance expected. References a MetaObjectDef (reference system) via metaObjectRef,
    with optional precision (PosNumber) and axis domain (domainRef); feeds the NumsRefSys association.
    Formatted types
rotationDef:
  grammar:
    rule: rotationDef
  kind: Container
  attribute_bindings:
    NullAxis:
      source:
        field: PosNumber
        index: 0
      note: 'Feeds directly into the enclosing coordinateType''s CoordType instance (via path:, see
        coordinateType.NullAxis/PiHalfAxis). CORRIGE (audit corpus reel models.geo.admin.ch, 2026-08-03) :
        coordinateType tentait auparavant d''indexer directement `field: rotationDef` avec index 0/1,
        alors que rotationDef() est lui-meme un accesseur SINGLE (0 ou 1 occurrence, confirme
        generated/ast-accessors.yml : RotationDefContext n''a pas de kind rule_multi pour rotationDef sur
        CoordinateTypeContext) - seul son PosNumber INTERNE (rule_multi, confirme) est indexable 0/1.
        TypeError sur tout coordinateType() avec une clause ROTATION reelle (ex. CHBase_Part1_GEOMETRY_V2.ili).

        '
    PiHalfAxis:
      source:
        field: PosNumber
        index: 1
      note: Second PosNumber (apres MINUS GT) - voir NullAxis ci-dessus pour le contexte complet de la
        correction.
  note: 'No direct IlisMeta16 instance expected. ROTATION <n1> -> <n2>: two numeric values feeding a rotation-related
    attribute of the enclosing element (coordinate system definition context). || CONFIRME (Lot 13, point
    2, phase 2): rotationDef() = ROTATION PosNumber(0) MINUS GT PosNumber(1), i.e. "ROTATION axisA ->
    axisB" (two 1-based axis indices). No own class (target: null is correct - this rule has no own class/datatype
    instance, it feeds directly two attributes on the ENCLOSING coordinateType''s CoordType instance).
    RULE #1/#4: confirmed via ilismeta16-classes.yml (CoordType.NullAxis/ PiHalfAxis, both type AxisInd)
    and the INTERLIS 2 Metamodel PDF edition 2022-06-17, section 2.3.1 (p.10) and IDL text: "DOMAIN AxisInd
    = 1..3; CLASS CoordType EXTENDS DomainType = NullAxis: AxisInd; PiHalfAxis: AxisInd; Multi: BOOLEAN;
    END CoordType;" - AxisInd is a 1..3-valued index into CoordType''s ordered Axis list (association
    AxisSpec), exactly matching rotationDef''s two 1-based PosNumber tokens. No separate "Rotation" class/attribute
    exists or is needed - see coordinateType.NullAxis/PiHalfAxis bindings above.'
textConst:
  grammar:
    rule: textConst
  kind: Container
  attribute_bindings:
    Value:
      source:
        field: STRING
      note: 'textConst() has a single alternative matching the STRING token verbatim. No dedicated IlisMeta16
        instance is created (grammar-metamodel-mapping.yml: "No direct IlisMeta16 instance expected");
        this raw string value feeds the parent construct''s own Value/Constant handling (e.g. Constant.Value
        via the `constant` rule dispatch).

        '
  note: No direct IlisMeta16 instance expected. Single STRING literal; feeds Constant.Value (Type=Text)
    on the enclosing Constant (created by constant). Enumeration types
textType:
  grammar:
    rule: textType
  kind: Instance
  target: IlisMeta16.ModelData.TextType
  attribute_bindings:
    Kind:
      source:
        field: MTEXT|TEXT|NAME|URI
        kind: alt_token
      rule:
        MTEXT: MText
        TEXT: Text
        NAME: Name
        URI: Uri
      note: 'textType() in InterlisParser.py has 4 mutually exclusive alternatives dispatched on the lookahead
        token (MTEXT, TEXT, NAME, URI); exactly one of the four tokens is present per instance. Values
        confirmed via ilismeta16-kind-values.yml IlisMeta16.ModelData.TextType.Kind: [MText, Text, Name,
        Uri].

        '
    MaxLength:
      source:
        field: PosNumber
        optional: true
      note: 'Only present in the MTEXT and TEXT alternatives, and only when followed by MUL PosNumber
        (e.g. TEXT*20); absent for the NAME and URI alternatives and for MTEXT/TEXT without an explicit
        length. Feeds TextType.MaxLength (type IlisMeta16.ModelData.LengthRange per ilismeta16-classes.yml).
        Note: LengthRange itself has no standalone qualified_name entry in ilismeta16-datatypes.yml/ilismeta16-classes.yml
        - it appears only as a referenced attribute type, not as its own extracted definition; ModelBuilder
        must construct it from the raw PosNumber token value.

        '
  note: Kind resolved dynamically per kind-values.yml (MText/Text/Name/Uri)
type:
  grammar:
    rule: type
  kind: Container
  dispatches_to:
  - attrType
  - baseType
  - classType
  - lineType
  attribute_bindings:
    _dispatch:
      note: 'Pure dispatcher, no own class - 3 alternatives: baseType() (delegates further), lineType()
        (delegates further), or bare ''STRING DOTDOT STRING'' (a text-range domain). The 3rd alternative
        has no confirmed dedicated DomainType subclass distinct from TextType/LengthRange - status unresolved.'
    text_range_alt:
      status: not_applicable
      note: 'Lot 18 (phase 2, résidus Phase 1). "''STRING DOTDOT STRING''" (e.g. "a".."z"). Preuve d''absence
        désormais exhaustive : grep de TOUTES les 12 sous-classes directes de `DomainType` (`ilismeta16-classes.yml`
        : TypeRelatedType, ClassRelatedType, BooleanType, TextType, BlackboxType, NumType, CoordType,
        AnyOIDType, AttributeRefType, EnumType, EnumTreeValueType, LineType) - aucune ne porte de construction
        "range de chaîne entre guillemets". `TextType.Kind` (ilismeta16-kind-values.yml) = {MText, Text,
        Name, Uri} seulement, aucune valeur "Range". `NumType.Min/Max` (utilisé par `numeric()`, déjà
        confirmé) est alimenté exclusivement par des tokens Number/PosNumber/Dec (littéraux numériques),
        jamais par un token STRING - donc pas réutilisable ici malgré le type de stockage générique (TEXT)
        partagé. Cohérent avec le Reference Manual (EBNF `TextType` = mot-clé + longueur seulement, aucun
        `Min..Max` ; seul `NumericType` porte un `NumericRange`) - même famille de divergence que POW
        (`composedUnit`, point 12) et `CONTRACT ISSUED BY` (`modeldef`) : extension de grammaire propre
        à ce projet, absente du métamodèle officiel. Décision ModelBuilder : lever une erreur explicite
        si cette 3e alternative de `type()` est réellement rencontrée, plutôt que deviner un encodage.

        '
  note: Primitive and base types
