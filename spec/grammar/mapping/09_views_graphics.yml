aggregation:
  grammar:
    rule: aggregation
  kind: Container
  attribute_bindings:
    _kind:
      source:
        field: getAltNumber
        index: null
      note: confirmed IlisMeta16.ModelData.View.FormationKind.children.Aggregation = [All, Equal] (kind-values.yml)
        - dispatch on ALL token vs EQUAL LPAR uniqueEl RPAR alternative.
    FormationParameter:
      source:
        field: uniqueEl
        optional: true
      note: 'EQUAL(uniqueEl) alternative only (ALL has no parameter
        - per the Metamodel PDF, "only indicated... provided EQUAL is requested"). `optional: true`
        because the ALL alternative reaches `aggregation()` with no `uniqueEl()` child at all - without
        it source_resolver treats the field as MANDATORY and raises a BuildError on every `AGGREGATION OF
        ... ;` (ALL form), aborting the whole model build (same class of fix as `inspection.AREA` above).
        uniqueEl (target: PathOrInspFactor) feeds View.FormationParameter (LIST OF Expression,
        restricted to PathOrInspFactor) directly - exact IDL citation: "Aggr.Equal: UniqueEl". See
        viewDef.FormationParameter above for the full citation.

        '
    renamedViewableRef:
      source:
        field: renamedViewableRef
        index: 0
      note: the aggregated-over viewable; parent formationDef/viewDef chain.
  note: No direct IlisMeta16 instance expected. Sets FormationKind=Aggregation on the enclosing View,
    with sub-value All or Equal (from kind-values.yml Aggregation children) resolved by the ALL/EQUAL
    token; uniqueEl (when EQUAL) feeds the grouping key.
baseExtensionDef:
  grammar:
    rule: baseExtensionDef
  kind: Container
  attribute_bindings:
    _resolution:
      association: BaseViewDef
      role: RenamedBaseView
      source:
        field: renamedViewableRef
        index: null
      note: No own class; BASE Name EXTENDED BY renamedViewableRef(,renamedViewableRef)* feeds the parent
        viewDef's confirmed BaseViewDef association (View <-> RenamedBaseView, composite). The leading
        'Name' (base view's own local name being extended) has no confirmed distinct target.
  note: No direct IlisMeta16 instance expected. Groups renamedViewableRef entries (each producing a RenamedBaseView)
    under a named base view extension scope.
condSignParamAssignment:
  grammar:
    rule: condSignParamAssignment
  kind: ValueObject
  target: IlisMeta16.ModelData.CondSignParamAssignment
  attribute_bindings:
    Where:
      source:
        field: expression
        index: 0
      note: confirmed IlisMeta16.ModelData.CondSignParamAssignment.own.Where (Expression, 0..1) - optional
        leading '(WHERE)? expression' clause (WHERE token itself has no accessor confirmed effect other
        than being an optional lead-in word before the same expression()).
    Assignments:
      source:
        field: signParamAssignment
        index: null
      note: confirmed IlisMeta16.ModelData.CondSignParamAssignment.own.Assignments (SignParamAssignment,
        0..*) - direct list mapping from LPAR signParamAssignment(SEMI signParamAssignment)* RPAR.
drawingRule:
  grammar:
    rule: drawingRule
  kind: Instance
  target: IlisMeta16.ModelData.DrawingRule
  parent:
    association: GraphicRule
    role: DrawingRule
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: inherited Name (MetaElement)
    Abstract:
      source:
        field: ABSTRACT
        presence: true
      note: 'Same pattern as classDef.Abstract: independent ABSTRACT()
        accessor on DrawingRuleContext, presence: true suffices.'
    Final:
      source:
        field: FINAL
        presence: true
      note: see Abstract above - same pattern, independent FINAL() accessor.
    Generic:
      status: not_applicable
      note: 'DrawingRuleContext has no GENERIC() accessor (only ABSTRACT/EXTENDED/FINAL exist).
        Reference Manual (2006 and 2024 editions identical): "DrawingRule = DrawingRule-Name
        Properties<ABSTRACT,EXTENDED,FINAL> ..." - GENERIC is absent from the list. Design decision:
        always False by default.

        '
    Rule:
      source:
        field: condSignParamAssignment
        index: null
      note: confirmed IlisMeta16.ModelData.DrawingRule.own.Rule (CondSignParamAssignment, 0..*) - direct
        list mapping from condSignParamAssignment(,condSignParamAssignment)*.
    restriction_of_class:
      association: SignClass
      role: Class
      source:
        field: classRef
        index: 0
      note: 'optional ''OF classRef()'' clause - confirmed IlisMeta16.ModelData.SignClass: DrawingRule
        <-> Class (restricts the drawing rule to a specific class).'
  note: Symbol parameters
enumAssignment:
  grammar:
    rule: enumAssignment
  kind: ValueObject
  target: IlisMeta16.ModelData.EnumAssignment
  attribute_bindings:
    ValueToAssign:
      source:
        field: constant|metaObjectRef
        index: 0
        kind: alt_rule
      note: confirmed IlisMeta16.ModelData.EnumAssignment.own.ValueToAssign (Expression, 0..1) - populated
        from the 2nd alternative (bare constant()) or the 1st alternative (LCBR metaObjectRef RCBR, see
        metaobjectref_alt below) - same slot, same PathOrInspFactor construction hypothesis as signParamAssignment.metaobjectref_alt.
    metaobjectref_alt:
      target: IlisMeta16.ModelData.PathOrInspFactor
      source:
        field: metaObjectRef
        index: 0
      note: 'Same mechanism and evidence as
        signParamAssignment.metaobjectref_alt (see that binding for the full detail: PathEl.Ref is
        `INTERLIS.NAME` per the XMI source, an exact type match with metaObjectRef()''s output):
        PathOrInspFactor(PathEls=[PathEl(Kind=MetaObject, Ref=resolved metaObjectRef)]), assigned to
        ValueToAssign (Factor->Expression). No direct example of the ACCORDING...enumAssignment form was
        observed in the corpus used to corroborate signParamAssignment.metaobjectref_alt (which only uses
        the direct Sign := {...} form), but the underlying LCBR metaObjectRef RCBR mechanism is the same
        one already corroborated there.

        '
    MinEnumValue:
      source:
        field: enumRange
        index: 0
      note: confirmed IlisMeta16.ModelData.EnumAssignment.own.MinEnumValue (INTERLIS.NAME, mandatory)
        - fed by enumRange()'s first enumerationConst().
    MaxEnumValue:
      source:
        field: enumRange
        index: 1
      note: confirmed IlisMeta16.ModelData.EnumAssignment.own.MaxEnumValue (INTERLIS.NAME, 0..1) - fed
        by enumRange()'s optional 2nd enumerationConst() after DOTDOT; when absent, MinEnumValue alone
        represents a single value (structural match confirmed by exact 2-attribute shape of EnumAssignment
        vs enumRange's [DOTDOT enumerationConst]? structure).
enumRange:
  grammar:
    rule: enumRange
  kind: Container
  attribute_bindings:
    _resolution:
      note: 'No own class (grep-confirmed: no IlisMeta16.ModelData.EnumRange/Range DataType exists). Its
        two enumerationConst() (mandatory first, optional second after DOTDOT) feed the parent enumAssignment''s
        confirmed MinEnumValue/MaxEnumValue attributes directly - see enumAssignment binding above.'
  note: No direct IlisMeta16 instance expected. Single enumerationConst or a MinValue..MaxValue range;
    feeds EnumAssignment.MinEnumValue/MaxEnumValue.
formationDef:
  grammar:
    rule: formationDef
  kind: Container
  attribute_bindings:
    _dispatch:
      note: 'Pure dispatcher, no own class (5 mutually exclusive alternatives: projection/join/union/aggregation/inspection).
        Result feeds parent viewDef''s View.FormationKind (confirmed enum values match exactly: Projection/Join/Union/Aggregation/Inspection).'
  note: No direct IlisMeta16 instance expected. Dispatcher between projection/join/union/aggregation/inspection;
    sets View.FormationKind on the enclosing View.
graphicDef:
  grammar:
    rule: graphicDef
  kind: Instance
  target: IlisMeta16.ModelData.Graphic
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: inherited Name (MetaElement)
    Abstract:
      source:
        field: ABSTRACT
        presence: true
      note: 'Same pattern as classDef.Abstract/viewDef.Abstract:
        independent ABSTRACT() accessor on GraphicDefContext, presence: true suffices.'
    Final:
      source:
        field: FINAL
        presence: true
      note: see Abstract above - same pattern, independent FINAL() accessor.
    Generic:
      status: not_applicable
      note: 'Graphic inherits Generic via ExtendableME but has no GENERIC() accessor on
        GraphicDefContext (same reasoning as viewDef.Generic), confirmed by the Reference Manual (2006
        and 2024 editions identical): "GraphicDef = ''GRAPHIC'' Graphic-Name Properties<ABSTRACT,FINAL> ..."
        - GENERIC is absent from the list. Design decision: always False by default.

        '
    Where:
      source:
        field: selection
        index: null
      note: confirmed IlisMeta16.ModelData.Graphic.own.Where (Expression, 0..1), fed by selection()'s
        expression() - same 0..1 vs grammar 0..* loop mismatch already documented for viewDef/selection.
    extends_graphicRef:
      source:
        field: graphicRef
        optional: true
      note: 'EXTENDS graphicRef() alternative (a graphic extending
        another graphic), via the generic IlisMeta16.ModelData.Inheritance mechanism (Sub {0..*} ExtendableME
        <-> Super {0..1} ExtendableME, ilismeta16-associations.yml) - the same mechanism already used for
        classDef/structureDef and viewDef. Graphic extends ExtendableME directly (ilismeta16-classes.yml).
        INTERLIS 2 Reference Manual edition 2006-04-13, section
        2.16 "Graphic descriptions" (p.68-69), EBNF "GraphicDef = ''GRAPHIC'' Graphic-Name Properties<ABSTRACT,FINAL>
        [''EXTENDS'' GraphicRef] [''BASED'' ''ON'' ViewableRef] ''='' {Selection} {DrawingRule} ''END''
        Graphic-Name '';''." and text: "The extension of a graphic must be based upon the same class
        as the base graphic (BASED ON lacks) or upon one of its extensions" - confirming EXTENDS as
        a genuine inheritance mechanism between graphic descriptions. Binding: feeds Inheritance (Sub=this
        Graphic, Super=graphicRef() resolved to another Graphic).

        '
    based_on:
      association: GraphicBase
      role: Base
      source:
        field: viewableRef
        index: 0
      note: 'confirmed IlisMeta16.ModelData.GraphicBase: Graphic <-> Base:Class - BASED ON viewableRef()
        clause.'
graphicRef:
  grammar:
    rule: graphicRef
  kind: Reference
  target: IlisMeta16.ModelData.Graphic
  attribute_bindings:
    _resolution:
      note: 'Pure reference resolution: qualified name (Name (DOT Name)?)? Name resolves to an existing
        IlisMeta16.ModelData.Graphic by qualified_name; no own attributes constructed (same pattern as
        classRef/viewRef).'
  note: Drawing rules
inspection:
  grammar:
    rule: inspection
  kind: Container
  attribute_bindings:
    _kind:
      source:
        field: AREA
        presence: true
      note: >
        Confirmed IlisMeta16.ModelData.View.FormationKind.children.Inspection = [Normal, Area]
        (kind-values.yml) - AREA is OPTIONAL at the grammar level (InterlisParser.py's inspection()
        method matches AREA only inside an "if" guard on the lookahead token, never unconditionally),
        same presence-dispatch pattern as viewDef.Abstract/Final/Transient above (an absent optional
        token is a valid outcome, not missing data). Was previously bound via plain field+index with
        no optional/presence flag, which source_resolver.py treats as MANDATORY - raised a BuildError
        on any real inspection() without AREA. Confirmed real (ili_corpus/ full-corpus grep for
        "INSPECTION OF" without a preceding "AREA"): LWB_Nutzungsflaechen_V3_0.ili's
        "VIEW InspectionOfProgramm INSPECTION OF LNF_Nutzung_Programm ~ ... -> Programm;" - the only
        real occurrence found, but the grammar makes AREA optional regardless of corpus frequency.
    FormationParameter:
      source:
        field: Name
        index: null
      note: 'Exact IDL citation from the Metamodel: "Inspection: Attributepath"
        - the chain "-> StructureOrLine Attribute-Name" (Name (MINUS GT Name)* in the grammar) must
        be built as a PathOrInspFactor (same target as uniqueEl/aggregation above), each
        Name in the chain forming a successive Attribute-kind PathEl in PathEls - not a plain
        list of raw tokens. Feeds View.FormationParameter (LIST OF Expression). See viewDef.FormationParameter
        for the full citation.

        '
    renamedViewableRef:
      source:
        field: renamedViewableRef
        index: 0
      note: the inspected viewable.
  note: No direct IlisMeta16 instance expected. Sets FormationKind=Inspection on the enclosing View, with
    sub-value Area (AREA token present) or Normal (default); renamedViewableRef provides the base, Name
    chain (via -> ) the inspection path.
join:
  grammar:
    rule: join
  kind: Container
  attribute_bindings:
    _resolution:
      note: No own class; renamedViewableRef() list (2+) feeds FormationKind=Join. Optional '(OR NULL)'
        per join-partner (OrNull) maps to confirmed IlisMeta16.ModelData.RenamedBaseView.own.OrNull on
        the corresponding renamedViewableRef, not on join itself.
  note: No direct IlisMeta16 instance expected. Sets FormationKind=Join on the enclosing View; each renamedViewableRef
    provides a RenamedBaseView.
projection:
  grammar:
    rule: projection
  kind: Container
  attribute_bindings:
    _resolution:
      note: No own class; single renamedViewableRef() feeds View.FormationParameter/FormationKind=Projection
        (via parent formationDef/viewDef). No IlisMeta16.ModelData.Projection class exists in the metamodel.
  note: No direct IlisMeta16 instance expected. Sets FormationKind=Projection on the enclosing View; renamedViewableRef
    provides the single base RenamedBaseView.
renamedViewableRef:
  grammar:
    rule: renamedViewableRef
  kind: Instance
  target: IlisMeta16.ModelData.RenamedBaseView
  parent:
    association: BaseViewDef
    role: RenamedBaseView
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
        optional: true
      note: 'optional ''Name TILDE'' rename alias -> RenamedBaseView.inherited.Name. `optional: true` is
        required: the no-alias case (e.g. "ALL OF Localisation;",
        DMAV_AdressesDeBatiments_V1_0.ili) is the majority case in real-world data.

        '
    viewableRef:
      association: BaseViewRef
      role: BaseView
      source:
        field: viewableRef
        index: 0
      note: 'confirmed IlisMeta16.ModelData.BaseViewRef: RenamedBaseView -> BaseView:Class'
    OrNull:
      note: 'RenamedBaseView.own.OrNull (BOOLEAN 0..1) is the correct target - the value is fed by the
        caller rather than by this rule itself. Per the `join()` binding: `LPAR`/`OR`/`NULL`/`RPAR` are
        all `token_multi` on `JoinContext` - an optional `(OR NULL)` PER PARTNER of the `renamedViewableRef`
        list (not a global ambiguity about which instance it applies to); propagate index by index from
        `join()` to the corresponding `RenamedBaseView` instance.

        '
selection:
  grammar:
    rule: selection
  kind: Container
  attribute_bindings:
    Where:
      association: null
      source:
        field: expression
        index: 0
      note: confirmed IlisMeta16.ModelData.View.own.Where (Expression, 0..1) - direct attribute of the
        enclosing viewDef, no own class for selection(). See viewDef's Where note for the 0..1 vs grammar
        0..* loop mismatch.
  note: No direct IlisMeta16 instance expected. WHERE clause; feeds View.Where (Expression) on the enclosing
    View.
signParamAssignment:
  grammar:
    rule: signParamAssignment
  kind: ValueObject
  target: IlisMeta16.ModelData.SignParamAssignment
  attribute_bindings:
    Param:
      source:
        field: Name
        index: 0
      note: confirmed IlisMeta16.ModelData.SignParamAssignment.own.Param (INTERLIS.NAME) - the leading
        'Name ASSIGN' target parameter name.
    Assignment:
      source:
        field: factor|metaObjectRef|attributePath
        index: 0
        kind: alt_rule
      note: 'Confirmed IlisMeta16.ModelData.SignParamAssignment.own.Assignment (Expression, 0..1) - populated
        by all 3 alternatives, each constructing a different Factor (Factor EXTENDS Expression, confirmed
        ilismeta16-datatypes.yml) : 2nd alt = bare factor() directly ; 1st alt (LCBR metaObjectRef RCBR)
        and 3rd alt (ACCORDING...) each construct their own Factor subtype - see metaobjectref_alt/according_alt
        below.

        '
    metaobjectref_alt:
      target: IlisMeta16.ModelData.PathOrInspFactor
      source:
        field: metaObjectRef
        index: 0
      note: 'First alternative, "LCBR metaObjectRef
        RCBR". Construction: PathOrInspFactor(PathEls=[PathEl(Kind=MetaObject, Ref=resolved metaObjectRef)]),
        assigned to Assignment (Factor->Expression). Per the XMI source
        (docs/uml/IlisMeta16-formatted.xmi, same source as mappings/ilismeta16-datatypes.yml):
        `PathEl.Ref` is typed `INTERLIS.NAME` (a plain name, not a typed reference to a class
        instance), and `PathEl.Kind` does include the value `MetaObject`
        (mappings/ilismeta16-kind-values.yml). `metaObjectRef()` (mappings/python-bindings.yml, dedicated
        binding) produces exactly a plain name, optionally qualified by a metaDataBasketRef ("(metaDataBasketRef
        DOT)? Name") - an exact type match with `PathEl.Ref: INTERLIS.NAME`. Used in practice across
        several real-world models (modelPond.ili, RoadsExgm2ien.ili, Text/Surface/Polyline_Graphics.ili
        from the FGDM4GS corpus) - e.g. "Sign :=
        {goodhealth}", "Sign := {continuous}", "Sign := {Building}", "Sign := {Linefont_18}" - always the same
        LCBR metaObjectRef RCBR form. See also
        the corroboration note on parameterDef._metaobject_variant for where the "Sign" parameter itself
        comes from (the predefined INTERLIS.SIGN class).

        '
    according_alt:
      target: IlisMeta16.ModelData.EnumMapping
      source:
        field: attributePath
        enumAssignment: null
        multi: true
      note: 'Third alternative, "ACCORDING attributePath LPAR enumAssignment(,enumAssignment)*
        RPAR". INTERLIS 2 Metamodel edition 2022-06-17, exact IDL text: "STRUCTURE EnumMapping
        EXTENDS Factor = EnumValue: PathOrInspFactor; Cases: LIST OF EnumAssignment; END EnumMapping;"
        - an exact match: attributePath (already PathOrInspFactor-compatible) -> EnumMapping.EnumValue
        ; the enumAssignment(,enumAssignment)* list -> EnumMapping.Cases. EnumMapping EXTENDS Factor EXTENDS
        Expression (ilismeta16-datatypes.yml), so the EnumMapping instance built here is
        assigned directly to SignParamAssignment.Assignment (same slot as the other 2 alternatives,
        Expression-compatible type).

        '
union:
  grammar:
    rule: union
  kind: Container
  attribute_bindings:
    _resolution:
      note: No own class; renamedViewableRef() list (2+) feeds FormationKind=Union. No dedicated Union
        class found in metamodel.
  note: No direct IlisMeta16 instance expected. Sets FormationKind=Union on the enclosing View; each renamedViewableRef
    provides a RenamedBaseView.
viewAttributes:
  grammar:
    rule: viewAttributes
  kind: Container
  attribute_bindings:
    attributeDef_alt:
      association: ClassAttr
      role: ClassAttribute
      source:
        field: attributeDef
        index: 0
        optional: true
      note: '3rd grammatical alternative (bare attrTypeDef/attributeDef) - feeds IlisMeta16.ModelData.ClassAttr:
        Class(AttrParent) <-> AttrOrParam(ClassAttribute, composite); parent Class end is the enclosing
        View. `optional: true` is required: the 1st alternative
        "ALL OF ..." (see all_of_redefinition below) has no
        attributeDef at all in the same viewAttributes() - e.g. DMAV_AssiettesDeServitudes_V1_0.ili
        ("ALL OF AssietteDeServitude; UNIQUE CH050701: EREID;").

        '
    all_of_redefinition:
      status: not_applicable
      note: '1st alternative, "ALL OF Name; (Name ASSIGN expression;)*".
        Reference Manual 2006-04-13 §2.15 "Views" (p.67): "we further offer the possibility
        to transfer all attributes of a view-base in the same order (ALL OF)" - used in real-world data
        (e.g. V_D/DMAV_Grundstuecke_V1_1.ili).
        `IlisMeta16.ModelData.RenamedBaseView` (mappings/ilismeta16-classes.yml) has own attributes =
        {OrNull} only (+ Name/Documentation/Abstract/Generic/Final inherited from ExtendableME/MetaElement),
        no "project everything" attribute - and the associations touching it (mappings/ilismeta16-associations.yml)
        are only `BaseViewDef` (View<->RenamedBaseView, composite) and `BaseViewRef` (RenamedBaseView<->Class
        via role BaseView). Neither carries an "ALL OF" marker. So "ALL OF Name" just references the
        RenamedBaseView (via BaseViewRef -> Class) whose attributes are all projected, without creating
        AttrOrParam instances or a dedicated metamodel flag
        - a pure syntax shortcut on the ModelBuilder side (at construction time, iterate the attributes
        of the resolved BaseView Class and create one ClassAttr per attribute).
        Implemented: `InterlisModelBuilder._expand_view_all_of` (only the FIRST "ALL OF Name;" per
        viewAttributes() - the grammar itself never supports a second one in the same call, see that
        method''s docstring for the real-corpus caveat found on multi-base JOIN OF views), own attributes
        of the matched RenamedBaseView.BaseView only (inherited via EXTENDS not walked, no evidence yet).
        Each copied ClassAttr also gets a synthetic identity `Derivates` (a `PathOrInspFactor`
        `<base-name> -> <attr>`, marked `_all_of_identity`) - the same shape a `<attr> := <base> -> <attr>`
        redefinition carries, so a converter that projects a view by expression rather than by name
        (`convert/sql.py`''s `CREATE VIEW` SELECT list) can emit a column for it. `Type` is still set
        directly from the base attribute, so this path is never walked for type resolution.

        '
    bare_redefinition_list:
      source:
        field: expression
        multi: true
      note: '2nd alternative, "(Name ASSIGN expression;)+". Direct precedent in this same file:
        attributeDef (see binding above) already feeds
        AttrOrParam.Derivates (Expression, 0..*, ilismeta16-classes.yml) from the same
        "factor (after optional ASSIGN)" pattern. Same mechanism here: each "Name ASSIGN expression"
        pair creates/redefines an AttrOrParam (ClassAttr, parent=this View, Name=the captured Name) whose
        Derivates receives the assigned expression - consistent with the Reference Manual 2006-04-13 §2.15:
        "it is sufficient to indicate the attribute name and the assignation to the basic attribute. Such
        definitions are always final" (Final=true on this AttrOrParam, per ExtendableME.Final).

        '
    modifier_reassignment:
      source:
        field: expression
        multi: true
      note: 'Same mechanism as bare_redefinition_list above (AttrOrParam.Derivates),
        with the modifier token (ABSTRACT|GENERIC|FINAL|TRANSIENT) additionally feeding the corresponding
        ExtendableME field on this AttrOrParam (same shared Abstract/Final/Generic/Transient pattern
        documented elsewhere, e.g. viewDef.Abstract) rather than a separate target.

        '
  note: 'No direct IlisMeta16 instance expected. Three forms: "ALL OF Name" (inherit all attrs from a
    base), attributeDef (redefine/add an attribute, produces AttrOrParam), or "Name ASSIGN expression"
    (computed attribute remapping). Graphic representations'
viewDef:
  grammar:
    rule: viewDef
  kind: Instance
  target: IlisMeta16.ModelData.View
  discriminant:
    attribute: Kind
    value: View
  parent:
    association: PackageElements
    role: Element
  attribute_bindings:
    Name:
      source:
        field: Name
        index: 0
      note: inherited Name (MetaElement), confirmed IlisMeta16.ModelData.View.inherited.Name
    Abstract:
      source:
        field: ABSTRACT
        presence: true
      note: 'Same pattern as classDef.Abstract (ilismeta16-classes.yml):
        ABSTRACT/EXTENDED/FINAL/TRANSIENT are an exclusive alternation at the grammar level (only one
        present at a time), but ANTLR generates a SEPARATE accessor
        per token on the Context (ViewDefContext: ABSTRACT()/EXTENDED()/FINAL()/TRANSIENT()) -
        so "presence: true" per attribute is sufficient and unambiguous (if
        ABSTRACT matches, Abstract=true and the other 3 are automatically absent, no
        token-text inspection needed).

        '
    Final:
      source:
        field: FINAL
        presence: true
      note: see Abstract above - same pattern, independent FINAL() accessor.
    Generic:
      status: not_applicable
      note: 'ViewDefContext has no GENERIC() accessor (only ABSTRACT/EXTENDED/FINAL/TRANSIENT
        exist) - GENERIC is simply never in this rule''s grammar. Confirmed by the Reference Manual
        (2024 V2.1.0 and 2006 editions,
        identical on this point): "ViewDef = ''VIEW'' View-Name Properties<ABSTRACT,EXTENDED,FINAL,TRANSIENT>
        ..." - GENERIC is deliberately not in the list of admissible Properties for a view (unlike
        AttrOrParam/DataUnit, which do have it). View.Generic (inherited from ExtendableME via Class->Type)
        can therefore never be set via the VIEW syntax - design decision: always False by default
        for any View instance.

        '
    Transient:
      source:
        field: TRANSIENT
        presence: true
      note: View.own.Transient (INTERLIS.BOOLEAN) - see Abstract above, same pattern, independent TRANSIENT()
        accessor.
    FormationKind:
      note: 'confirmed IlisMeta16.ModelData.View.FormationKind (kind-values.yml: Projection/Join/Union/Aggregation/Inspection).
        No `source:` here deliberately: a plain `field: formationDef` binding would make the generic
        engine call `visit(formationDef())` a SECOND time on top of the natural unclaimed-children sweep
        that already builds and attaches every RenamedBaseView reachable from it (formationDef/projection/join/...
        are dispatchers with no own instance, see below) - doubling every RenamedBaseView instance built,
        and assigning FormationKind to whatever that visit happens to return (a RenamedBaseView or list
        thereof) instead of an enum string. Set instead by
        `InterlisModelBuilder._set_view_formation_kind` (rule_name == "viewDef" special case in
        `_build_instance`, same family as classDef''s OID/unitDef''s alias registration), which reads the
        raw ViewDefContext directly to determine which of formationDef''s 5 sub-rules matched, without
        triggering a second visit.'
    FormationParameter:
      note: 'INTERLIS 2 Metamodel edition 2022-06-17, exact
        IDL text of CLASS View: "FormationParameter: LIST OF Expression; !! PathOrInspFactor only /**
        Aggr.Equal: UniqueEl * Inspection: Attributepath */" - and the descriptive text
        (same edition): "... are only indicated in the case of aggregation (provided EQUAL is requested)
        and for inspections aiming at the designation of the attribute to be inspected". No
        direct accessor on viewDef itself - fed via the formationDef/aggregation sub-node (branch
        EQUAL(uniqueEl)) or formationDef/inspection (Name(->Name)* chain), never for Projection/Join/Union/Aggregation-ALL.
        See the aggregation.FormationParameter and inspection.FormationParameter bindings below
        for the per-variant detail.

        '
    Where:
      source:
        field: selection
        index: null
      note: View.own.Where (Expression, 0..1) fed by selection()'s expression() - BUT grammar allows selection()
        to repeat 0..* (viewDef loop on WHERE) while View.Where multiplicity is 0..1; documented mismatch,
        status effectively unresolved for the multi-selection case.
    extends_viewRef:
      source:
        field: viewRef
        optional: true
      note: 'EXTENDS viewRef() alternative (a view extending another
        view, mutually exclusive with formationDef in the grammar), via the generic
        IlisMeta16.ModelData.Inheritance association (Sub {0..*} ExtendableME
        <-> Super {0..1} ExtendableME, ilismeta16-associations.yml) - the same mechanism already used
        for classDef/structureDef EXTENDS (see their "extends:" bindings, note "feeds Inheritance
        (Sub=this Class, Super=resolved ...Ref target)"). View qualifies via the inheritance chain
        View -> Class -> Type -> ExtendableME (ilismeta16-classes.yml). INTERLIS
        2 Reference Manual edition 2006-04-13, section 2.15 "Views" (p.64), EBNF "ViewDef = ''VIEW'' View-Name
        Properties<...> [FormationDef | ''EXTENDS'' ViewRef] {BaseExtensionDef} {Selection} ''='' [ViewAttributes]
        {ConstraintDef} ''END'' View-Name '';''." and text: "Views can also be extended (EXTENDED or
        EXTENDS)... Thanks to the extension it is possible to conceive extensions of views, classes and
        structures that serve as foundation to the view." Binding: feeds Inheritance (Sub=this View,
        Super=viewRef() resolved to another View).

        '
  note: View references
viewRef:
  grammar:
    rule: viewRef
  kind: Reference
  target: IlisMeta16.ModelData.View
  attribute_bindings:
    _resolution:
      note: 'Pure reference resolution: qualified name (Name (DOT Name)?)? Name resolves to an existing
        IlisMeta16.ModelData.View by qualified_name; no own attributes constructed (same pattern as classRef).'
  note: View formation operators
viewableRef:
  grammar:
    rule: viewableRef
  kind: Reference
  resolves_to:
  - Class
  - View
  attribute_bindings:
    _resolution:
      note: 'Pure reference resolution: qualified name (Name (DOT Name)?)? Name, always followed by one
        mandatory token (token 194 = Name itself per InterlisParser.tokens - the grammar''s ''(Name|Name|Name|Name)''
        alternation in InterlisParser.g4 line 561-565 is degenerate/collapsed, all 4 branches being plain
        Name). Resolves to any IlisMeta16.ModelData.Class (Structure/Class/Association/View) via BaseViewRef.BaseView;
        no own attributes constructed (same pattern as classOrStructureRef).'
  note: 'No fixed target: resolves to either IlisMeta16.ModelData.Class or IlisMeta16.ModelData.View depending
    on what the qualified name actually refers to in the model. `resolves_to: [Class, View]` is required:
    without a hint, an anonymous role sharing a name with a class (e.g. "Localisation
    -<> {0..1} Localisation;", same mechanism as roleDef on IlisMeta16.ili) makes the
    resolution ambiguous - e.g. DMAV_AdressesDeBatiments_V1_0.ili ("VIEW Localisation_Valable PROJECTION OF
    Localisation;").

    '
