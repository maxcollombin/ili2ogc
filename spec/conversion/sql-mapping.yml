# Declarative field bindings for the `.ili` -> SQL DDL conversion
# (see docs/sql-conversion-strategy.md and
# mappings/ilismeta16-to-sql-rules.yml for the contract this spec fills
# in). Checked by scripts/validate_sql_conversion_spec.py.
#
# Style mirrors spec/conversion/jsonschema-mapping.yml: each `source` names
# a real own/inherited IlisMeta16 attribute (verified against
# mappings/ilismeta16-classes.yml by the validator), each `target` names
# the SQL construct it produces. Implemented by src/interlis/convert/sql.py -
# this file documents the mapping decision, it is not executed directly.

NumType:
  qualified_name: IlisMeta16.ModelData.NumType
  sql:
    column_type:
      rule: "integer if Min and Max both parse as decimal-point-free integers, else numeric"
      note: "Same heuristic as convert/jsonschema.py's _num_type_schema (reused via _is_integer_range), not duplicated."
    nullable:
      source: {field: Mandatory}
      note: "Read via ResolvedAttribute.mandatory (xtf.schema.resolve_attribute), not this attribute directly."

TextType:
  qualified_name: IlisMeta16.ModelData.TextType
  sql:
    column_type:
      source: {field: Kind}
      note: >
        Kind=Name -> varchar(255), Kind=Uri -> varchar(1023) (eCH-0031
        SS3.2.2/SS3.8.1 exact bounds, same as the JSON Schema pipeline's
        pattern/format). Kind in {Text, MText}: varchar(MaxLength) when set
        (source: {field: MaxLength}), else plain text.

EnumType:
  qualified_name: IlisMeta16.ModelData.EnumType
  sql:
    column_type:
      value: text
      note: "No CHECK(...IN(...)) in Lot 1 - deliberately deferred, see mappings/ilismeta16-to-sql-rules.yml."

BooleanType:
  qualified_name: IlisMeta16.ModelData.BooleanType
  sql:
    column_type:
      value: boolean

FormattedType:
  qualified_name: IlisMeta16.ModelData.FormattedType
  sql:
    column_type:
      source: {field: Format}
      note: >
        XMLDate/XMLTime/XMLDateTime -> date/time/timestamp (same 3
        well-known names as convert/jsonschema.py's
        _KNOWN_FORMAT_TO_JSON_FORMAT). Any other Format value -> plain text.

BlackboxType:
  qualified_name: IlisMeta16.ModelData.BlackboxType
  sql:
    column_type:
      value: text

CoordType:
  qualified_name: IlisMeta16.ModelData.CoordType
  sql:
    column_type:
      rule: "geometry(<SFA type>, <SRID>) - see docs/interlis-geometry-sfa-mapping.md"
      note: >
        SFA type from Multi (own BOOLEAN): Point (Multi=false) /
        MultiPoint (Multi=true). SRID from the !!@CRS meta-attribute
        (source: {field: MetaAttribute}), same resolution as
        convert/jsonfg.py's _crs_uri - reused directly (a small local SRID
        variant extracting just the numeric EPSG code instead of building
        the full coordRefSys URI).

LineType:
  qualified_name: IlisMeta16.ModelData.LineType
  sql:
    column_type:
      source: {field: Kind}
      note: >
        Kind in {Polyline, DirectedPolyline} -> LineString/MultiLineString;
        Kind in {Surface, Area} -> Polygon/MultiPolygon (source: {field:
        Multi} selects the Multi* variant). SRID resolved the same way as
        CoordType, via xtf.schema.line_coord_type's vertex CoordType.

Class:
  qualified_name: IlisMeta16.ModelData.Class
  sql:
    table_name:
      source: {field: Name}
      note: "Lowercased (see mappings/ilismeta16-to-sql-rules.yml's ObjectOID entry for why - PostgreSQL unquoted-identifier folding, matched deliberately)."
    discriminant:
      source: {field: Kind}
      note: "Only Kind=Class becomes a table - Kind=Structure excluded here (see StructureNesting entry); Kind=View is handled by the View entry."

View:
  qualified_name: IlisMeta16.ModelData.View
  sql:
    formation_kind:
      source: {field: FormationKind}
      note: "Projection/Join -> CREATE VIEW; Union/Aggregation/Inspection -> a diagnostic note, not translated (same _SUPPORTED_VIEW_FORMATION_KINDS filter as the JSON Schema/JSON-FG pipelines)."
    select_list:
      rule: "one SELECT item per ClassAttribute (via the ClassAttr association, shared with Class)"
      note: >
        Each ClassAttribute's assigned expression (Derivates[0], a
        PathOrInspFactor) resolves to "<base alias>"."<column>", AS its own
        Name. An intermediate hop through a REFERENCE TO/embedded role adds
        a comma-joined table. An ALL OF attribute whose synthetic identity
        path resolves to no single column is dropped with a per-attribute
        note (it was not named), not a whole-View demotion.
    where:
      source: {field: Where}
      note: >
        And/Or/Not of relational comparisons of two plain paths and
        DEFINED(<base> -> role -> ...) are translated - the latter to an
        EXISTS subquery over the association (FK read from whichever side
        carries it, the DMAV *_Gueltig idiom). Anything else demotes the
        whole View to a -- NOTE (RULE #5).
    view_level_constraints:
      note: >
        A VIEW-level UNIQUE / SET / EXISTENCE constraint (on View.Constraint,
        the ClassConstraint association shared with Class) is surfaced as a
        -- NOTE - a CREATE VIEW cannot enforce it.
  not_mapped:
    Transient:
      note: "A transient view (never transferred) has no SQL representation - not emitted."

ObjectOID:
  qualified_name: IlisMeta16.ModelData.ObjectOID
  sql:
    identity_column:
      value: "id text UNIQUE NOT NULL"
      note: >
        Synthetic, independent of the Class's own OID clause. Deliberately
        NOT `PRIMARY KEY` (was `ogc_fid text PRIMARY KEY` until 2026-08-27):
        verified empirically that GDAL excludes whatever it detects as
        `PRIMARY KEY` from the INSERT column list entirely (expects the
        database to auto-generate it) - a Feature's `"id"` was NEVER
        actually written on `ogr2ogr -append`. See
        mappings/ilismeta16-to-sql-rules.yml's ObjectOID entry for the full
        rationale.

StructureNesting:
  qualified_name: IlisMeta16.ModelData.Class
  sql:
    flattened_columns:
      rule: "<attr>_<subattr> columns on the SAME table, one level only"
      note: "See mappings/ilismeta16-to-sql-rules.yml's StructureNesting entry for the one-level limit and the inherited MANDATORY-not-captured gap."

ReferenceType:
  qualified_name: IlisMeta16.ModelData.ReferenceType
  sql:
    fk_column:
      value: text
      note: "Typed to match the target table's id (also text)."
    foreign_key:
      rule: "FOREIGN KEY (<column>) REFERENCES <target table>(id)"
      note: "Target class via xtf.schema.reference_target_class, reused directly - not re-derived."

Role:
  qualified_name: IlisMeta16.ModelData.Role
  sql:
    fk_column:
      value: text
      note: "Same treatment as ReferenceType above - both resolve via reference_target_class."
    foreign_key:
      rule: "FOREIGN KEY (<column>) REFERENCES <target table>(id)"

UniqueConstraint:
  qualified_name: IlisMeta16.ModelData.UniqueConstraint
  sql:
    unique:
      source: {field: UniqueDef}
      note: >
        Kind=GlobalU (source: {field: Kind}) AND every UniqueDef path
        (PathOrInspFactor.PathEls) a SINGLE PathEl maps to UNIQUE (...) on
        the Class's own table - 2+ PathEls means "->" navigation to
        another table (Kind is always "ReferenceAttr" regardless of hop
        position, path length is the real signal) and stays backlog.
        Kind=LocalU maps too: each UniqueDef path [role_hop, sub_attr]
        becomes a compound UNIQUE (<parent>_fk, sub_attr, ...) on the
        matching BAG/LIST OF child table, including the dominant real
        idiom where the BAG/LIST AND its UNIQUE (LOCAL) are declared on a
        STRUCTURE embedded one level into the Class - see
        mappings/ilismeta16-to-sql-rules.yml's UniqueConstraint entry for
        the qualified child-table naming this case uses.

Constraint:
  qualified_name: IlisMeta16.ModelData.SimpleConstraint
  sql:
    check:
      source: {field: LogicalExpression}
      note: >
        Only Kind=MandC (source: {field: Kind}) with no Percentage
        (source: {field: Percentage}) - a row-local MANDATORY CONSTRAINT.
        LogicalExpression walked by convert/sql.py's _expression_to_sql,
        same supported Expression subset as convert/constraint_eval.py's
        evaluate_expression. Kind=LowPercC/HighPercC (plausibility) and
        any node needing THIS/PARENT/aggregate/function-call context are
        backlog within this same concept - see
        mappings/ilismeta16-to-sql-rules.yml's Constraint entry.
