# Declarative field bindings for the `.ili` -> JSON Schema conversion
# (see docs/jsonschema-conversion-strategy.md and
# mappings/ilismeta16-to-jsonschema-rules.yml for the contract this spec
# fills in). Checked by scripts/validate_conversion_spec.py.
#
# Style mirrors spec/grammar/mapping/*.yml's attribute_bindings: each
# `source` names a real own/inherited IlisMeta16 attribute (verified against
# mappings/ilismeta16-classes.yml by the validator), each `target` names the
# JSON Schema keyword it produces. Implemented by
# src/interlis/convert/jsonschema.py - this file documents the mapping
# decision, it is not executed directly.

NumType:
  qualified_name: IlisMeta16.ModelData.NumType
  json_schema:
    type:
      rule: "integer if Min and Max both parse as decimal-point-free integers, else number"
      note: >
        No dedicated precision/decimals field exists on NumType (own:
        {Min, Max, Circular, Clockwise} only) - same shape heuristic
        already read (not duplicated as a second implementation) from
        xtf/validate.py's _decimal_places.
    minimum:
      source: {field: Min}
    maximum:
      source: {field: Max}
  not_mapped:
    Circular: "arc-related, irrelevant to a scalar JSON Schema attribute"
    Clockwise: "arc-related, irrelevant to a scalar JSON Schema attribute"

TextType:
  qualified_name: IlisMeta16.ModelData.TextType
  json_schema:
    type:
      value: string
    maxLength:
      source: {field: MaxLength}
      note: >
        absent (0..1) -> maxLength omitted, unbounded string. Only applies
        to Kind in {Text, MText} - Kind Name/Uri get their maxLength from
        the fixed bound below instead, since MaxLength is never populated
        for those two grammar alternatives (see Kind entry).
    Kind:
      source: {field: Kind}
      note: >
        Kind=Name -> pattern "^[A-Za-z][A-Za-z0-9_]{0,254}$" + maxLength
        255 (eCH-0031 refhb SS3.2.2 "Namen": Name = Letter {Letter|Digit|
        '_'}; SS3.8.1: NAME (FINAL) = TEXT*255 - exact bound, not a
        heuristic). Kind=Uri -> format "uri" + maxLength 1023 (SS3.8.1:
        URI (FINAL) = TEXT*1023 per RFC 2396). Kind in {Text, MText}:
        no distinguishing JSON Schema keyword applied (both stay a plain
        "string" with the ordinary MaxLength-sourced bound above) - the
        only semantic difference between the two (MTEXT permits CR/LF/tab,
        TEXT does not, SS3.8.1) has no standard JSON Schema equivalent
        worth a bespoke pattern for a single-line-vs-multi-line
        distinction, unlike Name/Uri which have unambiguous, spec-defined
        value ranges.

EnumType:
  qualified_name: IlisMeta16.ModelData.EnumType
  json_schema:
    type:
      value: string
    enum:
      source: {function: "xtf.schema.enum_values(type_instance)"}
      note: >
        Reuses xtf.schema.enum_values() directly (dotted paths, includes
        non-leaf nodes per eCH-0031 SS4.3.11.3) - sorted for deterministic
        output. The "OTHERS" runtime escape value is deliberately excluded
        (see docs/jsonschema-conversion-strategy.md).
  not_mapped:
    Order: "ordered/unordered enumeration - no JSON Schema equivalent needed for value validation"

BooleanType:
  qualified_name: IlisMeta16.ModelData.BooleanType
  json_schema:
    type:
      value: boolean
      note: "own: {} - pure marker type, nothing else to bind"

FormattedType:
  qualified_name: IlisMeta16.ModelData.FormattedType
  json_schema:
    type:
      value: string
      note: "conservative mapping - no pattern derived from Format's predefined-format name"
    format:
      source: {field: Format}
      note: "only for the 3 well-known bare names XMLDate/XMLTime/XMLDateTime -> date/time/date-time (eCH-0118 SS6.15.5) - omitted for any other Format value"
  not_mapped:
    Min: "example/template string bound (shares NumType's Min/Max slot, not a numeric bound here) - irrelevant to a plain string schema"
    Max: "see Min"
  # Struct (FORMAT BASED ON structureRef) is an association role (StructOfFormat),
  # not a class attribute - not listed in not_mapped for that reason, but equally
  # irrelevant to the formatted-string output shape.

BlackboxType:
  qualified_name: IlisMeta16.ModelData.BlackboxType
  json_schema:
    type:
      value: string
    x-blackbox-kind:
      source: {field: Kind}
      note: "Xml/Binary - no native JSON Schema content-shape equivalent, surfaced as an informational marker (RULE #5)"
    contentEncoding:
      source: {field: Kind}
      note: "only for Kind=Binary -> \"base64\" (eCH-0118 SS6.15.6's xsd:base64Binary) - omitted for Kind=Xml"

# A COORD/MULTICOORD attribute -> a GeoJSON/JSON-FG-style position tuple.
# Chosen to already match the eventual .xtf -> JSON-FG position encoding.
CoordType:
  qualified_name: IlisMeta16.ModelData.CoordType
  json_schema:
    type:
      value: array
      note: >
        `Multi` (own BOOLEAN, MULTICOORD) is structural, not a keyword:
        when true, the whole position schema described below is wrapped
        in one more `{"type": "array", "items": <position>}` level
        (_wrap_multi) rather than being surfaced as a marker - the
        nesting alone is a complete, lossless representation.
    prefixItems:
      source: {function: "xtf.schema.coord_axes(type_instance)"}
      note: >
        One entry per axis (association AxisSpec, role Axis - NOT a
        class attribute, hence "function" not "field" here), each a
        NumType instance fed straight into _num_type_schema (reused,
        not duplicated).
    items:
      value: false
      note: "forbid a coordinate beyond what prefixItems declares"
    minItems:
      source: {function: "len(xtf.schema.coord_axes(type_instance))"}
    maxItems:
      source: {function: "len(xtf.schema.coord_axes(type_instance))"}
  not_mapped:
    NullAxis: "rotation/axis-order metadata (ROTATION clause) - irrelevant to the plain position-tuple shape"
    PiHalfAxis: "see NullAxis"
    Multi: "structural (wraps the whole schema in one more array level), not a keyword - see the type note above"

# A POLYLINE/DIRECTED POLYLINE/SURFACE/AREA (+ MULTI* variants) attribute.
LineType:
  qualified_name: IlisMeta16.ModelData.LineType
  json_schema:
    type:
      value: array
    items:
      source: {function: "xtf.schema.line_coord_type(type_instance)"}
      note: >
        Kind in {Polyline, DirectedPolyline}: one CoordType-shaped
        position per array item. Kind in {Surface, Area}: one more
        array level (boundary rings) - each ring itself an array of
        positions. line_coord_type (association LineCoord, walks the
        EXTENDS chain) is reused directly for vertex shape, deliberately
        via _position_schema rather than CoordType's own mapping above
        (a vertex is never itself Multi).
    x-boundary-order:
      value: outer-first
      note: >
        Surface/Area only - the first boundary ring is the outer
        contour, the rest are holes (eCH-0031). No native JSON Schema
        keyword expresses "first item is special".
  not_mapped:
    MaxOverlap: "WITHOUT OVERLAPS > X threshold - a data-quality tolerance, irrelevant to the geometry's JSON shape"
    Multi: "structural (wraps the whole schema in one more array level, MULTIPOLYLINE/MULTISURFACE/MULTIAREA), not a keyword - same as CoordType.Multi above"

# Class.Documentation exists on the metamodel (inherited from MetaElement)
# but is never populated by InterlisModelBuilder - INTERLIS `/** ... */`
# doc comments aren't captured as AST nodes anywhere in
# spec/grammar/mapping/*.yml (grepped, zero attribute_bindings target it).
# A real Class instance's Documentation is therefore always empty - the
# Class mapping uses only Name (-> title), no description field.

Class:
  qualified_name: IlisMeta16.ModelData.Class
  json_schema:
    type:
      value: object
    title:
      source: {field: Name}
    properties:
      source: {function: "xtf.schema.attributes_of(class_instance)"}
      note: >
        Own+inherited scalar attributes only (own name wins over
        inherited, same as xtf.schema.attributes_of()). Each property's
        schema comes from resolving the attribute's type via
        xtf.schema.resolve_attribute() and dispatching on type_kind to
        the NumType/TextType/EnumType mapping above; a type_kind outside
        {NumType, TextType, EnumType} produces
        `{"x-unsupported": type_kind}` instead of being
        dropped (see docs/jsonschema-conversion-strategy.md).
    required:
      source: {function: "resolve_attribute(attr).mandatory"}
      note: >
        One entry per attribute where mandatory is true. Known gap
        (pre-existing in xtf.schema.resolve_attribute, not fixed here -
        see mappings/ilismeta16-to-jsonschema-rules.yml StructureNesting
        note): a structure-typed attribute's `mandatory` is always False,
        since `Class` (unlike `DomainType`) has no own `Mandatory`
        attribute for resolve_attribute to read.

View:
  qualified_name: IlisMeta16.ModelData.View
  json_schema:
    type:
      value: object
    title:
      source: {field: Name}
    properties:
      source: {function: "xtf.schema.attributes_of(view_instance)"}
      note: >
        Reuses the SAME code path as Class.properties above unchanged
        (class_to_json_schema takes any MetaInstance with a
        ClassAttribute list - View EXTENDS Class, ilismeta16-classes.yml
        - no View-specific branch exists in
        src/interlis/convert/jsonschema.py). ClassAttribute itself is
        populated by InterlisModelBuilder._expand_view_all_of/
        _apply_pending_view_all_of (ATTRIBUTE ALL OF <base>;) or the
        already-generic attributeDef handling - see
        mappings/ilismeta16-to-jsonschema-rules.yml, View, for the full
        rationale. Every FormationKind is selected as a root
        (cli.cmd_convert, _SUPPORTED_VIEW_FORMATION_KINDS); x-crud is
        GET-only for every derived View except a plain PROJECTION OF.
    required:
      source: {function: "resolve_attribute(attr).mandatory"}
      note: "Same mechanism as Class.required above, applied to View.ClassAttribute."

# A Class-typed attribute (STRUCTURE nesting) does not inline the
# target class's schema - it references the target's own top-level
# $defs entry, built once per class regardless of how many attributes
# point to it (recursion-safe by construction, see
# mappings/ilismeta16-to-jsonschema-rules.yml).
StructureNesting:
  qualified_name: IlisMeta16.ModelData.Class
  json_schema:
    $ref:
      rule: "#/$defs/<key assigned to the referenced Class's own $defs entry>"
      note: "see StructureNesting in mappings/ilismeta16-to-jsonschema-rules.yml"

# A plain REFERENCE TO X attribute does NOT inline/$ref the target
# class's schema (unlike StructureNesting above) - the XTF wire format
# transfers a reference as a REF="<oid>" XML attribute, never the
# referenced object itself.
ReferenceType:
  qualified_name: IlisMeta16.ModelData.ReferenceType
  json_schema:
    type:
      value: string
      note: "the OID value, matching the XTF wire format's REF=... attribute"
    x-reference-target:
      source: {function: "xtf.schema.reference_target_class(resolved).Name"}
      note: >
        Declared target class name, when resolvable (BaseClass
        association, same mechanism as Role - see rules.yml). Omitted if
        unresolved (e.g. cross-model reference without --repo).
    x-reference-external:
      source: {field: External}
      note: >
        Own BOOLEAN, mandatory (the (EXTERNAL) clause) - via
        xtf.schema.reference_external_status. Marker omitted unless
        true, same RULE #5 presence-only style already used elsewhere.

# An embedded association role (xtf.schema.embedded_roles_of,
# discovered only when class_to_json_schema/model_to_json_schema is given
# a symbol_table) resolves to type_kind="Class" (same shape as
# StructureNesting above) but is mapped like ReferenceType above instead -
# resolve_attribute's target IS ALREADY the Role's target class, and that
# target is always Kind="Class" (a real class instance, transferred via
# REF/OID), never Kind="Structure" - the src/interlis/convert/jsonschema.py
# _is_structure() helper is the single place deciding which of the two
# this block vs. StructureNesting applies, checking the target's OWN Kind
# rather than which function (attributes_of vs embedded_roles_of) produced
# the attribute.
Role:
  qualified_name: IlisMeta16.ModelData.Role
  json_schema:
    type:
      value: string
      note: "same REF/OID representation as ReferenceType above - reference_target_class(resolved) already returns resolved.type_instance directly for a Role"
    x-reference-target:
      source: {function: "xtf.schema.reference_target_class(resolved).Name"}
      note: "identical binding to ReferenceType above - reused as-is, no Role-specific code needed"
    x-reference-external:
      source: {field: EmbeddedTransfer}
      note: >
        Own BOOLEAN, mandatory (roleDef()'s own (EXTERNAL) clause, a
        DIFFERENT own attribute name than ReferenceType.External despite
        the same semantic meaning) - via
        xtf.schema.reference_external_status, which already branches on
        attr being a Role. Marker omitted unless true, same as ReferenceType.
  not_mapped:
    Strongness: "aggregation/composition semantics (association strength) - no JSON Schema equivalent for a bare REF/OID value"
    Ordered: "role-level ordering - not surfaced, unlike MultiValue.Ordered's x-ordered (an embedded role is never array-wrapped, see rules.yml note on cardinality)"
    Multiplicity: "confirmed (rules.yml) embedded_roles_of always selects the non-multi side - no array-wrapping needed for what this concept actually produces"
    Derivates: "derived-role expression - out of scope, same category as formal constraints"

# ABSTRACT structure polymorphism only (see rules.yml Inheritance note for
# the full scope decision, including what stays backlog). qualified_name
# is Class (not the Inheritance association itself, same pattern as
# StructureNesting above): the gating field (Abstract) lives on Class,
# same convention as StructureNesting using Class rather than DomainType.
Inheritance:
  qualified_name: IlisMeta16.ModelData.Class
  json_schema:
    anyOf:
      rule: "one {\"$ref\": \"#/$defs/<key>\"} per concrete (non-abstract) subclass of an Abstract=true STRUCTURE, in place of StructureNesting's single $ref"
      source: {field: Abstract}
      note: >
        Class.Abstract (inherited from ExtendableME) gates this; concrete
        subclasses are found via
        src/interlis/convert/jsonschema.py:_concrete_subclasses (reuses
        xtf.schema.is_class_compatible against every Class registered in
        the given symbol_table - the Inheritance association's Super role
        is a forward-only child->parent pointer, there is no reverse
        link to walk directly). Requires symbol_table to be given to
        class_to_json_schema/model_to_json_schema (same opt-in
        precondition as Role above); without it, or when no concrete
        subclass is found, produces the plain $ref instead (see
        x-abstract below).
    x-abstract:
      source: {field: Abstract}
      note: >
        Marker on the plain-$ref fallback path (no symbol_table given, or
        an Abstract structure with zero concrete subclasses found) -
        RULE #5, never leaves an Abstract structure's $ref looking
        identical to a concrete one's.
# NOT mapped here, stays backlog (see rules.yml Inheritance note): the
# ClassRestriction association role, which would feed attribute-level
# RESTRICTION(...) on a STRUCTURE-typed attribute - zero real corpus
# occurrence and not even captured by InterlisModelBuilder today for this
# construct, so not covered under not_mapped as a real Class attribute
# either (it isn't one - it's an association role, UmlIndex.attribute_exists
# only checks attributes.own/inherited).

MultiValue:
  qualified_name: IlisMeta16.ModelData.MultiValue
  json_schema:
    type:
      value: array
    items:
      source: {function: "getattr(multi_value, 'BaseType', None)"}
      note: "same scalar/$ref dispatch as a plain attribute, applied to BaseType (the element type)"
    minItems:
      source: {field: Multiplicity}
      note: "Multiplicity.Min"
    maxItems:
      source: {field: Multiplicity}
      note: "Multiplicity.Max, omitted when '*' (unbounded)"
    x-ordered:
      source: {field: Ordered}
      note: "True=LIST, False=BAG - no native JSON Schema equivalent, see rules.yml note"
