[project]
name = "ili2ogc"
version = "0.1.0"
authors = [
    {name = "Maxime Collombin", email = "maxime.collombin@netplus.ch"},
]
description = "A pure-Python INTERLIS 2 toolkit: build a live metamodel from .ili, validate .xtf transfers, and convert to/from JSON Schema, OGC JSON-FG, PostgreSQL/GeoPackage SQL, and CQL2-JSON filters, with multi-language (TRANSLATION OF) output"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["interlis", "gis", "geodata", "json-schema", "json-fg", "ogc", "cql2", "sql", "swisstopo"]
dependencies = [
    "antlr4-python3-runtime==4.13.2",
    "jsonschema>=4.23.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/maxcollombin/ili2ogc"
Repository = "https://github.com/maxcollombin/ili2ogc.git"
Issues = "https://github.com/maxcollombin/ili2ogc/issues"

[project.scripts]
interlis = "interlis.cli:main"

[project.optional-dependencies]
dev = [
    "antlr4-tools>=0.2.2",
    "black>=24.0",
    "mypy>=1.11",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruamel-yaml>=0.19.1",
    "ruff>=0.16.2",
]

# Duplicated from [project.optional-dependencies] on purpose: uv installs a
# [dependency-groups] "dev" group by default on `uv sync`/`uv run` (no extra
# flag needed for the uv-based workflow documented in the README), while
# [project.optional-dependencies] keeps `pip install .[dev]` working for a
# contributor not using uv - uv has no single-source way to get both.
[dependency-groups]
dev = [
    "antlr4-tools>=0.2.2",
    "black>=24.0",
    "mypy>=1.11",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruamel-yaml>=0.19.1",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# ANTLR-generated parser/lexer/visitor - never hand-edited, regenerated
# from vendor/interlis-antlr4/*.g4 (same rationale as the ruff exclude
# below). Report-only (docs/testing-strategy.md, Remediation plan phase
# 4): omitting these keeps the number meaningful for hand-authored code
# instead of dominated by autogenerated visitor stubs never exercised
# directly by a real-corpus-driven test.
omit = ["src/interlis/antlr/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
# ANTLR-generated parser/lexer/visitor - never hand-edited, regenerated
# from vendor/interlis-antlr4/*.g4 (see docs/upstream-grammar-changes.md).
extend-exclude = ["src/interlis/antlr", "vendor"]

[tool.ruff.lint]
# E/F/W: flake8 parity (real bugs: undefined names, unused imports, ...).
# I: import sorting. UP: pyupgrade on the >=3.10 floor. FIX/TD: no stray
# TODO/FIXME left in the tree. D: pydocstyle - the project documents only
# the non-obvious "why", so D100-D107 (a docstring on every public member)
# stay off; D400/D401/D403/D415 (trailing period / imperative mood /
# first-word case) also off - a naive autofix mangles identifiers and the
# freeform style is deliberate; D205 off - this project's "one-line summary
# then the why" convention keeps the summary on a single physical line even
# past 88 chars, which fights the E501 wrap.
select = ["E", "F", "W", "I", "UP", "FIX", "TD", "D"]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "D205", "D400", "D401", "D403", "D415",
    "TD002", "TD003",  # no per-TODO author/issue-link requirement
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["interlis"]

[tool.ruff.lint.per-file-ignores]
# A test's name and body say what it checks; docstring summary-line layout
# carries little there.
"tests/**" = ["D205", "D209"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312", "py313"]
extend-exclude = "src/interlis/antlr|vendor"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true
exclude = ["^src/interlis/antlr/", "^vendor/"]

[tool.hatch.build.targets.wheel]
packages = ["src/interlis"]

# Embarque les donnees spec/mapping dans le wheel (interlis.cli les charge
# via importlib.resources a l'execution) - source des fichiers laissee a la
# racine du depot pour ne pas casser le pipeline de maintenance existant
# (scripts/) qui les reference a cet emplacement. Liste explicite plutot
# que le dossier mappings/ entier : seuls les 6 fichiers ilismeta16-*.yml
# effectivement lus a l'execution (UML_FILES + kind-values.yml, voir
# src/interlis/spec/uml_index.py et src/interlis/metamodel/uml_schema.py)
# sont embarques, pas antlr-rule-index.yml/grammar-rules.yml/
# ilismeta16-model.yml (tooling de dev, jamais lus par le runtime).
[tool.hatch.build.targets.wheel.force-include]
"spec/grammar/mapping" = "interlis/spec_data/grammar/mapping"
"mappings/ilismeta16-classes.yml" = "interlis/mappings_data/ilismeta16-classes.yml"
"mappings/ilismeta16-datatypes.yml" = "interlis/mappings_data/ilismeta16-datatypes.yml"
"mappings/ilismeta16-associations.yml" = "interlis/mappings_data/ilismeta16-associations.yml"
"mappings/ilismeta16-enumerations.yml" = "interlis/mappings_data/ilismeta16-enumerations.yml"
"mappings/ilismeta16-extensions.yml" = "interlis/mappings_data/ilismeta16-extensions.yml"
"mappings/ilismeta16-kind-values.yml" = "interlis/mappings_data/ilismeta16-kind-values.yml"
