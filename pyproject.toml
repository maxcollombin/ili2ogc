[project]
name = "interlis-runtime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "antlr4-python3-runtime==4.13.2",
    "antlr4-tools>=0.2.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
interlis = "interlis.cli:main"

[dependency-groups]
dev = [
    "antlr4-tools>=0.2.2",
    "pytest>=8.0.0",
    "ruamel-yaml>=0.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interlis"]
